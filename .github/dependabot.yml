version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - JavaScript
    groups:
      buf-connect:
        patterns:
          - "@bufbuild/*"
          - "@connectrpc/*"
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "typescript"
          - "@types/*"
      # First matching group wins, so buf-connect and dev-tooling stay separate.
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # "/" covers .github/workflows. The composite action under
    # .github/actions carries its own SHA pins and is only scanned when listed.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/infrastructure
    groups:
      github-actions:
        patterns:
          - "*"

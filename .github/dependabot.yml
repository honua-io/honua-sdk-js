version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - JavaScript
    groups:
      buf-connect:
        patterns:
          - "@bufbuild/*"
          - "@connectrpc/*"
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "typescript"
          - "@types/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/infrastructure

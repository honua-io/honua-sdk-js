name: Attest a published npm tarball
description: >
  Verify that the registry serves exactly the tarball this run packed and
  published, then attest SLSA provenance and a CycloneDX SBOM for those bytes.
  A composite action (not a reusable workflow) so the Sigstore signer identity
  stays the calling publish workflow, which honua-release's post-gate collector
  names as the exact signer workflow.

inputs:
  tarball:
    description: Path to the tarball this run handed to `npm publish`.
    required: true
  package-name:
    description: npm package name.
    required: true
  package-version:
    description: npm package version.
    required: true

runs:
  using: composite
  steps:
    - name: Verify the registry serves these exact bytes
      shell: bash
      env:
        TARBALL: ${{ inputs.tarball }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -euo pipefail
        test -f "$TARBALL"
        local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
        # Registry metadata can take many minutes to propagate after publish.
        deadline=$((SECONDS + 45 * 60))
        delay=15
        while true; do
          registry_integrity="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity 2>/dev/null || true)"
          if [[ -n "$registry_integrity" ]]; then
            break
          fi
          if (( SECONDS >= deadline )); then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} never became visible on the registry"
            exit 1
          fi
          sleep "$delay"
          delay=$((delay < 120 ? delay * 2 : 120))
        done
        if [[ "$registry_integrity" != "$local_integrity" ]]; then
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION}: registry integrity ${registry_integrity} is not this run's tarball ${local_integrity}; refusing to attest bytes this run did not publish"
          exit 1
        fi
        sbom_root="${RUNNER_TEMP}/sbom-$(basename "$TARBALL" .tgz)"
        rm -rf "$sbom_root"
        mkdir -p "$sbom_root"
        tar -xzf "$TARBALL" -C "$sbom_root"
        echo "SBOM_ROOT=${sbom_root}" >> "$GITHUB_ENV"
        echo "SBOM_FILE=${sbom_root}.cdx.json" >> "$GITHUB_ENV"

    # CycloneDX, not SPDX: actions/attest labels SPDX as .../Document/v2.3,
    # while the collector accepts https://cyclonedx.org/bom.
    - name: Generate the package SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      env:
        # Directory scans skip package.json manifests by default; an unpacked
        # tarball has no lockfile, so select the manifest cataloger explicitly.
        SYFT_SELECT_CATALOGERS: "+javascript-package-cataloger"
      with:
        path: ${{ env.SBOM_ROOT }}
        format: cyclonedx-json
        output-file: ${{ env.SBOM_FILE }}
        upload-artifact: false
        upload-release-assets: false

    - name: Refuse an empty SBOM
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        node -e '
          const bom = JSON.parse(require("fs").readFileSync(process.env.SBOM_FILE, "utf8"));
          const named = (bom.components ?? []).some((c) => c.type === "library" && c.name === process.env.PACKAGE_NAME);
          if (bom.bomFormat !== "CycloneDX" || !named) {
            console.error(`::error::SBOM does not describe ${process.env.PACKAGE_NAME}`);
            process.exit(1);
          }
        '

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.tarball }}

    - name: Attest the SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: ${{ inputs.tarball }}
        sbom-path: ${{ env.SBOM_FILE }}

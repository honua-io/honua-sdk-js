name: PR issue disposition

on:
  pull_request:
    branches:
      - trunk
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request whose current metadata must be validated
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

# No concurrency group: this is a required check, and a cancelled run left as the
# newest check run of that name blocks merging even when another run passed. Each run
# re-reads the pull request's current metadata and finishes in seconds, so every run
# completes and the newest one reflects the current state.

jobs:
  issue-disposition:
    name: PR Issue Disposition
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      # This PR-associated job is the required merge check. It deliberately
      # executes only the protected base revision's validator, never head code.
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.3"

      - name: Validate current issue disposition
        working-directory: trusted-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/check-pr-issue-disposition.mjs
          else
            node scripts/check-pr-issue-disposition.mjs \
              --repository "${{ github.repository }}" \
              --pull-request "${{ inputs.pull_request_number }}"
          fi

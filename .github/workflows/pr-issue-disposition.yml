name: PR issue disposition

on:
  pull_request:
    branches:
      - trunk
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-issue-disposition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-disposition:
    name: PR Issue Disposition
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # This PR-associated job is the required merge check. It deliberately
      # executes only the protected base revision's validator, never head code.
      - name: Check out trusted policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20.19.0"

      - name: Validate current issue disposition
        working-directory: trusted-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-issue-disposition.mjs

name: create-honua-app Time To First Map

# Scheduled registry lane for the scaffold funnel (#958 AC-002): scaffold a
# starter on a clean machine, install its pinned dependencies from npm, build
# it, serve the build, and drive Chromium until a MapLibre canvas has rendered
# features — all inside a two-minute budget. Required PR CI stays offline and
# only compiles the templates.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      published_default:
        description: "Run both installed published-CLI defaults from the recorded release cohort"
        required: false
        default: false
        type: boolean
      sdk_version:
        description: "Exact published SDK to certify; empty preserves the promoted channel/fallback"
        required: false
        default: ""
        type: string
      template:
        description: "Template id to measure (defaults to the manifest default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"

jobs:
  time-to-first-map:
    name: Scaffold to rendered map
    if: ${{ !inputs.published_default }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify the scaffold contract
        run: npm run create-app:verify

      - name: Measure scaffold to first map
        env:
          HONUA_CREATE_APP_LIVE_ENABLED: "true"
          CREATE_APP_TEMPLATE: ${{ inputs.template }}
          CREATE_APP_SDK_VERSION: ${{ inputs.sdk_version }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${CREATE_APP_TEMPLATE}" ]]; then
            args+=(--template "${CREATE_APP_TEMPLATE}")
          fi
          if [[ -n "${CREATE_APP_SDK_VERSION}" ]]; then
            args+=(--sdk-version "${CREATE_APP_SDK_VERSION}")
          fi
          npm run create-app:time-to-map -- "${args[@]}"

      - name: Upload time-to-first-map evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: create-honua-app-time-to-map
          path: test-results/create-honua-app-time-to-map.json
          if-no-files-found: error
          retention-days: 90

  published-default:
    name: Published default CLI (${{ matrix.template }})
    if: ${{ inputs.published_default }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [vanilla-ts, react-ts]
    steps:
      - name: Refuse overrides in default-selection qualification
        env:
          SDK_OVERRIDE: ${{ inputs.sdk_version }}
          TEMPLATE_OVERRIDE: ${{ inputs.template }}
        run: |
          test -z "$SDK_OVERRIDE" && test -z "$TEMPLATE_OVERRIDE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published identities and run the unchanged default-CLI proof
        env:
          TEMPLATE: ${{ matrix.template }}
        run: node scripts/qualify-published-scaffold.mjs "$TEMPLATE"
      - name: Retain original consumer inputs, commands and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-default-${{ matrix.template }}
          path: test-results/published-default/
          if-no-files-found: error
          retention-days: 90

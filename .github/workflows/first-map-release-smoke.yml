name: First Map Release Smoke

# Dispatch-only (#768). This workflow used to trigger on `release: published`,
# but Release Please publishes the release on its version-bump commit, whose
# derived sample artifacts are stale by construction, and actions/checkout pins
# the release event's payload SHA -- so a release-triggered run always verified
# the unsealed tree no matter how long it first waited for a reseal.
# release-please.yml now dispatches this workflow against the js-sdk-* tag after
# moving that tag onto the resealed commit. A manually created release must
# dispatch this workflow at its tag the same way.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  # No derived-artifact reseal dispatch here (#768): a reseal always lands as a
  # NEW commit on trunk, so it cannot freshen the ref this run checked out.
  # Whatever this run verifies must already be sealed -- the release-seal gate
  # below asserts exactly that, in seconds, before the browser matrix runs.
  source-packed-parity:
    name: Three-engine smoke and source-packed parity
    runs-on: ubuntu-latest
    env:
      HONUA_FIRST_MAP_RELEASE_MATRIX: "true"
    steps:
      # Full history: strict sample verification resolves the receipt's
      # sourceRevision (a regeneration-chain commit, never the trunk tip), so a
      # depth-1 clone fails with "source revision does not name an existing
      # commit". publish-js-sdk.yml checks out with full history for the same
      # reason.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Release-tag sealing gate (#768): assert up front that the ref under
      # test is one a downstream consumer could re-derive (receipts sealed to
      # this tree, derived artifacts stamping this version) instead of spending
      # the whole browser matrix to reach the same conclusion cryptically.
      - name: Verify release seal
        run: |
          set -euo pipefail
          seal_args=(check)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags --force origin \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            seal_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          node scripts/release-seal.mjs "${seal_args[@]}"

      - run: npx playwright install --with-deps chromium firefox webkit
      # Headless Firefox has no compositor and therefore no WebGL, so the
      # release matrix's Firefox project runs headed (playwright.first-map.config.mjs)
      # under a virtual display; xvfb-run gives it a real X server to render
      # into. Chromium and WebKit stay headless and are unaffected. See #687.
      - run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' -- npm run test:playwright:quickstart
      - run: npm run demo:quickstart:parity
      - run: npm run demo:quickstart:copyability
      - run: npm run samples:run -- verify --sample maplibre-quickstart --sdk-mode source
      - run: npm run samples:run -- verify --sample maplibre-quickstart --sdk-mode packed

      - name: Upload deterministic browser and bundle observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-sdk-first-map-release-smoke
          path: |
            .tmp/playwright-first-map-output
            examples/maplibre-quickstart/dist/first-map-bundle-budget.json
            examples/maplibre-quickstart/dist/honua-sample-sdk-resolution.json
          if-no-files-found: warn
          retention-days: 30

name: First Map Release Smoke

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  # Derived artifacts regenerate on a schedule, not per merge (#746), so force
  # a refresh before strictly verifying evidence. The dispatch is a fast no-op
  # when trunk's tip is already a regeneration merge.
  ensure-fresh-evidence:
    name: Ensure derived artifacts are fresh
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await derived-artifact regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$(gh workflow run regenerate-derived-artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref trunk)"
          if [[ ! "$run_url" =~ /actions/runs/([0-9]+)$ ]]; then
            echo "Could not identify regeneration run from: $run_url"
            exit 1
          fi
          gh run watch "${BASH_REMATCH[1]}" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 15

  source-packed-parity:
    name: Three-engine smoke and source-packed parity
    needs: ensure-fresh-evidence
    runs-on: ubuntu-latest
    env:
      HONUA_FIRST_MAP_RELEASE_MATRIX: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Headless Firefox has no compositor and therefore no WebGL, so the
      # release matrix's Firefox project runs headed (playwright.first-map.config.mjs)
      # under a virtual display; xvfb-run gives it a real X server to render
      # into. Chromium and WebKit stay headless and are unaffected. See #687.
      - run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' -- npm run test:playwright:quickstart
      - run: npm run demo:quickstart:parity
      - run: npm run demo:quickstart:copyability
      - run: npm run samples:run -- verify --sample maplibre-quickstart --sdk-mode source
      - run: npm run samples:run -- verify --sample maplibre-quickstart --sdk-mode packed

      - name: Upload deterministic browser and bundle observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-sdk-first-map-release-smoke
          path: |
            .tmp/playwright-first-map-output
            examples/maplibre-quickstart/dist/first-map-bundle-budget.json
            examples/maplibre-quickstart/dist/honua-sample-sdk-resolution.json
          if-no-files-found: warn
          retention-days: 30

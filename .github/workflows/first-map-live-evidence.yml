name: First Map Anonymous Live Evidence

# Scheduled-only public-network proof. Required PR fixture lanes remain
# externally network-blocked and never substitute this observation.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"

jobs:
  anonymous-live:
    name: Canonical public GeoServices journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Observe the fixed anonymous endpoint through First Map
        env:
          HONUA_FIRST_MAP_LIVE_ENABLED: "true"
        run: npm run evidence:first-map:live

      - name: Upload source, freshness, cache, degradation, and visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honua-sdk-first-map-live-evidence
          path: |
            examples/maplibre-quickstart/evidence/live.v1.json
            examples/maplibre-quickstart/evidence/live.v1.png
          if-no-files-found: error
          retention-days: 90

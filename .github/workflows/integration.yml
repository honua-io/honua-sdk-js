name: SDK Integration

# The integration lane runs the protocol surface matrix
# (test/integration/surfaces/*.integration.ts) and the LIVE contract
# conformance round-trip against a real Honua Server. It runs in one of two
# modes:
#
#   * self-contained (default on push / schedule / dispatch): the workflow
#     spins the PINNED `honua-server:nightly` container plus Redis and Postgres
#     INSIDE the job, applies the vendored seed, waits for health, and points
#     the suites at it. No external environment and no new secrets — image
#     pulls use the workflow GITHUB_TOKEN (packages: read), superseding the
#     old connect-only decision (honua-sdk-js#39) for CI (honua-sdk-js#361).
#
#   * external-override: when a base URL is configured (dispatch `base_url`
#     input or the `HONUA_INTEGRATION_BASE_URL` repo variable) the lane connects
#     to that already-running, already-seeded deployment instead — for testing
#     real staging/prod servers.
#
# The workflow summary always states which mode ran and the executed suite/test
# counts; a push / schedule run never reports a silent green skip.

on:
  push:
    branches:
      - trunk
      - "release/**"
  # Nightly self-contained run of the full lane (surfaces + live conformance).
  # Failures are loud (job failure), never a summary note — REQ-004.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "External Honua Server base URL (overrides self-contained mode). Server must be running and seeded."
        required: false
      seed_profile:
        description: "Seed profile label recorded into integration-meta.json (external mode only; overrides repo variable)."
        required: false
      server_commit:
        description: "Honua Server commit SHA recorded into integration-meta.json (external mode). Leave blank when unknown — do not set to the SDK commit."
        required: false
      candidate_cut_at:
        description: "Frozen candidate cut timestamp for external certification evidence."
        required: false
      server_image:
        description: "Immutable image digest actually deployed by the external target (required with base_url)."
        required: false
      deployment_target:
        description: "Stable name of the external deployment being certified (required with base_url)."
        required: false
      fixtures_version:
        description: "geospatial-grpc conformance fixtures version to pin (overrides repo variable / default)."
        required: false

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: "20.19.0"
  # Pinned self-contained server image + fixtures. A repo variable overrides the
  # pin so it can be advanced without a code change; advancing it is a
  # deliberate, reviewable change. The vendored seed
  # (test/integration/seed/places-roads-v1.sql) is refreshed 1:1 with this pin.
  #
  # Pinned to the current nightly candidate identity. Repository overrides must
  # also be immutable digest references so evidence cannot drift between runs.
  HONUA_INTEGRATION_SERVER_IMAGE: ${{ vars.HONUA_INTEGRATION_SERVER_IMAGE || 'ghcr.io/honua-io/honua-server@sha256:78e3088d64d832d3e2752c87d80bfcad201b414f4525989ca5d9a242cd5fee8a' }}
  HONUA_INTEGRATION_SERVER_COMMIT: ${{ vars.HONUA_INTEGRATION_SERVER_COMMIT || '6d13c20fdf131a04cdfe2658ff84d3b55c3f5b76' }}
  HONUA_CANDIDATE_CUT_AT: ${{ vars.HONUA_CANDIDATE_CUT_AT || '2026-08-20T07:58:03Z' }}
  HONUA_SELF_CONTAINED_IDENTITY_OVERRIDE_INVALID: ${{ (vars.HONUA_INTEGRATION_SERVER_IMAGE != '' || vars.HONUA_INTEGRATION_SERVER_COMMIT != '' || vars.HONUA_CANDIDATE_CUT_AT != '') && !(vars.HONUA_INTEGRATION_SERVER_IMAGE != '' && vars.HONUA_INTEGRATION_SERVER_COMMIT != '' && vars.HONUA_CANDIDATE_CUT_AT != '') }}
  HONUA_CONFORMANCE_FIXTURES_VERSION: ${{ github.event.inputs.fixtures_version || vars.HONUA_CONFORMANCE_FIXTURES_VERSION || '0.1.0-alpha.3' }}
  # Deterministic container passwords for the self-contained stack. These are
  # NOT secrets (the stack is ephemeral and never exposed off the runner); the
  # encryption master-key/salt are the same fixed test values honua-server's own
  # client-compat compose uses.
  SELF_CONTAINED_PG_PASSWORD: ci_password
  SELF_CONTAINED_ADMIN_PASSWORD: CiIntegrationAdmin123!
  SELF_CONTAINED_ENC_MASTER_KEY: test-master-key-that-is-at-least-32-characters-long-for-security
  SELF_CONTAINED_ENC_SALT: dGVzdC1zYWx0LWZvci1lbmNyeXB0aW9uLXRlc3RpbmctcHVycG9zZXM=

jobs:
  integration:
    name: Integration + Conformance
    runs-on: ubuntu-24.04
    env:
      # External-override credentials/target (empty in self-contained mode). The
      # self-contained mode overwrites the base URL and surface coordinates via
      # $GITHUB_ENV after the server is up.
      HONUA_INTEGRATION_BASE_URL: ${{ github.event.inputs.base_url || vars.HONUA_INTEGRATION_BASE_URL }}
      HONUA_INTEGRATION_API_KEY: ${{ secrets.HONUA_INTEGRATION_API_KEY }}
      HONUA_INTEGRATION_SEED_PROFILE: ${{ github.event.inputs.seed_profile || vars.HONUA_INTEGRATION_SEED_PROFILE || 'places-roads-v1' }}
      HONUA_INTEGRATION_SERVICE_ID: ${{ vars.HONUA_INTEGRATION_SERVICE_ID || 'test_service_gw0' }}
      HONUA_INTEGRATION_LAYER_ID: ${{ vars.HONUA_INTEGRATION_LAYER_ID || '1000' }}
      HONUA_INTEGRATION_COLLECTION_ID: ${{ vars.HONUA_INTEGRATION_COLLECTION_ID || '1000' }}
      HONUA_INTEGRATION_TILE_MATRIX_SET: ${{ vars.HONUA_INTEGRATION_TILE_MATRIX_SET || 'WebMercatorQuad' }}
      HONUA_INTEGRATION_SERVER_COMMIT_OVERRIDE: ${{ github.event.inputs.server_commit || vars.HONUA_INTEGRATION_SERVER_COMMIT }}
      HONUA_CANDIDATE_CUT_AT_OVERRIDE: ${{ github.event.inputs.candidate_cut_at || vars.HONUA_CANDIDATE_CUT_AT }}
      HONUA_INTEGRATION_EXTERNAL_SERVER_IMAGE: ${{ github.event.inputs.server_image || vars.HONUA_INTEGRATION_EXTERNAL_SERVER_IMAGE }}
      HONUA_DEPLOYMENT_TARGET_OVERRIDE: ${{ github.event.inputs.deployment_target || vars.HONUA_INTEGRATION_DEPLOYMENT_TARGET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Decide mode. External when a base URL is configured (dispatch input or
      # repo variable); self-contained otherwise. Self-contained needs no
      # secret — that is the point.
      - name: Resolve run mode
        id: mode
        run: |
          if [ -n "${HONUA_INTEGRATION_BASE_URL:-}" ]; then
            echo "mode=external" >> "$GITHUB_OUTPUT"
            echo "::notice::Integration lane running in EXTERNAL-OVERRIDE mode against ${HONUA_INTEGRATION_BASE_URL}"
            if [ -z "${HONUA_INTEGRATION_API_KEY:-}" ]; then
              echo "::error::External mode requires the HONUA_INTEGRATION_API_KEY secret (matching the server's HONUA_ADMIN_PASSWORD)."
              exit 1
            fi
            if ! [[ "${HONUA_INTEGRATION_SERVER_COMMIT_OVERRIDE:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::External certification requires the deployed Honua Server's full 40-character commit SHA."
              exit 1
            fi
            if [ -z "${HONUA_CANDIDATE_CUT_AT_OVERRIDE:-}" ]; then
              echo "::error::External certification requires the frozen candidate_cut_at timestamp."
              exit 1
            fi
            if ! [[ "${HONUA_INTEGRATION_EXTERNAL_SERVER_IMAGE:-}" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "::error::External certification requires the deployed server image as an immutable @sha256 digest."
              exit 1
            fi
            if [ -z "${HONUA_DEPLOYMENT_TARGET_OVERRIDE:-}" ]; then
              echo "::error::External certification requires a stable deployment_target."
              exit 1
            fi
          else
            echo "mode=self-contained" >> "$GITHUB_OUTPUT"
            echo "::notice::Integration lane running in SELF-CONTAINED mode (pinned ${HONUA_INTEGRATION_SERVER_IMAGE} + Redis + Postgres)"
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.mode == 'self-contained'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Bring up Postgres + Redis + the pinned server, seed BEFORE the server
      # boots (mirroring honua-server's client-compat compose ordering so the
      # activated Metadata v2 snapshot covers the seeded service), then health-
      # gate with a bounded wait and a container-log dump on timeout (NFR-002).
      - name: Start self-contained Honua Server
        id: server
        if: steps.mode.outputs.mode == 'self-contained'
        run: |
          set -euo pipefail
          NET=honua-integration
          PG_DB=honua_integration
          docker network create "$NET"

          docker run -d --name honua-pg --network "$NET" \
            -e POSTGRES_DB="$PG_DB" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="$SELF_CONTAINED_PG_PASSWORD" \
            -e POSTGIS_GDAL_ENABLED_DRIVERS=ENABLE_ALL \
            postgis/postgis:16-3.4

          docker run -d --name honua-redis --network "$NET" \
            redis:7.4-alpine redis-server --appendonly no

          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            if docker exec honua-pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
            if [ "$i" -eq 30 ]; then echo "::error::Postgres did not become ready"; docker logs honua-pg; exit 1; fi
          done

          echo "Applying vendored seed (registers test_service / layer 0, activates the v2 snapshot last)..."
          docker run --rm --network "$NET" \
            -e PGPASSWORD="$SELF_CONTAINED_PG_PASSWORD" \
            -v "${GITHUB_WORKSPACE}/test/integration/seed:/seed:ro" \
            postgres:16 \
            psql -v ON_ERROR_STOP=1 -h honua-pg -U postgres -d "$PG_DB" -f /seed/places-roads-v1.sql

          if [ "${HONUA_SELF_CONTAINED_IDENTITY_OVERRIDE_INVALID}" = "true" ]; then
            echo "::error::HONUA_INTEGRATION_SERVER_IMAGE, HONUA_INTEGRATION_SERVER_COMMIT, and HONUA_CANDIDATE_CUT_AT must be overridden together"
            exit 1
          fi
          node --input-type=module -e \
            'import { validateIdentityOverrideEnvironment } from "./scripts/protocol-certification-fragment.mjs"; validateIdentityOverrideEnvironment(process.env);'
          echo "Starting Honua Server (${HONUA_INTEGRATION_SERVER_IMAGE})..."
          docker run -d --name honua-server --network "$NET" -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e Kestrel__Endpoints__Http__Protocols=Http1AndHttp2 \
            -e PUBLIC_BASE_URL=http://localhost:8080 \
            -e HONUA_ADMIN_PASSWORD="$SELF_CONTAINED_ADMIN_PASSWORD" \
            -e "ConnectionStrings__DefaultConnection=Server=honua-pg;Port=5432;Database=${PG_DB};User Id=postgres;Password=${SELF_CONTAINED_PG_PASSWORD};" \
            -e "ConnectionStrings__honua=Server=honua-pg;Port=5432;Database=${PG_DB};User Id=postgres;Password=${SELF_CONTAINED_PG_PASSWORD};" \
            -e ConnectionStrings__Redis=honua-redis:6379 \
            -e Security__ConnectionEncryption__MasterKey="$SELF_CONTAINED_ENC_MASTER_KEY" \
            -e Security__ConnectionEncryption__Salt="$SELF_CONTAINED_ENC_SALT" \
            -e HostValidation__AllowedHosts__0=localhost \
            -e HostValidation__AllowedHosts__1=127.0.0.1 \
            "$HONUA_INTEGRATION_SERVER_IMAGE"

          echo "Waiting for server readiness (bounded)..."
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz/ready >/dev/null 2>&1; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' honua-server 2>/dev/null)" != "true" ]; then
              echo "::error::Honua Server container exited before becoming ready"; break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Honua Server did not report ready within the timeout; dumping logs"
            docker logs honua-server || true
            docker logs honua-pg || true
            exit 1
          fi

          # Point the suites at the in-workflow server and the seed's actual
          # coordinates (test_service / layer 0 / collection 0 — what the
          # vendored seed registers). The admin capabilities probe authenticates
          # with the admin password as the API key.
          {
            echo "HONUA_INTEGRATION_BASE_URL=http://localhost:8080"
            echo "HONUA_INTEGRATION_API_KEY=${SELF_CONTAINED_ADMIN_PASSWORD}"
            echo "HONUA_INTEGRATION_SERVICE_ID=test_service"
            echo "HONUA_INTEGRATION_LAYER_ID=0"
            echo "HONUA_INTEGRATION_COLLECTION_ID=0"
            echo "HONUA_INTEGRATION_IMAGE_SERVICE_ID=test_service"
            echo "HONUA_DEPLOYMENT_TARGET=local-docker"
            echo "HONUA_INTEGRATION_SERVER_IMAGE=${HONUA_INTEGRATION_SERVER_IMAGE}"
            echo "HONUA_INTEGRATION_SERVER_COMMIT=${HONUA_INTEGRATION_SERVER_COMMIT}"
          } >> "$GITHUB_ENV"

      # In external mode, publish the pinned image/commit metadata too so the
      # uploaded artifact records the target's provenance consistently.
      - name: Record external-mode provenance
        if: always() && steps.mode.outputs.mode == 'external'
        run: |
          {
            echo "HONUA_INTEGRATION_SERVER_IMAGE=${HONUA_INTEGRATION_EXTERNAL_SERVER_IMAGE}"
            echo "HONUA_INTEGRATION_SERVER_COMMIT=${HONUA_INTEGRATION_SERVER_COMMIT_OVERRIDE:-}"
            echo "HONUA_CANDIDATE_CUT_AT=${HONUA_CANDIDATE_CUT_AT_OVERRIDE:-}"
            echo "HONUA_DEPLOYMENT_TARGET=${HONUA_DEPLOYMENT_TARGET_OVERRIDE}"
            echo "HONUA_CERTIFICATION_EXTERNAL=true"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # External targets may not be up yet; self-contained already waited on
      # /healthz/ready. A quick liveness re-check keeps the failure actionable.
      - name: Wait for Honua Server health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${HONUA_INTEGRATION_BASE_URL}/healthz/live" >/dev/null 2>&1; then
              echo "Honua Server is healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::Honua Server at ${HONUA_INTEGRATION_BASE_URL} did not report healthy within timeout"
          if [ "${{ steps.mode.outputs.mode }}" = "self-contained" ]; then docker logs honua-server || true; fi
          exit 1

      - name: Fetch pinned conformance fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x conformance/fetch-fixtures.sh
          conformance/fetch-fixtures.sh --version "${HONUA_CONFORMANCE_FIXTURES_VERSION}" --dest "${GITHUB_WORKSPACE}/conformance-fixtures"
          echo "HONUA_CONFORMANCE_FIXTURES_DIR=${GITHUB_WORKSPACE}/conformance-fixtures" >> "$GITHUB_ENV"

      - name: Capture certification execution start
        run: echo "HONUA_CERTIFICATION_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run integration surfaces
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile=test-results/integration-vitest.json

      - name: Run protocol certification unit tests
        run: node --test test/protocol-certification-fragment.test.mjs

      - name: Run live conformance round-trip
        if: always()
        run: npm run test:conformance -- --reporter=default --reporter=json --outputFile=test-results/conformance-vitest.json

      - name: Emit protocol certification fragment
        if: always()
        env:
          HONUA_EVIDENCE_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/protocol-certification-fragment.mjs

      - name: Dump server logs on failure
        if: ${{ failure() && steps.mode.outputs.mode == 'self-contained' }}
        run: |
          echo "::group::honua-server logs"; docker logs honua-server || true; echo "::endgroup::"
          echo "::group::postgres logs"; docker logs honua-pg || true; echo "::endgroup::"

      - name: Upload integration metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-meta
          path: |
            test-results/integration-meta.json
            test-results/integration-vitest.json
            test-results/conformance-vitest.json
            test-results/protocol-certification-fragment.json
          if-no-files-found: warn

      # The summary distinguishes EXECUTED (self-contained | external) from a
      # skip, and prints suite + test counts so a push / schedule run can never
      # read as a silent green (REQ-005).
      - name: Append integration summary
        if: always()
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return undefined; } };
          const meta = read("test-results/integration-meta.json");
          const surfaces = read("test-results/integration-vitest.json");
          const conf = read("test-results/conformance-vitest.json");
          const mode = process.env.RUN_MODE ?? "unknown";
          const counts = (r) => r
            ? `${r.numPassedTests ?? 0} passed, ${r.numFailedTests ?? 0} failed, ${r.numPendingTests ?? 0} skipped (of ${r.numTotalTests ?? 0})`
            : "no results file";
          const lines = [
            "## SDK Integration",
            "",
            `**Mode: EXECUTED (${mode === "self-contained" ? "self-contained in-workflow server" : "external-override"})**`,
            "",
            `- Surfaces: ${counts(surfaces)}`,
            `- Conformance round-trip: ${counts(conf)}`,
          ];
          if (meta) {
            const exercised = (meta.surfaces ?? []).filter((s) => s.status === "exercised").length;
            const skipped = (meta.surfaces ?? []).filter((s) => s.status === "skipped").length;
            lines.push(
              "",
              `- SDK package: \`${meta.sdkPackage}@${meta.sdkVersion}\``,
              `- Server: \`${meta.serverVersion ?? "unknown"}\` (channel \`${meta.serverReleaseChannel ?? "unknown"}\`), image \`${meta.serverImage ?? "unknown"}\`, commit \`${meta.serverCommit ?? "unknown"}\``,
              `- Base URL: \`${meta.baseUrl}\` · seed \`${meta.seedProfile}\` · service/layer \`${meta.serviceId}\`/\`${meta.layerId}\` · collection \`${meta.collectionId}\``,
              `- Fixtures: \`${meta.conformanceFixturesVersion ?? "unknown"}\``,
              "",
              `### Surfaces (${exercised} exercised, ${skipped} skipped)`,
              "",
              "| Surface | Status | Reason |",
              "| --- | --- | --- |",
              ...(meta.surfaces ?? []).map((e) => `| \`${e.surface}\` | ${e.status} | ${e.reason ?? ""} |`),
            );
          } else {
            lines.push("", "> integration-meta.json was not produced (server health / setup failed before any surface ran).");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          EOF

      - name: Tear down self-contained stack
        if: ${{ always() && steps.mode.outputs.mode == 'self-contained' }}
        run: |
          docker rm -f honua-server honua-pg honua-redis >/dev/null 2>&1 || true
          docker network rm honua-integration >/dev/null 2>&1 || true

  conformance-guardrail:
    name: Conformance Drift Guardrail
    runs-on: ubuntu-24.04
    # Effectiveness guardrail — ALWAYS runs, independent of the server lane.
    # Proves the conformance gate catches a mutated golden (renamed/removed
    # field, type change, dropped geometry/attribute, flipped
    # exceededTransferLimit, wrong totalCount) and is not trivially always-green.
    # Kept as its own job so a server-bring-up flake in `integration` never
    # masks a regression in the drift detector itself.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify drift detection (negative test)
        run: npx vitest run test/conformance/drift-detection.test.ts

      - name: Record guardrail summary
        if: always()
        run: |
          {
            echo "## SDK Contract Conformance — Drift Guardrail"
            echo ""
            echo "The drift-detection negative test ran independently of the live lane,"
            echo "proving the conformance gate catches a mutated golden. The LIVE"
            echo "conformance round-trip executes in the \`Integration + Conformance\` job"
            echo "against the in-workflow (or external) server."
          } >> "$GITHUB_STEP_SUMMARY"

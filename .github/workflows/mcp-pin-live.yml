name: Generated MCP client pin

# Scheduled registry lane for the terminal MCP client configuration pin
# (#1401). `honua admin install local` writes
# `npx -y --package @honua/mcp-server@<version> honua-mcp-proxy` into `.mcp.json`
# and `claude_desktop_config.json`; a pin that only exists in this repository's
# release lineage produces a configuration that cannot install on a clean
# machine, which is exactly how `0.1.7-beta.0` - tagged here, never published -
# shipped. Required PR CI stays offline: `test/verify-mcp-pin.test.ts` proves
# the lineage and never touches the network.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  verify-pin:
    name: Resolve the pinned candidate from the public registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Verify the pin resolves and its integrity matches
        run: npm run verify:mcp-pin:live

      # Resolving is not enough. @honua/mcp-server peer-depends on
      # @honua/sdk-js, so the pin and the SDK are a pair, and npm's default
      # resolver rejects a pair whose peer range excludes the SDK beside it --
      # which is how the published pair spent twelve days uninstallable (#1529).
      # Install both halves from the registry with no flags at all.
      - name: Verify the published pair co-installs with default npm resolution
        run: npm run verify:client-pair:registry

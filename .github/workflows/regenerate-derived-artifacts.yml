name: Regenerate derived artifacts

# Derived-artifact decoupling (honua-io/honua-sdk-js#677).
#
# Feature PRs no longer regenerate or reseal the shared generated-artifact set
# (sample evidence, samples/dist, consumer fixtures, bench corpus,
# docs/bundle-sizes.md, llms*.txt, docs/comparison.md, docs/errors.md,
# api-report, migration-workbench artifacts). Those outputs are regenerated
# HERE, once, after each relevant trunk merge, and returned through a protected
# automation PR. Feature PR CI runs the corresponding gates in relaxed mode
# (HONUA_DERIVED_ARTIFACTS_RELAX)
# and this workflow is the strict authority that re-establishes reproducibility:
# it reseals sample evidence bound to the trunk source digest and fails loudly
# if that binding cannot hold.
#
# Integrity note: migration generation can update runtime source. The read-only
# job commits those generated inputs locally before resealing, so the evidence
# binds to a real ancestor. It then transfers the local commit chain as a bundle
# to the small write-enabled job, which validates every changed path before it
# publishes the commits unchanged, dispatches strict validation against their
# exact head, approves only that head's native ruleset checks, and auto-merges
# them with a merge commit so evidence revisions remain reachable.
#
# The read-only job's commit chain can carry up to four commits, not two:
# (1) regenerated non-evidence inputs, (2) the NON-EXECUTED (skip-attestation)
# lanes' catalog live-evidence expiry refresh, (3) the golden samples' catalog
# live-evidence expiry refresh (honua-io/honua-sdk-js#788 -- projected from
# samples/contract/v2/migrations/catalog.v1-to-v2.json into
# samples/catalog.v2.json, both themselves inside the evidence-neutral
# digest, so it must land as its own commit *before* the real reseal that
# binds evidence to it), and (4) the resealed evidence + regenerated dist.
#
# (2) exists separately from (3), and lands *before* the first reseal pass,
# because of an ordering deadlock (honua-io/honua-sdk-js#810): every reseal
# pass validates the whole catalog through readInputs, and the catalog-level
# wall-clock expiry check is deliberately NOT relaxed by
# HONUA_DERIVED_ARTIFACTS_RELAX, so ONE lapsed skip-attestation expiry -- for
# a sample no reseal pass even targets -- failed pass one and took the entire
# regeneration job down with it, leaving the automation unable to heal the
# lapse it exists to prevent. Unlike an executed golden lane, a skip lane's
# observedAt is not renewed by resealing, so nothing about its expiry needs a
# reseal to have happened first: refreshing it up front is equivalent to
# refreshing it later, and it is the only ordering under which a lapsed skip
# expiry cannot wedge the passes that follow.

# Cadence (#746 REQ-001): regeneration no longer runs after every trunk merge --
# a 6-hour schedule and workflow_dispatch are the baseline triggers. Release-time
# consumers dispatch this workflow and wait for it before strictly verifying
# evidence, so releases never observe the bounded staleness window: publish-js-sdk
# does so for branch-recovery runs, and release-please's resealed JS publish path
# does so for every release -- then moves the js-sdk-* tag onto the resealed
# commit this workflow merged, because a reseal is always a NEW commit and can
# never freshen a tree an existing tag already names (#768). The loop guard below
# makes a dispatch a fast no-op when trunk's tip is already a regeneration merge.
#
# Digest-narrowed push trigger (#746 REQ-003): the `paths:` filter below
# mirrors EVIDENCE_NEUTRAL_INCLUDED_ROOTS / EVIDENCE_NEUTRAL_EXCLUDED_ROOTS in
# scripts/sample-gate-receipt.mjs exactly, including every SDK build input
# scripts/lib/prepared-sdk-artifact.mjs itself tracks (src/, test/, bench/,
# scripts/, config/, examples/, package.json, package-lock.json,
# tsconfig.json, vitest.config.ts, .nvmrc, LICENSE -- packed-mode sample
# evidence packs and hashes the real dist/ tsc compiles from these, so all of
# them can move packed sample bytes even though most individual test/bench
# changes are unrelated to any one sample), test/playwright/ (every sample's
# playwrightFile plus shared Playwright helpers), and the root
# playwright.config.mjs / playwright.first-map.config.mjs the sample harness
# loads implicitly or via a playwrightConfig override. Only content that can
# actually invalidate the sample source digest re-triggers a regeneration on
# push. A merge that only touches docs/ prose (outside docs/examples/), mcp/,
# conformance/, or eval/ does not match and leaves existing evidence valid,
# so it no longer costs a reseal at all. The negated samples/evidence,
# samples/dist, and samples/contract/v2/consumer-fixtures patterns keep this
# workflow's own automation-PR merge (which touches only those generated
# paths) from re-triggering itself on push; the loop guard is the backstop
# for any case that still gets through (e.g. a merge that also carries source
# changes). Keep this list and EVIDENCE_NEUTRAL_INCLUDED_ROOTS in lockstep --
# a path missing from one is either a digest gap (evidence can go stale
# without anyone noticing) or a redundant trigger.
on:
  push:
    branches:
      - trunk
    paths:
      - "examples/**"
      - "docs/examples/**"
      - "src/**"
      - "samples/**"
      - "!samples/evidence/**"
      - "!samples/dist/**"
      - "!samples/contract/v2/consumer-fixtures/**"
      - "!examples/migration-workbench/public/artifacts/**"
      - "test/**"
      - "bench/**"
      - "!bench/cross-sdk/corpus.json"
      - "scripts/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".nvmrc"
      - "LICENSE"
      - "playwright.config.mjs"
      - "playwright.first-map.config.mjs"
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: derived-artifacts
  cancel-in-progress: false

permissions: read-all

env:
  NODE_VERSION: "20.19.0"
  REGEN_MARKER: "chore(evidence): regenerate derived artifacts"

jobs:
  regenerate:
    name: Regenerate + reseal on trunk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Loop guard: a historical direct regeneration commit, or a clean merge
      # of this workflow's own one- to four-commit PR chain (source regen; the
      # skip-attestation catalog live-expiry refresh and the golden-lane one,
      # each when it produced a change; resealed evidence + dist), needs no
      # further work. If trunk advanced
      # after that chain was cut, the merge commit's
      # first parent differs from the chain base and regeneration runs again
      # against the combined tree instead of accepting stale evidence.
      - name: Skip if tip is a regeneration commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == "$REGEN_MARKER"* ]]; then
            echo "Tip commit is a regeneration commit; nothing to regenerate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if generated="$(git rev-parse --verify -q HEAD^2)" && [[ "$(git log -1 --format=%s "$generated")" == "$REGEN_MARKER"* ]]; then
            chain_base="$generated"
            commit_count=0
            while [[ "$(git log -1 --format=%s "$chain_base")" == "$REGEN_MARKER"* ]]; do
              chain_base="$(git rev-parse "$chain_base^")"
              commit_count=$((commit_count + 1))
            done
            first_parent="$(git rev-parse HEAD^1)"
            if (( commit_count >= 1 && commit_count <= 4 )) && [[ "$chain_base" == "$first_parent" ]]; then
              echo "Tip cleanly merges the current regeneration chain; nothing to regenerate."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Regeneration PR was based on an older trunk tip; resealing the combined tree."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Install Playwright browser
        if: steps.guard.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: Build SDK
        if: steps.guard.outputs.skip == 'false'
        run: npm run build

      # Regenerate source-derived artifacts. All of these paths are excluded
      # from the evidence-neutral source digest, so producing them here does not
      # perturb the reseal below. Order mirrors the historical manual recipe.
      - name: Regenerate public API report and error codes
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run report:api
          npm run docs:error-codes

      - name: Regenerate cross-SDK benchmark corpus source-tree pin
        if: steps.guard.outputs.skip == 'false'
        run: npm run bench:references:source-tree:write

      - name: Regenerate bundle-size report
        if: steps.guard.outputs.skip == 'false'
        run: npm run report:bundle-sizes

      - name: Regenerate migration-workbench artifacts
        if: steps.guard.outputs.skip == 'false'
        run: npm run demo:migration-workbench:artifacts:write

      # The migration generator updates allowlisted example source consumed by
      # llms-full.txt. The comparison page is also embedded in llms-full.txt, so
      # generate every input before producing the final documentation projection.
      - name: Regenerate llms.txt and comparison page
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run docs:comparison
          npm run docs:llms

      - name: Verify llms.txt freshness before publication
        if: steps.guard.outputs.skip == 'false'
        run: npm run verify:llms

      # Create the non-evidence commit locally in this read-only job. The
      # migration generator can update runtime source, so this commit must be a
      # real ancestor of the evidence commit rather than being squashed later.
      - name: Stage and commit regenerated inputs locally
        id: derived
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git add -A -- \
            api-report \
            bench/cross-sdk/corpus.json \
            docs/bundle-sizes.md \
            docs/comparison.md \
            docs/errors.md \
            llms.txt \
            llms-full.txt \
            examples/migration-workbench/public/artifacts \
            examples/migration-workbench/src/generated
          if ! git diff --quiet; then
            echo "A derived-artifact generator modified unexpected tracked content:"
            git status --short
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "A derived-artifact generator created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No derived-artifact changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "$REGEN_MARKER for $(git rev-parse --short HEAD)"

      # Refresh the NON-EXECUTED (skip-attestation) live lanes first, before any
      # reseal pass runs (honua-io/honua-sdk-js#810).
      #
      # Every reseal pass below validates the whole catalog, and the
      # catalog-level wall-clock expiry check is deliberately not relaxed by
      # HONUA_DERIVED_ARTIFACTS_RELAX, so a single lapsed live.expiresAt fails
      # pass one no matter which sample it belongs to -- which is how one
      # lapsed skip attestation wedged this entire job and left trunk red with
      # no automated way out (#810). The golden-lane refresh further below
      # cannot cover these lanes: it has to run *after* a reseal pass, because
      # that pass is what produces the fresh observedAt it refreshes from.
      #
      # A skip attestation has no such dependency. Nothing reseals it, so its
      # observedAt is fixed and refreshing its projected expiry is a pure
      # function of an evidence file already on disk -- identical whether it
      # runs before or after a reseal. Running it here is therefore free of
      # ordering cost and is the only placement under which a lapsed skip
      # expiry cannot wedge the passes that follow.
      #
      # Keep this list equal to the set of overlay live lanes whose status is
      # "skipped" (test/sample-contract.test.ts pins that equality, so a new
      # skip-attested sample cannot silently reintroduce the lapse). These
      # samples are not golden and hold no receipts, so refreshing them needs
      # no bootstrap exemption. If a skip attestation has aged past its full
      # non-executed policy window, refresh-live-expiry refuses rather than
      # writing an already-lapsed literal, and fails here naming the sample
      # and the producer to re-run -- the honest outcome, since only a real
      # re-observation can renew an observation that old.
      - name: Refresh catalog live-evidence expiry for skip-attested lanes
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run samples:refresh-live-expiry -- --sample ai-spatial-app-builder,realtime-incident-dashboard,spatial-analytics-workbench
          npm run samples:migrate:v1
          npm run samples:write-ci-selection

      # Commit it before pass one for the same reason the golden-lane refresh
      # is committed before pass two: the catalog and the overlay are inside
      # the evidence-neutral digest, and every reseal pass requires a clean
      # checkout of those roots, so an uncommitted refresh would fail the pass
      # it is supposed to unblock.
      - name: Stage and commit refreshed skip-attestation catalog locally
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            samples/catalog.v2.json \
            samples/contract/v2/migrations/catalog.v1-to-v2.json
          git add -f -A -- samples/dist/sample-ci-selection.v2.json
          if ! git diff --quiet; then
            echo "Skip-attestation live-expiry refresh modified unexpected tracked content:"
            git status --short
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "Skip-attestation live-expiry refresh created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No skip-attestation live-expiry refresh to commit."
          else
            git commit -m "$REGEN_MARKER (skip-attestation-expiry) for $(git rev-parse --short HEAD)"
          fi

      # samples/catalog.v2.json's live.expiresAt is projected from this
      # migration overlay's sampleOverrides[id].live.expiresAt, a literal set
      # once at qualification time -- it is NOT derived from resealed
      # evidence. Resealing alone renews receipts and published live evidence
      # with a new observedAt but leaves that catalog-level literal frozen,
      # so it eventually lapses out from under evidence that stays otherwise
      # fresh (honua-io/honua-sdk-js#788, the same class of bug that lapsed
      # the spatial-analytics and then the incident-dashboard
      # skip-attestation). refresh-live-expiry (further
      # below) recomputes that literal from a live lane's fresh observedAt,
      # but samples/catalog.v2.json and this overlay are themselves inside
      # the evidence-neutral digest (samples/ minus only samples/evidence,
      # samples/dist, and the consumer fixtures is included -- see
      # EVIDENCE_NEUTRAL_INCLUDED_ROOTS/EXCLUDED_ROOTS in
      # scripts/sample-gate-receipt.mjs), so committing a refreshed catalog
      # after a reseal invalidates that reseal's receipts (their sourceDigest
      # no longer matches HEAD). Breaking that circularity needs a full reseal
      # PASS ONE purely to obtain a fresh live observedAt to refresh from
      # (validateCatalog's qualification-bootstrap exemption -- required
      # whenever any golden sample's receipts disagree with the current
      # source, which they always do immediately after the commit above --
      # is only available to a full evidence run; single-gate `--gate live`
      # runs cannot pass --qualification-bootstrap-also, so a narrower probe
      # cannot substitute here). PASS TWO below reseals for real once the
      # refreshed catalog is committed, so its receipts are the ones actually
      # bound to the final tree; PASS ONE's output is intentionally
      # overwritten by it and never committed on its own.
      #
      # All four qualified golden samples share one evidence-neutral digest
      # (catalog entries for any of them are inside it), so a change that
      # invalidates one invalidates all four -- each reseal names the other
      # three via --qualification-bootstrap-also so this job can reseal them
      # in sequence against the same tree (honua-io/honua-sdk-js#735, PR #738;
      # extended to a third golden sample by #548, a fourth by #549).
      - name: Reseal sample evidence (pass one, to observe a fresh live timestamp)
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run samples:run -- evidence --sample maplibre-quickstart --qualification-bootstrap-also imagery-cog-quickstart,migration-workbench,service-explorer --allow-live
          npm run samples:run -- evidence --sample imagery-cog-quickstart --qualification-bootstrap-also maplibre-quickstart,migration-workbench,service-explorer --allow-live
          npm run samples:run -- evidence --sample migration-workbench --qualification-bootstrap-also imagery-cog-quickstart,maplibre-quickstart,service-explorer --allow-live
          npm run samples:run -- evidence --sample service-explorer --qualification-bootstrap-also imagery-cog-quickstart,maplibre-quickstart,migration-workbench --allow-live

      # Only the four executed golden lanes belong here -- these are the ones
      # whose observedAt pass one just renewed. The skip-attested lanes were
      # already refreshed and committed before pass one, because their
      # observedAt does not move and refreshing them late is what allowed a
      # lapse to wedge pass one (#810).
      - name: Refresh catalog live-evidence expiry for resealed golden lanes
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run samples:refresh-live-expiry -- --sample imagery-cog-quickstart,maplibre-quickstart,migration-workbench,service-explorer
          npm run samples:migrate:v1
          npm run samples:write-ci-selection

      # Commit the refreshed catalog before pass two below so that pass two's
      # own clean-checkout verification (and the receipts it writes) bind to
      # the tree the refresh actually produced, not the one from before it.
      # samples/dist/sample-ci-selection.v2.json embeds each sample's
      # catalog-projected live.expiresAt too, and pass two's own readInputs
      # rejects a stale entry for the one --sample it targets even under
      # --qualification-bootstrap-also, so write-ci-selection above must also
      # land here (force-added like the later evidence commit, since
      # samples/dist is excluded from the evidence-neutral digest but still
      # git-ignored). Pass one above already left samples/evidence/** dirty;
      # that is expected (pass two overwrites it next) and is excluded here
      # since it is not this commit's concern -- and is excluded from the
      # evidence-neutral digest entirely, so it cannot perturb this commit's
      # binding either.
      - name: Stage and commit refreshed catalog locally
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            samples/catalog.v2.json \
            samples/contract/v2/migrations/catalog.v1-to-v2.json
          git add -f -A -- samples/dist/sample-ci-selection.v2.json
          if ! git diff --quiet -- . ':(exclude)samples/evidence'; then
            echo "Catalog live-expiry refresh modified unexpected tracked content:"
            git status --short -- . ':(exclude)samples/evidence'
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard -- . ':(exclude)samples/evidence')"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "Catalog live-expiry refresh created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No catalog live-expiry refresh to commit."
          else
            git commit -m "$REGEN_MARKER (catalog-expiry) for $(git rev-parse --short HEAD)"
          fi

      # Reseal again against the current source digest (which now includes
      # the refreshed catalog committed above), then project the dist
      # artifacts from these -- the real -- fresh receipts. Runs STRICT (no
      # HONUA_DERIVED_ARTIFACTS_RELAX): captureGateSourceSnapshot verifies the
      # evidence-neutral checkout, so a binding that cannot hold fails the job.
      - name: Reseal sample evidence (pass two, bound to the refreshed catalog)
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run samples:run -- evidence --sample maplibre-quickstart --qualification-bootstrap-also imagery-cog-quickstart,migration-workbench,service-explorer --allow-live
          npm run samples:run -- evidence --sample imagery-cog-quickstart --qualification-bootstrap-also maplibre-quickstart,migration-workbench,service-explorer --allow-live
          npm run samples:run -- evidence --sample migration-workbench --qualification-bootstrap-also imagery-cog-quickstart,maplibre-quickstart,service-explorer --allow-live
          npm run samples:run -- evidence --sample service-explorer --qualification-bootstrap-also imagery-cog-quickstart,maplibre-quickstart,migration-workbench --allow-live

      - name: Regenerate sample dist projections
        if: steps.guard.outputs.skip == 'false'
        run: npm run samples:generate

      # Commit resealed evidence locally as a separate child commit. Its
      # sourceRevision points at the preceding generated-input commit (or the
      # original trunk commit when no generated input changed), so preserving
      # this chain avoids a dangling evidence revision.
      - name: Stage and commit resealed evidence locally
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            samples/catalog.v2.json \
            samples/contract/v2/migrations/catalog.v1-to-v2.json \
            samples/contract/v2/consumer-fixtures/honua-site-consumer.v2.json \
            samples/contract/v2/consumer-fixtures/honua-site-consumer.v3.json \
            samples/evidence/imagery-cog-quickstart \
            samples/evidence/maplibre-quickstart \
            samples/evidence/migration-workbench \
            samples/evidence/service-explorer
          # The v2 consumer fixture and samples/dist projection are one atomic
          # generated contract: samples:generate rewrites the fixture digest to
          # bind the projection bytes. samples/dist is deliberately tracked even
          # though the repository's global dist/ ignore rule matches it.
          # Force-add only this allowlisted projection directory; the unstaged-
          # change guard below still rejects modifications anywhere else.
          git add -f -A -- samples/dist
          if ! git diff --quiet; then
            echo "Evidence regeneration modified unexpected tracked content:"
            git status --short
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "Evidence regeneration created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$REGEN_MARKER (evidence) for $(git rev-parse --short HEAD)"
          fi

      - name: Verify regenerated artifacts strictly
        if: steps.guard.outputs.skip == 'false'
        run: npm run samples:verify

      - name: Bundle local regeneration commits
        id: bundle
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]; then
            echo "Nothing to regenerate or reseal."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git update-ref refs/heads/derived-artifacts-output HEAD
          git bundle create derived-artifacts.bundle \
            refs/heads/derived-artifacts-output "^$GITHUB_SHA"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload local regeneration commits
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derived-artifacts-bundle
          path: derived-artifacts.bundle
          if-no-files-found: error

  commit-and-validate:
    name: Publish artifacts PR + gate strict validation
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download local regeneration commits
        if: needs.regenerate.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: derived-artifacts-bundle
          path: .derived-artifacts-bundle

      - name: Validate and publish regeneration commits
        id: publish
        if: needs.regenerate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch .derived-artifacts-bundle/derived-artifacts.bundle \
            refs/heads/derived-artifacts-output:refs/remotes/artifacts/generated
          generated="$(git rev-parse refs/remotes/artifacts/generated)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$generated"
          commit_count="$(git rev-list --count "$GITHUB_SHA..$generated")"
          if (( commit_count < 1 || commit_count > 4 )); then
            echo "Expected one to four regeneration commits, found $commit_count."
            exit 1
          fi
          while IFS= read -r subject; do
            if [[ "$subject" != "$REGEN_MARKER"* ]]; then
              echo "Unexpected regeneration commit subject: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$GITHUB_SHA..$generated")
          while IFS= read -r changed_path; do
            case "$changed_path" in
              api-report/* | \
              bench/cross-sdk/corpus.json | \
              docs/bundle-sizes.md | docs/comparison.md | docs/errors.md | \
              llms.txt | llms-full.txt | \
              examples/migration-workbench/public/artifacts/* | \
              examples/migration-workbench/src/generated/* | \
              samples/catalog.v2.json | \
              samples/contract/v2/migrations/catalog.v1-to-v2.json | \
              samples/contract/v2/consumer-fixtures/honua-site-consumer.v2.json | \
              samples/contract/v2/consumer-fixtures/honua-site-consumer.v3.json | \
              samples/dist/* | samples/evidence/imagery-cog-quickstart/* | \
              samples/evidence/maplibre-quickstart/* | samples/evidence/migration-workbench/* | \
              samples/evidence/service-explorer/*)
                ;;
              *)
                echo "Regeneration bundle contains an unexpected path: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$GITHUB_SHA..$generated")
          branch="automation/derived-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$generated:refs/heads/$branch"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base trunk \
            --head "$branch" \
            --title "chore(evidence): regenerate derived artifacts" \
            --body "Automated, strictly verified derived-artifact reseal for trunk commit \`$GITHUB_SHA\`.")"
          pr_number="${pr_url##*/}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # Native pull_request CI deliberately relaxes shared derived-artifact
      # freshness for feature work. Dispatch separate strict CI against the
      # exact generated head and retain its ID so merge must wait for it.
      - name: Dispatch strict CI for regeneration PR
        id: strict
        if: needs.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail
          ci_run_url="$(gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH")"
          if [[ ! "$ci_run_url" =~ /actions/runs/([0-9]+)$ ]]; then
            echo "Could not identify strict CI run from: $ci_run_url"
            exit 1
          fi
          echo "ci_run_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # GitHub holds pull_request workflows created by GITHUB_TOKEN for approval.
      # Approve only the expected workflows attached to the exact generated head;
      # their native PR check runs are what the trunk ruleset recognizes.
      - name: Approve native checks for regeneration PR
        if: needs.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          GENERATED: ${{ steps.publish.outputs.generated }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          set -euo pipefail
          expected_workflows='["SDK CI","PR issue disposition","Schema sync gate","Security"]'
          for attempt in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch "$BRANCH" \
              --event pull_request \
              --limit 20 \
              --json databaseId,workflowName,status,conclusion,headSha)"
            matching="$(jq \
              --arg generated "$GENERATED" \
              --argjson expected "$expected_workflows" \
              '[.[] | select(.headSha == $generated and (.workflowName as $name | $expected | index($name)))]' \
              <<<"$runs")"
            while IFS= read -r run_id; do
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            done < <(jq -r '.[] | select(.conclusion == "action_required") | .databaseId' <<<"$matching")
            attached="$(jq 'map(.workflowName) | unique | length' <<<"$matching")"
            held="$(jq '[.[] | select(.conclusion == "action_required")] | length' <<<"$matching")"
            if [[ "$attached" -eq 4 && "$held" -eq 0 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Expected native checks did not become runnable for regeneration PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done

      - name: Merge validated regeneration PR
        if: needs.regenerate.outputs.changed == 'true'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED: ${{ steps.publish.outputs.generated }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          STRICT_CI_RUN_ID: ${{ steps.strict.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          run_head="$(gh run view "$STRICT_CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha \
            --jq .headSha)"
          if [[ "$run_head" != "$GENERATED" ]]; then
            echo "Strict CI run $STRICT_CI_RUN_ID targets $run_head instead of $GENERATED."
            exit 1
          fi
          gh run watch "$STRICT_CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10
          for attempt in {1..30}; do
            required="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name,bucket 2>/dev/null || true)"
            if [[ -z "$required" ]]; then
              required='[]'
            fi
            if [[ "$(jq 'length' <<<"$required")" -ge 3 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Required checks did not attach to regeneration PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --watch --fail-fast --interval 10
          git fetch origin trunk
          current_trunk="$(git rev-parse refs/remotes/origin/trunk)"
          if [[ "$current_trunk" != "$GITHUB_SHA" ]]; then
            gh pr close "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --delete-branch
            exit 0
          fi
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$GENERATED"
          # Merges performed with GITHUB_TOKEN do not emit a push workflow.
          # Explicitly re-enter this workflow: the topology-aware guard skips
          # a clean regeneration merge and dispatches strict trunk validation.
          gh workflow run regenerate-derived-artifacts.yml --repo "$GITHUB_REPOSITORY" --ref trunk

      - name: Dispatch strict trunk CI and docs validation
        if: needs.regenerate.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref trunk
          gh workflow run docs-site.yml --repo "$GITHUB_REPOSITORY" --ref trunk

name: Regenerate derived artifacts

# Derived-artifact decoupling (honua-io/honua-sdk-js#677).
#
# Feature PRs no longer regenerate or reseal the shared generated-artifact set
# (sample evidence, samples/dist, consumer fixtures, bench corpus,
# docs/bundle-sizes.md, llms*.txt, docs/comparison.md, docs/errors.md,
# api-report, migration-workbench artifacts). Those outputs are regenerated
# HERE, once, after each relevant trunk merge, and returned through a protected
# automation PR. Feature PR CI runs the corresponding gates in relaxed mode
# (HONUA_DERIVED_ARTIFACTS_RELAX)
# and this workflow is the strict authority that re-establishes reproducibility:
# it reseals sample evidence bound to the trunk source digest and fails loudly
# if that binding cannot hold.
#
# Integrity note: migration generation can update runtime source. The read-only
# job commits those generated inputs locally before resealing, so the evidence
# binds to a real ancestor. It then transfers the local commit chain as a bundle
# to the small write-enabled job, which validates every changed path before it
# publishes the commits unchanged, dispatches strict validation against their
# exact head, approves only that head's native ruleset checks, and auto-merges
# them with a merge commit so evidence revisions remain reachable.

# Cadence (#746 REQ-001): regeneration no longer runs after every trunk merge --
# a 6-hour schedule and workflow_dispatch are the baseline triggers. Release-time
# consumers (first-map-release-smoke, publish-js-sdk, and release-please's
# resealed JS publish path) dispatch this workflow and wait for it before
# strictly verifying evidence, so releases never observe the bounded staleness
# window. The loop guard below makes a dispatch a fast no-op when trunk's tip
# is already a regeneration merge.
#
# Digest-narrowed push trigger (#746 REQ-003): the `paths:` filter below
# mirrors EVIDENCE_NEUTRAL_INCLUDED_ROOTS / EVIDENCE_NEUTRAL_EXCLUDED_ROOTS in
# scripts/sample-gate-receipt.mjs exactly, including every SDK build input
# scripts/lib/prepared-sdk-artifact.mjs itself tracks (src/, test/, bench/,
# scripts/, config/, examples/, package.json, package-lock.json,
# tsconfig.json, vitest.config.ts, .nvmrc, LICENSE -- packed-mode sample
# evidence packs and hashes the real dist/ tsc compiles from these, so all of
# them can move packed sample bytes even though most individual test/bench
# changes are unrelated to any one sample), test/playwright/ (every sample's
# playwrightFile plus shared Playwright helpers), and the root
# playwright.config.mjs / playwright.first-map.config.mjs the sample harness
# loads implicitly or via a playwrightConfig override. Only content that can
# actually invalidate the sample source digest re-triggers a regeneration on
# push. A merge that only touches docs/ prose (outside docs/examples/), mcp/,
# conformance/, or eval/ does not match and leaves existing evidence valid,
# so it no longer costs a reseal at all. The negated samples/evidence,
# samples/dist, and samples/contract/v2/consumer-fixtures patterns keep this
# workflow's own automation-PR merge (which touches only those generated
# paths) from re-triggering itself on push; the loop guard is the backstop
# for any case that still gets through (e.g. a merge that also carries source
# changes). Keep this list and EVIDENCE_NEUTRAL_INCLUDED_ROOTS in lockstep --
# a path missing from one is either a digest gap (evidence can go stale
# without anyone noticing) or a redundant trigger.
on:
  push:
    branches:
      - trunk
    paths:
      - "examples/**"
      - "docs/examples/**"
      - "src/**"
      - "samples/**"
      - "!samples/evidence/**"
      - "!samples/dist/**"
      - "!samples/contract/v2/consumer-fixtures/**"
      - "!examples/migration-workbench/public/artifacts/**"
      - "test/**"
      - "bench/**"
      - "!bench/cross-sdk/corpus.json"
      - "scripts/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".nvmrc"
      - "LICENSE"
      - "playwright.config.mjs"
      - "playwright.first-map.config.mjs"
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: derived-artifacts
  cancel-in-progress: false

permissions: read-all

env:
  NODE_VERSION: "20.19.0"
  REGEN_MARKER: "chore(evidence): regenerate derived artifacts"

jobs:
  regenerate:
    name: Regenerate + reseal on trunk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Loop guard: a historical direct regeneration commit, or a clean merge
      # of this workflow's own one- or two-commit PR chain, needs no further
      # work. If trunk advanced after that chain was cut, the merge commit's
      # first parent differs from the chain base and regeneration runs again
      # against the combined tree instead of accepting stale evidence.
      - name: Skip if tip is a regeneration commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == "$REGEN_MARKER"* ]]; then
            echo "Tip commit is a regeneration commit; nothing to regenerate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if generated="$(git rev-parse --verify -q HEAD^2)" && [[ "$(git log -1 --format=%s "$generated")" == "$REGEN_MARKER"* ]]; then
            chain_base="$generated"
            commit_count=0
            while [[ "$(git log -1 --format=%s "$chain_base")" == "$REGEN_MARKER"* ]]; do
              chain_base="$(git rev-parse "$chain_base^")"
              commit_count=$((commit_count + 1))
            done
            first_parent="$(git rev-parse HEAD^1)"
            if (( commit_count >= 1 && commit_count <= 2 )) && [[ "$chain_base" == "$first_parent" ]]; then
              echo "Tip cleanly merges the current regeneration chain; nothing to regenerate."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Regeneration PR was based on an older trunk tip; resealing the combined tree."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Install Playwright browser
        if: steps.guard.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: Build SDK
        if: steps.guard.outputs.skip == 'false'
        run: npm run build

      # Regenerate source-derived artifacts. All of these paths are excluded
      # from the evidence-neutral source digest, so producing them here does not
      # perturb the reseal below. Order mirrors the historical manual recipe.
      - name: Regenerate public API report and error codes
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run report:api
          npm run docs:error-codes

      - name: Regenerate cross-SDK benchmark corpus source-tree pin
        if: steps.guard.outputs.skip == 'false'
        run: npm run bench:references:source-tree:write

      - name: Regenerate bundle-size report
        if: steps.guard.outputs.skip == 'false'
        run: npm run report:bundle-sizes

      - name: Regenerate migration-workbench artifacts
        if: steps.guard.outputs.skip == 'false'
        run: npm run demo:migration-workbench:artifacts:write

      # The migration generator updates allowlisted example source consumed by
      # llms-full.txt. The comparison page is also embedded in llms-full.txt, so
      # generate every input before producing the final documentation projection.
      - name: Regenerate llms.txt and comparison page
        if: steps.guard.outputs.skip == 'false'
        run: |
          npm run docs:comparison
          npm run docs:llms

      - name: Verify llms.txt freshness before publication
        if: steps.guard.outputs.skip == 'false'
        run: npm run verify:llms

      # Create the non-evidence commit locally in this read-only job. The
      # migration generator can update runtime source, so this commit must be a
      # real ancestor of the evidence commit rather than being squashed later.
      - name: Stage and commit regenerated inputs locally
        id: derived
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git add -A -- \
            api-report \
            bench/cross-sdk/corpus.json \
            docs/bundle-sizes.md \
            docs/comparison.md \
            docs/errors.md \
            llms.txt \
            llms-full.txt \
            examples/migration-workbench/public/artifacts \
            examples/migration-workbench/src/generated
          if ! git diff --quiet; then
            echo "A derived-artifact generator modified unexpected tracked content:"
            git status --short
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "A derived-artifact generator created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No derived-artifact changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "$REGEN_MARKER for $(git rev-parse --short HEAD)"

      # Reseal sample evidence against the current trunk source digest, then
      # project the dist artifacts from the fresh receipts. Runs STRICT (no
      # HONUA_DERIVED_ARTIFACTS_RELAX): captureGateSourceSnapshot verifies the
      # evidence-neutral checkout, so a binding that cannot hold fails the job.
      - name: Reseal sample evidence
        if: steps.guard.outputs.skip == 'false'
        run: npm run samples:run -- evidence --sample maplibre-quickstart --allow-live

      - name: Regenerate sample dist projections
        if: steps.guard.outputs.skip == 'false'
        run: npm run samples:generate

      # Commit resealed evidence locally as a separate child commit. Its
      # sourceRevision points at the preceding generated-input commit (or the
      # original trunk commit when no generated input changed), so preserving
      # this chain avoids a dangling evidence revision.
      - name: Stage and commit resealed evidence locally
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            samples/contract/v2/consumer-fixtures/honua-site-consumer.v2.json \
            samples/contract/v2/consumer-fixtures/honua-site-consumer.v3.json \
            samples/evidence/maplibre-quickstart
          # The v2 consumer fixture and samples/dist projection are one atomic
          # generated contract: samples:generate rewrites the fixture digest to
          # bind the projection bytes. samples/dist is deliberately tracked even
          # though the repository's global dist/ ignore rule matches it.
          # Force-add only this allowlisted projection directory; the unstaged-
          # change guard below still rejects modifications anywhere else.
          git add -f -A -- samples/dist
          if ! git diff --quiet; then
            echo "Evidence regeneration modified unexpected tracked content:"
            git status --short
            exit 1
          fi
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "Evidence regeneration created unexpected untracked content:"
            printf '%s\n' "$unexpected_untracked"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$REGEN_MARKER (evidence) for $(git rev-parse --short HEAD)"
          fi

      - name: Verify regenerated artifacts strictly
        if: steps.guard.outputs.skip == 'false'
        run: npm run samples:verify

      - name: Bundle local regeneration commits
        id: bundle
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]; then
            echo "Nothing to regenerate or reseal."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git update-ref refs/heads/derived-artifacts-output HEAD
          git bundle create derived-artifacts.bundle \
            refs/heads/derived-artifacts-output "^$GITHUB_SHA"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload local regeneration commits
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derived-artifacts-bundle
          path: derived-artifacts.bundle
          if-no-files-found: error

  commit-and-validate:
    name: Publish artifacts PR + gate strict validation
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download local regeneration commits
        if: needs.regenerate.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: derived-artifacts-bundle
          path: .derived-artifacts-bundle

      - name: Validate and publish regeneration commits
        id: publish
        if: needs.regenerate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch .derived-artifacts-bundle/derived-artifacts.bundle \
            refs/heads/derived-artifacts-output:refs/remotes/artifacts/generated
          generated="$(git rev-parse refs/remotes/artifacts/generated)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$generated"
          commit_count="$(git rev-list --count "$GITHUB_SHA..$generated")"
          if (( commit_count < 1 || commit_count > 2 )); then
            echo "Expected one or two regeneration commits, found $commit_count."
            exit 1
          fi
          while IFS= read -r subject; do
            if [[ "$subject" != "$REGEN_MARKER"* ]]; then
              echo "Unexpected regeneration commit subject: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$GITHUB_SHA..$generated")
          while IFS= read -r changed_path; do
            case "$changed_path" in
              api-report/* | \
              bench/cross-sdk/corpus.json | \
              docs/bundle-sizes.md | docs/comparison.md | docs/errors.md | \
              llms.txt | llms-full.txt | \
              examples/migration-workbench/public/artifacts/* | \
              examples/migration-workbench/src/generated/* | \
              samples/contract/v2/consumer-fixtures/honua-site-consumer.v2.json | \
              samples/contract/v2/consumer-fixtures/honua-site-consumer.v3.json | \
              samples/dist/* | samples/evidence/maplibre-quickstart/*)
                ;;
              *)
                echo "Regeneration bundle contains an unexpected path: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$GITHUB_SHA..$generated")
          branch="automation/derived-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$generated:refs/heads/$branch"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base trunk \
            --head "$branch" \
            --title "chore(evidence): regenerate derived artifacts" \
            --body "Automated, strictly verified derived-artifact reseal for trunk commit \`$GITHUB_SHA\`.")"
          pr_number="${pr_url##*/}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "generated=$generated" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # Native pull_request CI deliberately relaxes shared derived-artifact
      # freshness for feature work. Dispatch separate strict CI against the
      # exact generated head and retain its ID so merge must wait for it.
      - name: Dispatch strict CI for regeneration PR
        id: strict
        if: needs.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          set -euo pipefail
          ci_run_url="$(gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH")"
          if [[ ! "$ci_run_url" =~ /actions/runs/([0-9]+)$ ]]; then
            echo "Could not identify strict CI run from: $ci_run_url"
            exit 1
          fi
          echo "ci_run_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # GitHub holds pull_request workflows created by GITHUB_TOKEN for approval.
      # Approve only the expected workflows attached to the exact generated head;
      # their native PR check runs are what the trunk ruleset recognizes.
      - name: Approve native checks for regeneration PR
        if: needs.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          GENERATED: ${{ steps.publish.outputs.generated }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          set -euo pipefail
          expected_workflows='["SDK CI","PR issue disposition","Schema sync gate","Security"]'
          for attempt in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch "$BRANCH" \
              --event pull_request \
              --limit 20 \
              --json databaseId,workflowName,status,conclusion,headSha)"
            matching="$(jq \
              --arg generated "$GENERATED" \
              --argjson expected "$expected_workflows" \
              '[.[] | select(.headSha == $generated and (.workflowName as $name | $expected | index($name)))]' \
              <<<"$runs")"
            while IFS= read -r run_id; do
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            done < <(jq -r '.[] | select(.conclusion == "action_required") | .databaseId' <<<"$matching")
            attached="$(jq 'map(.workflowName) | unique | length' <<<"$matching")"
            held="$(jq '[.[] | select(.conclusion == "action_required")] | length' <<<"$matching")"
            if [[ "$attached" -eq 4 && "$held" -eq 0 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Expected native checks did not become runnable for regeneration PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done

      - name: Merge validated regeneration PR
        if: needs.regenerate.outputs.changed == 'true'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED: ${{ steps.publish.outputs.generated }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          STRICT_CI_RUN_ID: ${{ steps.strict.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          run_head="$(gh run view "$STRICT_CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha \
            --jq .headSha)"
          if [[ "$run_head" != "$GENERATED" ]]; then
            echo "Strict CI run $STRICT_CI_RUN_ID targets $run_head instead of $GENERATED."
            exit 1
          fi
          gh run watch "$STRICT_CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10
          for attempt in {1..30}; do
            required="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name,bucket 2>/dev/null || true)"
            if [[ -z "$required" ]]; then
              required='[]'
            fi
            if [[ "$(jq 'length' <<<"$required")" -ge 3 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Required checks did not attach to regeneration PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --watch --fail-fast --interval 10
          git fetch origin trunk
          current_trunk="$(git rev-parse refs/remotes/origin/trunk)"
          if [[ "$current_trunk" != "$GITHUB_SHA" ]]; then
            gh pr close "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --delete-branch
            exit 0
          fi
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$GENERATED"
          # Merges performed with GITHUB_TOKEN do not emit a push workflow.
          # Explicitly re-enter this workflow: the topology-aware guard skips
          # a clean regeneration merge and dispatches strict trunk validation.
          gh workflow run regenerate-derived-artifacts.yml --repo "$GITHUB_REPOSITORY" --ref trunk

      - name: Dispatch strict trunk CI and docs validation
        if: needs.regenerate.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref trunk
          gh workflow run docs-site.yml --repo "$GITHUB_REPOSITORY" --ref trunk

name: Docs site

# Build and publish the SDK documentation site (guides + TypeDoc API reference +
# demo gallery) to GitHub Pages on every trunk merge. Decision record:
# docs/decisions/sdk-docs-hosting.md.

on:
  push:
    branches:
      - trunk
    paths:
      - "README.md"
      - "INSTALL.md"
      - "docs/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.docs.json"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "CHANGELOG.md"
      - "samples/catalog.v2.json"
      - "samples/contract/v2/**"
      - "samples/dist/honua-site-samples.v2.json"
      - "samples/dist/capability-sample-matrix.v1.json"
      - "samples/dist/golden-journey-visual-evidence.v1.json"
      - "samples/dist/honua-site-consumer-handoff.v1.json"
      - "scripts/build-docs-site.mjs"
      - "scripts/docs-api.mjs"
      - "scripts/check-docs-site-links.mjs"
      - "scripts/check-docs-versions-site.mjs"
      - "scripts/docs-versions.mjs"
      - "scripts/check-docs-release.mjs"
      - "config/docs-unpublished-releases.json"
      - "scripts/generate-llms-txt.mjs"
      - "scripts/generate-comparison-page.mjs"
      - "scripts/generate-mcp-eval-scorecard.mjs"
      - "scripts/lib/mcp-eval-scorecard.mjs"
      - "mcp/evals/runs/**"
      - "scripts/lib/docs-gallery-client.mjs"
      - "scripts/lib/docs-gallery.mjs"
      - "scripts/sample-contract.mjs"
      - "test/scripts/docs-gallery.test.mjs"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

# Allow the workflow token to publish to Pages; no additional secrets needed.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "20.19.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Derived-artifact decoupling (#677): llms.txt, docs/comparison.md, and the
    # sample gallery projection are regenerated on trunk by the
    # regenerate-derived-artifacts workflow. Its commit re-triggers this job on
    # the paths below, so the site is (re)built from fresh artifacts. The merge
    # commit that lands before regeneration must not fail these freshness gates,
    # so they run relaxed here.
    env:
      HONUA_DERIVED_ARTIFACTS_RELAX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trunk' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # REQ-004: hosted docs, repo docs, and llms.txt cannot drift apart.
      - name: Verify llms.txt freshness (gate)
        run: npm run verify:llms

      # Issue #499: the published comparison page never carries hand-edited
      # or stale figures.
      - name: Verify comparison page freshness (gate)
        run: npm run docs:comparison:check

      # Issue #499 REQ-004: the published npm search discoverability page is a
      # pure function of the committed observations — including the queries
      # where a package does not rank.
      - name: Verify npm search discoverability page freshness (gate)
        run: npm run docs:npm-search:check

      # Issue #960: the published cross-model MCP eval scorecard is a pure
      # function of the committed run artifacts under mcp/evals/runs/. A new run
      # that was not republished, or a hand-edited figure, fails here.
      - name: Verify MCP eval scorecard freshness (gate)
        run: npm run docs:mcp-scorecard:check

      - name: Verify documentation version manifest
        run: npm run docs:versions:check

      - name: Verify documentation manifest covers npm prereleases
        run: node scripts/check-docs-release.mjs registry

      - name: Verify documentation release tags
        env:
          # Release Please creates the tag from the same trunk push. Tolerate
          # that bounded race, but never publish a selector with a missing tag.
          HONUA_DOCS_TAG_VERIFY_ATTEMPTS: "12"
        run: npm run docs:versions:verify-tags

      - name: Verify sample gallery projection
        run: |
          npm run samples:verify
          npm run docs:site:gallery:test

      - name: Build TypeDoc API reference
        run: npm run docs:api

      - name: Assemble docs site
        run: npm run docs:site

      - name: Link-check built site
        run: npm run docs:site:linkcheck

      - name: Verify version navigation and fallbacks
        run: npm run docs:site:versions

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the manifest consumers fetch from Pages
        env:
          HONUA_DOCS_DEPLOY_VERIFY_ATTEMPTS: "12"
          HONUA_DOCS_EXPECT_SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/check-docs-release.mjs hosted

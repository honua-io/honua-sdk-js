name: Docs site

# Build and publish the SDK documentation site (guides + TypeDoc API reference +
# demo gallery). Daily and manual runs stay strict: a trunk push deployed before
# Release Please created the immutable SDK tag and before derived artifacts were
# regenerated. Release automation still dispatches this workflow.
# Decision record: docs/decisions/sdk-docs-hosting.md.

on:
  schedule:
    # After the 07:23 UTC derived-artifact regeneration, outside the push-before-tag race.
    - cron: "47 9 * * *"
  workflow_dispatch:

# Pages publish token. Issue writes belong only to the failure reporter.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.3"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Schedule and workflow_dispatch stay strict. The old relax applied only to
    # the trunk push that landed before derived-artifact regeneration. That
    # push is no longer a trigger, and these runs must not inherit it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # REQ-004: hosted docs, repo docs, and llms.txt cannot drift apart.
      - name: Verify llms.txt freshness (gate)
        run: npm run verify:llms

      # Issue #499: the published comparison page never carries hand-edited
      # or stale figures.
      - name: Verify comparison page freshness (gate)
        run: npm run docs:comparison:check

      # Issue #499 REQ-004: the published npm search discoverability page is a
      # pure function of the committed observations — including the queries
      # where a package does not rank.
      - name: Verify npm search discoverability page freshness (gate)
        run: npm run docs:npm-search:check

      # Issue #960: the published cross-model MCP eval scorecard is a pure
      # function of the committed run artifacts under mcp/evals/runs/. A new run
      # that was not republished, or a hand-edited figure, fails here.
      - name: Verify MCP eval scorecard freshness (gate)
        run: npm run docs:mcp-scorecard:check

      - name: Verify documentation version manifest
        run: npm run docs:versions:check

      - name: Verify documentation manifest covers npm prereleases
        run: node scripts/check-docs-release.mjs registry

      - name: Verify documentation release tags
        env:
          # A manual or release dispatch can still race tag creation. Tolerate
          # that bounded race, but never publish a selector with a missing tag.
          HONUA_DOCS_TAG_VERIFY_ATTEMPTS: "12"
        run: npm run docs:versions:verify-tags

      - name: Verify sample gallery projection
        run: |
          npm run samples:verify
          npm run docs:site:gallery:test

      - name: Build TypeDoc API reference
        run: npm run docs:api

      - name: Assemble docs site
        run: npm run docs:site

      - name: Link-check built site
        run: npm run docs:site:linkcheck

      - name: Verify version navigation and fallbacks
        run: npm run docs:site:versions

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the manifest consumers fetch from Pages
        env:
          HONUA_DOCS_DEPLOY_VERIFY_ATTEMPTS: "12"
          HONUA_DOCS_EXPECT_SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/check-docs-release.mjs hosted

  report-failure:
    name: Report deployment failure
    needs: [build, deploy]
    if: "${{ !cancelled() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One queued writer. Listing every issue page still races another writer,
    # and this group keeps those writers from creating the same title twice.
    concurrency:
      group: docs-site-failure-report
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the deployment failure issue
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Docs site deployment failure'
          case "${BUILD_RESULT}" in
            success|failure|cancelled|skipped) ;;
            *) echo 'invalid build result' >&2; exit 1 ;;
          esac
          case "${DEPLOY_RESULT}" in
            success|failure|cancelled|skipped) ;;
            *) echo 'invalid deploy result' >&2; exit 1 ;;
          esac
          repository="${GITHUB_REPOSITORY:-}"
          run_id="${GITHUB_RUN_ID:-}"
          server_url="${GITHUB_SERVER_URL:-}"
          [[ "${repository}" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?/[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]] || { echo 'invalid repository' >&2; exit 1; }
          [[ "${run_id}" =~ ^[0-9]+$ ]] || { echo 'invalid run id' >&2; exit 1; }
          [[ "${server_url}" == 'https://github.com' ]] || { echo 'invalid server url' >&2; exit 1; }
          run_url="${server_url}/${repository}/actions/runs/${run_id}"
          body=$(printf 'Build result: %s\nDeploy result: %s\nRun: %s\n' "${BUILD_RESULT}" "${DEPLOY_RESULT}" "${run_url}")

          # Follow the repository issue list, including the cursor in rel="next".
          # A bare page number skips or repeats issues. An unended or malformed
          # list must not create a second tracking issue.
          normalize_next() {
            local url="$1"
            [[ "${url}" =~ ^https://api\.github\.com/([^?]+)\?(.+)$ ]] || return 1
            local path_part="${BASH_REMATCH[1]}"
            local query="${BASH_REMATCH[2]}"
            if [[ "${path_part}" != "repos/${repository}/issues" && ! "${path_part}" =~ ^repositories/[0-9]+/issues$ ]]; then
              return 1
            fi
            local query_pattern='^[A-Za-z0-9._~%&=+/-]+$'
            [[ "${query}" =~ ${query_pattern} ]] || return 1
            local state_ok=0 per_ok=0 page_ok=0
            local page_val="" after_val="" pair key val
            local IFS='&'
            read -ra pairs <<< "${query}"
            for pair in "${pairs[@]}"; do
              [[ "${pair}" == *=* ]] || return 1
              key="${pair%%=*}"
              val="${pair#*=}"
              case "${key}" in
                state)
                  [[ "${state_ok}" == 0 && "${val}" == "all" ]] || return 1
                  state_ok=1
                  ;;
                per_page)
                  [[ "${per_ok}" == 0 && "${val}" == "100" ]] || return 1
                  per_ok=1
                  ;;
                page)
                  [[ "${page_ok}" == 0 && "${val}" =~ ^[1-9][0-9]*$ && "${val}" -le 200 ]] || return 1
                  page_ok=1
                  page_val="${val}"
                  ;;
                after)
                  [[ -z "${after_val}" && "${val}" =~ ^[A-Za-z0-9._~%+/=-]+$ ]] || return 1
                  after_val="${val}"
                  ;;
                *) return 1 ;;
              esac
            done
            [[ "${state_ok}" == 1 && "${per_ok}" == 1 && "${page_ok}" == 1 ]] || return 1
            printf '%s?state=all&per_page=100&page=%s' "${path_part}" "${page_val}"
            if [[ -n "${after_val}" ]]; then
              printf '&after=%s' "${after_val}"
            fi
            printf '\n'
          }

          number=""
          endpoint="repos/${repository}/issues?state=all&per_page=100&page=1"
          seen_pages=$'\n'
          page_count=0
          while true; do
            page_count=$((page_count + 1))
            [[ "${page_count}" -le 200 ]] || { echo 'issue list did not end' >&2; exit 1; }
            if printf '%s\n' "${seen_pages}" | grep -Fxq -- "${endpoint}"; then
              echo 'repeated issue list page' >&2
              exit 1
            fi
            seen_pages="${seen_pages}${endpoint}"$'\n'
            raw=$(gh api --method GET --include "${endpoint}")
            [[ -n "${raw}" ]] || { echo 'empty issue list response' >&2; exit 1; }
            status_line=$(printf '%s\n' "${raw}" | head -n 1)
            [[ "${status_line}" =~ ^HTTP/[0-9.]+[[:space:]]200[[:space:]] ]] || { echo 'issue list request failed' >&2; exit 1; }
            printf '%s\n' "${raw}" | awk 'NF==0 {found=1; exit} END {exit !found}' \
              || { echo 'issue list response has no header separator' >&2; exit 1; }
            headers=$(printf '%s\n' "${raw}" | tr -d '\r' | awk 'NF==0 {exit} {print}')
            payload=$(printf '%s\n' "${raw}" | tr -d '\r' | awk 'BEGIN{h=1} h && NF==0 {h=0; next} h {next} {print}')
            [[ -n "${payload}" ]] || { echo 'issue list response has no body' >&2; exit 1; }
            page_number=$(printf '%s\n' "${payload}" | jq -er --arg title "${title}" '
              if type != "array" then error("issue page is not an array") else . end
              | [
                  .[]
                  | select(type == "object" and .title == $title and (.pull_request | not))
                  | if (.number | type) != "number"
                      or .number < 1
                      or .number > 1000000000
                      or (.number | floor) != .number
                    then error("invalid issue number")
                    else .number
                    end
                ]
              | if length == 0 then "" else min end
            ')
            if [[ -n "${page_number}" ]]; then
              [[ "${page_number}" =~ ^[1-9][0-9]*$ ]] || { echo 'invalid issue number' >&2; exit 1; }
              if [[ -z "${number}" || "${page_number}" -lt "${number}" ]]; then
                number="${page_number}"
              fi
            fi
            next_url=$(printf '%s\n' "${headers}" | awk '
              {
                low=tolower($0)
                if (low ~ /^link:/) {
                  raw=$0
                  sub(/^[^:]*:[[:space:]]*/, "", raw)
                  n=split(raw, parts, ",")
                  for (i=1; i<=n; i++) {
                    part=tolower(parts[i])
                    if (part ~ /rel="next"/) {
                      if (match(parts[i], /<[^>]*>/)) {
                        print substr(parts[i], RSTART+1, RLENGTH-2)
                        exit 0
                      }
                      exit 1
                    }
                  }
                }
              }
            ') || { echo 'invalid next issue page link' >&2; exit 1; }
            [[ -z "${next_url}" ]] && break
            endpoint=$(normalize_next "${next_url}") || { echo 'invalid next issue page link' >&2; exit 1; }
          done
          if [[ -n "${number}" ]]; then
            jq -n --arg title "${title}" --arg body "${body}" '{title:$title, body:$body, state:"open"}' \
              | gh api --method PATCH "repos/${repository}/issues/${number}" --input -
          else
            jq -n --arg title "${title}" --arg body "${body}" '{title:$title, body:$body}' \
              | gh api --method POST "repos/${repository}/issues" --input -
          fi

name: Realtime Cross-Transport Conformance

# Deterministic fixture proof runs before the scheduled/manual honua-server
# observation. This workflow is intentionally not a pull-request gate: the
# network lane records server capability and availability without letting
# either masquerade as SDK semantics.
#
# Exit-code contract from scripts/realtime-conformance-evidence.mjs:
#   0 = every advertised transport executed, or the server explicitly does
#       not advertise realtime support
#   1 = an advertised transport or capability contract failed semantically
#   2 = the server/network was degraded and no semantic conclusion is valid
on:
  schedule:
    - cron: "20 6 * * 3" # Wednesdays 06:20 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: "Reviewed honua-server origin"
        type: string
        default: "https://demo.honua.io"
      source_id:
        description: "Source that advertises snapshot-plus-delta history"
        type: string
        default: "maui-parcels"
      layer_id:
        description: "Layer within the reviewed source"
        type: string
        default: "1"
      server_revision:
        description: >-
          Optional. The lane discovers the deployment revision from the server's
          own capability response or manifest; supply this only to assert that
          the deployment answering is the reviewed one. A mismatch fails every
          advertised transport. Leave blank to accept whatever the deployment
          reports.
        type: string
        required: false
      server_version:
        description: "Optional mutable server release version, recorded when the server publishes none"
        type: string
        required: false
      drive_controlled_mutation:
        description: >-
          Drive one bounded insert plus a per-transport touch through the
          deployment's dedicated controlled-conformance source. Requires
          FeatureStreaming__Conformance__Enabled on the target. Off by default:
          observing a deployment must never imply consent to write to it.
        type: boolean
        default: false
      allow_degraded:
        description: "Exit 0 when the server/network is unavailable; evidence remains degraded"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  HONUA_REALTIME_LIVE_CONFORMANCE_ENABLED: "true"

jobs:
  realtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Prove the deterministic full matrix and evidence classifier
        run: npm run test:realtime:conformance
      - name: Build the SDK used by both evidence lanes
        run: npm run build
      - name: Retain installed-entrypoint fixture evidence
        env:
          HONUA_SAMPLE_SOURCE_REVISION: ${{ github.sha }}
        run: >-
          node scripts/realtime-conformance-evidence.mjs
          --lane fixture
          --output test-results/realtime-fixture-conformance-evidence.json
          --strict
      # A scheduled run has no dispatch inputs, so every optional value below
      # renders as the empty string. The evidence script treats a blank value
      # as absent rather than as supplied-and-invalid; it also retains a
      # `collector-failed` document if it cannot classify anything, so this
      # step can no longer end without producing evidence.
      - name: Observe advertised honua-server transports
        env:
          HONUA_SAMPLE_SOURCE_REVISION: ${{ github.sha }}
          HONUA_REALTIME_LIVE_BASE_URL: ${{ inputs.base_url || 'https://demo.honua.io' }}
          HONUA_REALTIME_LIVE_SOURCE_ID: ${{ inputs.source_id || 'maui-parcels' }}
          HONUA_REALTIME_LIVE_LAYER_ID: ${{ inputs.layer_id || '1' }}
          HONUA_REALTIME_LIVE_SERVER_REVISION: ${{ inputs.server_revision || vars.HONUA_REALTIME_LIVE_SERVER_REVISION }}
          HONUA_REALTIME_LIVE_SERVER_VERSION: ${{ inputs.server_version || vars.HONUA_REALTIME_LIVE_SERVER_VERSION }}
          HONUA_REALTIME_LIVE_API_KEY: ${{ secrets.HONUA_REALTIME_LIVE_API_KEY }}
          # A write opt-in must honour an explicit "off". `inputs.x || vars.x`
          # would let the repository variable override an unchecked box, so a
          # dispatch answers only for itself and the variable is consulted only
          # on the unattended scheduled run.
          HONUA_REALTIME_LIVE_CONFORMANCE_MUTATE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.drive_controlled_mutation
            || github.event_name == 'schedule' && vars.HONUA_REALTIME_LIVE_CONFORMANCE_MUTATE
            || '' }}
          HONUA_REALTIME_LIVE_CONFORMANCE_LABEL: ${{ vars.HONUA_REALTIME_LIVE_CONFORMANCE_LABEL }}
          HONUA_REALTIME_LIVE_CONFORMANCE_TTL_SECONDS: ${{ vars.HONUA_REALTIME_LIVE_CONFORMANCE_TTL_SECONDS }}
        run: >-
          node scripts/realtime-conformance-evidence.mjs
          --lane live
          --output test-results/realtime-live-conformance-evidence.json
          --baseline-only
          --strict
          ${{ inputs.allow_degraded && '--allow-degraded' || '' }}
      - name: Publish revision-bearing conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: realtime-cross-transport-conformance-${{ github.run_id }}
          path: |
            test-results/realtime-fixture-conformance-evidence.json
            test-results/realtime-live-conformance-evidence.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize fixture and live classifications
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { summarizeRealtimeConformanceEvidence } from "./scripts/realtime-conformance-evidence.mjs";
            const paths = [
              "test-results/realtime-fixture-conformance-evidence.json",
              "test-results/realtime-live-conformance-evidence.json",
            ];
            const lines = ["## Realtime cross-transport conformance", ""];
            for (const path of paths) {
              if (!fs.existsSync(path)) {
                lines.push(`${path}: no evidence produced`);
                continue;
              }
              const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
              lines.push("```", ...summarizeRealtimeConformanceEvidence(evidence), "```", "");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          '

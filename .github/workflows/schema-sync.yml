name: Schema sync gate

# Fails if the vendored geospatial-mcp JSON Schemas under
# mcp/certification/geospatial-mcp-schemas/ drift from the pinned upstream
# commit. The standard is owned upstream (honua-io/geospatial-mcp) and vendored
# byte-for-byte; drift means someone hand-edited a vendored file instead of
# re-pinning. Remediation: scripts/sync-schemas.sh --write.

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    branches:
      - trunk
      - "release/**"

permissions:
  contents: read

concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema-sync:
    name: Vendored schemas match pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify byte-identity with the pinned geospatial-mcp commit
        run: bash scripts/sync-schemas.sh

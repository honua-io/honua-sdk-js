name: Browser Impact Observation

# Trusted, report-only shadow router for honua-io/honua-sdk-js#1286. This
# workflow always executes from the default branch after the canonical SDK CI
# run completes. Candidate content is checked out only as inert data; no script,
# action, package hook, or generated executable from the pull request runs here.
on:
  workflow_run:
    workflows: ["SDK CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed canonical SDK CI workflow run ID
        required: true
        type: string
      run_attempt:
        description: Exact completed workflow run attempt
        required: true
        type: string
      run_conclusion:
        description: Exact completed workflow run conclusion
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: browser-impact-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: Compare browser impact routing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt }}
      SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || inputs.run_conclusion }}
    steps:
      - name: Checkout trusted observer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reject non-default manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]]

      - name: Validate trusted policy and identity fixtures
        run: |
          node scripts/browser-impact-observe.mjs validate
          node --test test/scripts/browser-impact-observe.test.mjs
          node --test test/scripts/trusted-pr-workflow-run.test.cjs

      - name: Resolve exact SDK CI browser authority
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        with:
          script: |
            const { resolveTrustedPullRequestWorkflowRun } = require("./scripts/trusted-pr-workflow-run.cjs");
            const resolved = await resolveTrustedPullRequestWorkflowRun({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: process.env.SOURCE_RUN_ID,
              runAttempt: process.env.SOURCE_RUN_ATTEMPT,
              runConclusion: process.env.SOURCE_RUN_CONCLUSION,
              workflowPath: ".github/workflows/ci.yml",
              workflowName: "SDK CI",
              jobName: "JS SDK",
              defaultBranch: process.env.DEFAULT_BRANCH,
              repositoryId: Number(process.env.REPOSITORY_ID),
            });
            core.setOutput("pull_request", resolved.pullRequestNumber);
            core.setOutput("base_sha", resolved.baseSha);
            core.setOutput("head_sha", resolved.headSha);
            core.setOutput("job_id", resolved.job.id);
            core.setOutput("job_name", resolved.job.name);
            core.setOutput("job_conclusion", resolved.job.conclusion);
            core.setOutput("check_run_id", resolved.checkRun.id);

      - name: Reconstruct authoritative synthetic merge as inert data
        id: merge
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pull_request }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/browser-impact-candidate
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/browser-impact/${PR_NUMBER}"
          MERGE_SHA=$(git rev-parse "refs/remotes/origin/browser-impact/${PR_NUMBER}^{commit}")
          read -r MERGE_BASE MERGE_HEAD EXTRA_PARENT <<<"$(git show -s --format=%P "$MERGE_SHA")"
          [[ -n "$MERGE_BASE" && -n "$MERGE_HEAD" && -z "${EXTRA_PARENT:-}" ]]
          [[ "$MERGE_BASE" == "$BASE_SHA" ]]
          [[ "$MERGE_HEAD" == "$HEAD_SHA" ]]
          git worktree add --detach "$CANDIDATE_ROOT" "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_root=$CANDIDATE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Observe exact browser impact
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pull_request }}
          CANDIDATE_ROOT: ${{ steps.merge.outputs.candidate_root }}
          SOURCE_JOB_ID: ${{ steps.resolve.outputs.job_id }}
          SOURCE_JOB_NAME: ${{ steps.resolve.outputs.job_name }}
          SOURCE_JOB_CONCLUSION: ${{ steps.resolve.outputs.job_conclusion }}
          SOURCE_CHECK_RUN_ID: ${{ steps.resolve.outputs.check_run_id }}
        run: |
          node scripts/browser-impact-observe.mjs observe \
            --root "$CANDIDATE_ROOT" \
            --policy "$GITHUB_WORKSPACE/.github/data/browser-impact-policy.v1.json" \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --source-head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --observer-run-id "$GITHUB_RUN_ID" \
            --observer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --observer-event "$GITHUB_EVENT_NAME" \
            --observer-ref "$GITHUB_REF" \
            --observer-repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-run-conclusion "$SOURCE_RUN_CONCLUSION" \
            --source-job-id "$SOURCE_JOB_ID" \
            --source-job-name "$SOURCE_JOB_NAME" \
            --source-job-conclusion "$SOURCE_JOB_CONCLUSION" \
            --source-check-run-id "$SOURCE_CHECK_RUN_ID" \
            --output test-results/browser-impact-observation.json \
            --markdown test-results/browser-impact-summary.md
          cat test-results/browser-impact-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate source identity before publishing evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_PR: ${{ steps.resolve.outputs.pull_request }}
          EXPECTED_BASE: ${{ steps.resolve.outputs.base_sha }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.head_sha }}
          EXPECTED_JOB_ID: ${{ steps.resolve.outputs.job_id }}
          EXPECTED_JOB_CONCLUSION: ${{ steps.resolve.outputs.job_conclusion }}
          EXPECTED_CHECK_RUN_ID: ${{ steps.resolve.outputs.check_run_id }}
        with:
          script: |
            const { resolveTrustedPullRequestWorkflowRun } = require("./scripts/trusted-pr-workflow-run.cjs");
            const resolved = await resolveTrustedPullRequestWorkflowRun({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: process.env.SOURCE_RUN_ID,
              runAttempt: process.env.SOURCE_RUN_ATTEMPT,
              runConclusion: process.env.SOURCE_RUN_CONCLUSION,
              workflowPath: ".github/workflows/ci.yml",
              workflowName: "SDK CI",
              jobName: "JS SDK",
              defaultBranch: process.env.DEFAULT_BRANCH,
              repositoryId: Number(process.env.REPOSITORY_ID),
            });
            const expected = {
              pullRequestNumber: Number(process.env.EXPECTED_PR),
              baseSha: process.env.EXPECTED_BASE,
              headSha: process.env.EXPECTED_HEAD,
              jobId: Number(process.env.EXPECTED_JOB_ID),
              jobConclusion: process.env.EXPECTED_JOB_CONCLUSION,
              checkRunId: Number(process.env.EXPECTED_CHECK_RUN_ID),
            };
            if (
              resolved.pullRequestNumber !== expected.pullRequestNumber ||
              resolved.baseSha !== expected.baseSha ||
              resolved.headSha !== expected.headSha ||
              resolved.job.id !== expected.jobId ||
              resolved.job.conclusion !== expected.jobConclusion ||
              resolved.checkRun.id !== expected.checkRunId
            ) {
              core.setFailed("SDK CI source identity changed during observation");
            }

      - name: Revalidate synthetic merge before publishing evidence
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pull_request }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          EXPECTED_MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/browser-impact/${PR_NUMBER}"
          MERGE_SHA=$(git rev-parse "refs/remotes/origin/browser-impact/${PR_NUMBER}^{commit}")
          read -r MERGE_BASE MERGE_HEAD EXTRA_PARENT <<<"$(git show -s --format=%P "$MERGE_SHA")"
          [[ "$MERGE_SHA" == "$EXPECTED_MERGE_SHA" ]]
          [[ "$MERGE_BASE" == "$BASE_SHA" ]]
          [[ "$MERGE_HEAD" == "$HEAD_SHA" ]]
          [[ -z "${EXTRA_PARENT:-}" ]]

      - name: Retain trusted shadow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-impact-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: |
            test-results/browser-impact-observation.json
            test-results/browser-impact-summary.md
          if-no-files-found: error
          retention-days: 30

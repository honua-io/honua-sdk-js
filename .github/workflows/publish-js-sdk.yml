name: Publish JS SDK Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
      release_version:
        description: "Existing package version to publish from a branch recovery run"
        required: false
        default: ""
        type: string
      allow_branch_publish:
        description: "Allow a non-dry-run branch recovery publish when release_version matches package.json"
        required: false
        default: false
        type: boolean
      source_revision:
        description: "Exact commit required for a guarded branch recovery publish"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "js-sdk-*"

# Restrictive top-level default (Scorecard Token-Permissions); the publish
# job below grants the extra id-token:write scope trusted publishing needs.
permissions:
  contents: read

jobs:
  # Derived artifacts regenerate on a schedule, not per merge (#746), so force
  # a refresh before the strict samples:verify below. Fast no-op when trunk's
  # tip is already a regeneration merge.
  #
  # Branch-recovery runs only (#768): a reseal always lands as a NEW commit on
  # trunk, so it can never freshen the tree a tag already names. Waiting for one
  # on a tag run would burn 10+ minutes and still leave a stale tag stale, so
  # tag runs are gated by the strict release-seal check in the publish job
  # instead -- and release-please.yml creates the tag on the resealed commit
  # before dispatching this workflow.
  ensure-fresh-evidence:
    name: Ensure derived artifacts are fresh
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await derived-artifact regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow regenerate-derived-artifacts.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run regenerate-derived-artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref trunk
          # gh workflow run does not reliably expose the created run's id, so
          # poll for the first run newer than the pre-dispatch newest one.
          # Watching a concurrent schedule/dispatch run instead of ours is
          # fine: the concurrency group serializes them and every run reseals
          # the then-current trunk tip.
          run_id=""
          for attempt in {1..30}; do
            sleep 10
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow regenerate-derived-artifacts.yml \
              --limit 10 --json databaseId \
              --jq "[.[].databaseId | select(. > ${before_id})] | min // empty")"
            if [[ -n "$run_id" ]]; then
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "Dispatched regeneration run never appeared in the run list."
            exit 1
          fi
          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 15

  publish-js-packages:
    needs: ensure-fresh-evidence
    # ensure-fresh-evidence is deliberately skipped for tag runs (see above); a
    # skipped dependency would otherwise skip this job too. A genuine failure
    # there still blocks the publish.
    if: ${{ !cancelled() && needs.ensure-fresh-evidence.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm >= 11.5 exchanges the Actions OIDC token for
      # short-lived registry credentials at `npm publish` time (each package's
      # npmjs.com settings name this repo + workflow file as its trusted
      # publisher), and the same token backs the Sigstore provenance
      # attestation. Without id-token:write every non-dry-run publish fails
      # (the 0.0.11..0.0.19 outage). No NPM_TOKEN secret is used.
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      RELEASE_VERSION: ${{ github.event.inputs.release_version || '' }}
      ALLOW_BRANCH_PUBLISH: ${{ github.event.inputs.allow_branch_publish == 'true' }}
      EXPECTED_SOURCE_REVISION: ${{ github.event.inputs.source_revision || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Prepare a hash-pinned npm for trusted publishing
        # Node 20 bundles npm 10; the OIDC credential exchange needs npm >= 11.5.
        # The tarball's sha512 integrity hash (from the registry's own
        # dist.integrity field, recorded when this workflow was authored) is
        # pinned here and verified before use, so a re-published or tampered
        # registry artifact for the same version cannot slip in (mirrors
        # SHA-pinning `uses:` actions elsewhere in CI).
        #
        # The verified tarball is unpacked and run in place rather than handed
        # to a global installer: npm ships its dependencies bundled, so the CLI
        # runs straight from the archive, and the publish step below then
        # executes exactly the bytes this step hashed — no second, unpinned
        # resolution between verification and use.
        run: |
          set -euo pipefail
          npm_pkg="npm@11.18.0"
          npm_expected_sha512="T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w=="
          npm_tarball_url="$(npm view "$npm_pkg" dist.tarball)"
          npm_tarball_path="$(mktemp -t npm-pinned-XXXXXX.tgz)"
          curl -fsSL -o "$npm_tarball_path" "$npm_tarball_url"
          npm_actual_sha512="$(openssl dgst -sha512 -binary "$npm_tarball_path" | openssl base64 -A)"
          if [[ "$npm_actual_sha512" != "$npm_expected_sha512" ]]; then
            echo "::error::${npm_pkg} tarball sha512 mismatch: expected ${npm_expected_sha512}, got ${npm_actual_sha512}"
            exit 1
          fi
          npm_root="${RUNNER_TEMP}/npm-pinned"
          rm -rf "$npm_root"
          mkdir -p "$npm_root"
          tar -xzf "$npm_tarball_path" -C "$npm_root"
          rm -f "$npm_tarball_path"
          pinned_npm="${npm_root}/package/bin/npm-cli.js"
          node "$pinned_npm" --version
          echo "PINNED_NPM=${pinned_npm}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm dependencies)
        run: npm audit --omit=dev

      # Release-tag sealing gate (#768). Proves this exact commit is what a
      # downstream consumer can re-derive: every sample gate receipt is sealed
      # to its tree and the derived sample artifacts stamp this release version.
      # Runs before the long validation below so a stale tag fails in seconds
      # with release-specific remediation instead of surfacing as a bare "gate
      # receipt source digest mismatch" minutes later. Strict by construction:
      # the derived-artifacts relax escape hatch is set nowhere in this
      # workflow, and the gate refuses to run if it is set at all.
      - name: Verify release seal
        run: |
          set -euo pipefail
          seal_args=(check)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # fetch-depth: 0 normally brings the tag ref along, but a
            # workflow_dispatch on a tag is not guaranteed to, and the gate
            # asserts the tag resolves to the verified commit.
            git fetch --no-tags --force origin \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            seal_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          if [[ -n "${RELEASE_VERSION}" ]]; then
            seal_args+=(--expect-version "${RELEASE_VERSION}")
          fi
          node scripts/release-seal.mjs "${seal_args[@]}"

      # samples:verify runs strict here, so it also enforces the First Map
      # release-matrix lane (honua-io/honua-sdk-js#766): publishing is blocked
      # while the last sealed three-engine run failed, or while its seven-day
      # window has lapsed. Dispatch first-map-release-smoke.yml to reseal it.
      - name: Validate package
        run: |
          npm run samples:generate
          npm run typecheck
          npm run check
          npm run samples:verify
          # Every package this run is about to publish must be declared by the
          # release manifest, and every package the repository can publish must
          # be included in the cut or explicitly excluded (#1337).
          npm run verify:release-artifacts
          npm test
          npm run build:split-packages:prepared
          npm run verify:split-packages:prepared
          npm run verify:browser:prepared
          npm run demo:primitive-matrix
          npm run demo:examples:typecheck
          npm run demo:examples:build:prepared

      - name: Validate publish ref and version
        if: env.DRY_RUN != 'true'
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ -n "${EXPECTED_SOURCE_REVISION}" && "${GITHUB_SHA}" != "${EXPECTED_SOURCE_REVISION}" ]]; then
            echo "source_revision (${EXPECTED_SOURCE_REVISION}) does not match workflow source (${GITHUB_SHA})."
            exit 1
          fi

          if [[ -n "${RELEASE_VERSION}" && "${RELEASE_VERSION}" != "${package_version}" ]]; then
            echo "release_version (${RELEASE_VERSION}) does not match package.json version (${package_version})."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == js-sdk-* ]]; then
            tag_version="${GITHUB_REF_NAME#js-sdk-}"
            while [[ "$tag_version" == v* ]]; do
              tag_version="${tag_version#v}"
            done
            if [[ "$tag_version" != "$package_version" ]]; then
              echo "Tag version ($tag_version) does not match package.json version ($package_version)."
              exit 1
            fi
          elif [[ "${ALLOW_BRANCH_PUBLISH}" == "true" && -n "${RELEASE_VERSION}" && -n "${EXPECTED_SOURCE_REVISION}" ]]; then
            echo "Running guarded branch recovery publish for ${package_version} from ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}."
          else
            echo "Non-dry-run publish must run from a js-sdk-* tag, or set allow_branch_publish with release_version and source_revision for recovery. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Publish split packages
        run: |
          # Tags must satisfy the same source-tree executable policy as PRs;
          # do not rely only on the scheduled external Scorecard scan.
          npm run security:binary-artifacts
          npm run build:split-packages:prepared --silent
          # build:split-packages cleans dist/, so (re)build the browser bundle
          # afterwards. Without this the root package publishes without
          # dist/browser/*, breaking the ./browser export and every CDN path.
          npm run verify:browser:prepared --silent
          node scripts/sample-contract.mjs artifacts

          # Refuse to publish an artifact that does not contain the surface the
          # README/INSTALL/exports advertise (the failure mode behind the
          # stale-npm incident): every exports subpath, the browser bundles,
          # and every split package documented in docs/split-packages.md.
          npm run verify:publish-surface
          # Exercise the exact root tarball through an offline installation,
          # Node/TypeScript package resolution, and its packaged CLI shim.
          npm run verify:packed-sdk
          # verify:packed-sdk installs with --legacy-peer-deps (the SDK's own
          # dependency tree needs it), so it cannot see a peer range that
          # excludes the artifact beside it. Install the pinned client pair --
          # this tarball plus the @honua/mcp-server pin the generated .mcp.json
          # names -- under DEFAULT peer resolution, the way a customer does.
          # A cut whose pair only installs with --legacy-peer-deps stops here
          # rather than reaching the registry (#1529).
          npm run verify:client-pair

          flags=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags="--dry-run"
          fi

          resolve_dist_tag() {
            local version="$1"
            # Pre-1.0 every release is a prerelease but the newest one must own
            # `latest` (the 0.0.6-stale-latest incident). Trusted publishing
            # only authenticates `npm publish` itself — a follow-up
            # `npm dist-tag add` would have no credentials — so tag latest at
            # publish time. Post-1.0 prereleases keep their prerelease tag and
            # deliberately do NOT own latest.
            if [[ "$version" == 0.* ]]; then
              echo "latest"
              return
            fi
            if [[ "$version" == *-* ]]; then
              local prerelease="${version#*-}"
              echo "${prerelease%%.*}"
              return
            fi
            echo "latest"
          }

          publish_package() {
            local package_dir="$1"
            local package_name
            local package_version
            local dist_tag
            package_name="$(PACKAGE_DIR="$package_dir" node -p "const fs=require('fs'); const path=require('path'); JSON.parse(fs.readFileSync(path.join(process.env.PACKAGE_DIR, 'package.json'), 'utf8')).name")"
            package_version="$(PACKAGE_DIR="$package_dir" node -p "const fs=require('fs'); const path=require('path'); JSON.parse(fs.readFileSync(path.join(process.env.PACKAGE_DIR, 'package.json'), 'utf8')).version")"
            dist_tag="$(resolve_dist_tag "$package_version")"

            if [[ "${DRY_RUN}" != "true" ]] && node "${PINNED_NPM}" view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
              return
            fi

            if [[ "${DRY_RUN}" != "true" && -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
              echo "Actions OIDC token unavailable (id-token: write missing?); trusted publishing cannot mint credentials for ${package_name}@${package_version}."
              exit 1
            fi

            # The hash-verified CLI from the step above, not whatever `npm` the
            # PATH resolves to at this point.
            node "${PINNED_NPM}" publish "$package_dir" --access public --tag "$dist_tag" $flags
          }

          publish_package "."
          publish_package "./dist/packages/honua-sdk"
          publish_package "./dist/packages/honua-sdk-esri-compat"
          publish_package "./dist/packages/honua-react"
          publish_package "./dist/packages/honua-geometry"
          publish_package "./dist/packages/honua-app-platform"

      - name: Publish summary
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "Dry run complete. Split packages verified:"
          ls -la ./dist/packages/

  # Post-publish registry verification (#1337, AC6). A green publish step has
  # never been evidence that the release reached consumers: 0.0.19 published
  # while @honua/react 404'd, `latest` pointed at 0.0.6 for weeks, and three
  # releases produced tags on the wrong commit. This job asks the registry --
  # not the publisher -- for every artifact the release manifest includes, and
  # verifies version, dist-tag, tarball integrity, Sigstore provenance, the npm
  # publish attestation, and that the provenance's source commit is the commit
  # the release tag names. It fails closed and always emits the receipt
  # honua-io/honua-sdk-js#39 consumes.
  verify-published-release:
    name: Verify published release against the registry
    needs: publish-js-packages
    if: ${{ needs.publish-js-packages.result == 'success' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # @honua/mcp-server and create-honua-app publish from their own
          # Release Please tags rather than the sealed js-sdk tag, so their
          # source-commit check resolves those tags locally.
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"

      - name: Verify registry versions, integrity, provenance, and source SHA
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('js-sdk-v{0}', github.event.inputs.release_version) }}
          SEALED_COMMIT: ${{ github.sha }}
          # npm provenance records the ref the publish job actually ran from.
          # A tag run records refs/tags/js-sdk-v*, but the guarded branch
          # recovery publish this workflow supports (allow_branch_publish, which
          # already pins release_version and source_revision) records
          # refs/heads/<branch>. Pass the real ref so a recovered publish is
          # verified rather than failed after the packages are already live;
          # the commit check still pins every artifact to SEALED_COMMIT.
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # npm's attestation endpoint trails the publish by seconds to a couple
          # of minutes. Retry the whole verification rather than weakening any
          # single check: a genuinely missing artifact still fails after the
          # last attempt.
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-published-release.mjs \
              --tag "${RELEASE_TAG}" \
              --commit "${SEALED_COMMIT}" \
              --publish-ref "${PUBLISH_REF}" \
              --receipt test-results/published-release-verification.v1.json; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "::notice::Registry verification attempt ${attempt} failed; retrying in 60s."
              sleep 60
            fi
          done
          echo "::error title=Published release verification failed for ${RELEASE_TAG}::The registry does not agree with the release manifest. See the receipt artifact for the failing checks."
          exit 1

      - name: Summarize the receipt
        if: always()
        run: |
          set -euo pipefail
          receipt=test-results/published-release-verification.v1.json
          if [[ ! -f "$receipt" ]]; then
            echo "No receipt was written; the verifier did not run." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## Published release verification"
            echo
            RECEIPT="$receipt" node -e '
              const receipt = JSON.parse(require("fs").readFileSync(process.env.RECEIPT, "utf8"));
              console.log(`- status: \`${receipt.status}\``);
              console.log(`- tag: \`${receipt.sealedTag}\` on \`${receipt.sealedCommit}\``);
              console.log("");
              console.log("| package | version | dist-tag | source commit | status |");
              console.log("| --- | --- | --- | --- | --- |");
              for (const artifact of receipt.artifacts) {
                console.log(`| \`${artifact.npmName}\` | ${artifact.version} | ${artifact.distTag} | \`${artifact.sourceRevision ?? "unverified"}\` | ${artifact.status} |`);
              }
              for (const failure of receipt.failures) {
                console.log("");
                console.log(`- FAILED: ${failure}`);
              }
            '
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload published-release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-release-verification
          path: test-results/published-release-verification.v1.json
          if-no-files-found: error

name: Coding-agent eval

# Scheduled evaluation harness for issue #501 — measures whether coding agents
# can use @honua/sdk-js correctly on the first try (docs/coding-agent-evals.md).
#
# Two lanes, both ISOLATED from PR CI (NFR-001) — this workflow is never a PR
# gate; a failure notifies via the workflow-failure signal only:
#
#   1. fixture (always): the deterministic control. Replays the committed
#      known-good generations (must ALL pass — a failure means the SDK, docs,
#      or fixtures drifted) and the committed known-bad generations (must ALL
#      fail — the test-of-the-test that proves the harness still catches bad
#      code). Free, no model calls.
#   2. live agent (opt-in, workflow_dispatch only): runs Claude Code headless
#      (claude -p) against the same corpus with the published docs as the only
#      context, and uploads its scorecard as an artifact. Requires the
#      ANTHROPIC_API_KEY secret; the lane is skipped when it is absent.
on:
  schedule:
    # Tuesdays 07:00 UTC.
    - cron: "0 7 * * 2"
  workflow_dispatch:
    inputs:
      live_agent:
        description: "Also run the live claude-cli lane (requires ANTHROPIC_API_KEY secret)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  fixture-eval:
    name: Fixture lanes (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Known-good lane (gate — every task must pass)
        run: node scripts/eval-coding-agents.mjs --output test-results/coding-agent-eval/known-good

      - name: Known-bad lane (test-of-the-test — every task must fail)
        run: node scripts/eval-coding-agents.mjs --variant known-bad --expect-fail --output test-results/coding-agent-eval/known-bad

      - name: Upload fixture scorecards
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coding-agent-eval-fixture
          path: |
            test-results/coding-agent-eval/known-good/scorecard.json
            test-results/coding-agent-eval/known-good/scorecard.md
            test-results/coding-agent-eval/known-bad/scorecard.json
            test-results/coding-agent-eval/known-bad/scorecard.md
          if-no-files-found: warn

  live-agent-eval:
    name: Live agent lane (opt-in, Claude Code headless)
    needs: fixture-eval
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_agent }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Prepare a hash-pinned npm
        # The agent CLI below is placed by this npm rather than by whatever npm
        # the PATH resolves to, so the tool that unpacks and links it is itself
        # hash-verified. The tarball's sha512 integrity hash (from the
        # registry's own dist.integrity field, recorded when this workflow was
        # authored) is pinned here and verified before use, so a re-published
        # or tampered registry artifact for the same version cannot slip in
        # (mirrors SHA-pinning `uses:` actions elsewhere in CI).
        #
        # The verified tarball is unpacked and run in place rather than handed
        # to a global installer: npm ships its dependencies bundled, so the CLI
        # runs straight from the archive, and the step below then executes
        # exactly the bytes this step hashed — no second, unpinned resolution
        # between verification and use.
        run: |
          set -euo pipefail
          npm_pkg="npm@11.18.0"
          npm_expected_sha512="T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w=="
          npm_tarball_url="$(npm view "$npm_pkg" dist.tarball)"
          npm_tarball_path="$(mktemp -t npm-pinned-XXXXXX.tgz)"
          curl -fsSL -o "$npm_tarball_path" "$npm_tarball_url"
          npm_actual_sha512="$(openssl dgst -sha512 -binary "$npm_tarball_path" | openssl base64 -A)"
          if [[ "$npm_actual_sha512" != "$npm_expected_sha512" ]]; then
            echo "::error::${npm_pkg} tarball sha512 mismatch: expected ${npm_expected_sha512}, got ${npm_actual_sha512}"
            exit 1
          fi
          npm_root="${RUNNER_TEMP}/npm-pinned"
          rm -rf "$npm_root"
          mkdir -p "$npm_root"
          tar -xzf "$npm_tarball_path" -C "$npm_root"
          rm -f "$npm_tarball_path"
          pinned_npm="${npm_root}/package/bin/npm-cli.js"
          node "$pinned_npm" --version
          echo "PINNED_NPM=${pinned_npm}" >> "$GITHUB_ENV"

      - name: Install the hash-pinned Claude Code CLI
        # Exact-version pin, plus a pinned sha512 integrity hash (from the
        # registry's dist.integrity field, recorded when this workflow was
        # authored) verified before use — a re-published registry artifact for
        # the same version would otherwise be accepted silently. The verified
        # archive is then handed to the hash-verified CLI from the step above,
        # not to whatever `npm` the PATH resolves to. The CLI version is also
        # recorded in the scorecard's adapter metadata for traceability.
        run: |
          set -euo pipefail
          claude_pkg="@anthropic-ai/claude-code@2.1.207"
          claude_expected_sha512="30D3lGMO0iPmWnz6rCSHKd6d6gWtQ8CV2zKHHspEHZFyjDJsNOr2Xg6Kb/XEPsaFFu4BGIJz/7L6FQkcFq5cNA=="
          claude_tarball_url="$(npm view "$claude_pkg" dist.tarball)"
          claude_tarball_path="$(mktemp -t claude-code-pinned-XXXXXX.tgz)"
          curl -fsSL -o "$claude_tarball_path" "$claude_tarball_url"
          claude_actual_sha512="$(openssl dgst -sha512 -binary "$claude_tarball_path" | openssl base64 -A)"
          if [[ "$claude_actual_sha512" != "$claude_expected_sha512" ]]; then
            echo "::error::${claude_pkg} tarball sha512 mismatch: expected ${claude_expected_sha512}, got ${claude_actual_sha512}"
            exit 1
          fi
          node "${PINNED_NPM}" install --global "$claude_tarball_path"
          rm -f "$claude_tarball_path"
          claude --version

      - name: Live claude-cli lane
        env:
          HONUA_EVAL_AGENTS: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is not configured; skipping the live lane." >&2
            exit 0
          fi
          node scripts/eval-coding-agents.mjs --adapter claude-cli --output test-results/coding-agent-eval/claude-cli

      - name: Upload live scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coding-agent-eval-claude-cli
          path: |
            test-results/coding-agent-eval/claude-cli/scorecard.json
            test-results/coding-agent-eval/claude-cli/scorecard.md
          if-no-files-found: warn

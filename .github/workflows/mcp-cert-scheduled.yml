name: MCP scheduled live certification

# FREE, evidence-producing lane. Runs the deterministic MCP certifier (zero LLM /
# model calls — pure contract checks) on a weekly schedule and on demand, then
# commits the JSON + Markdown report into mcp/evals/runs/ and refreshes the
# leaderboard. Because it makes no paid calls it is safe to run automatically;
# the paid cross-model eval stays workflow_dispatch only (mcp-eval-live.yml).
#
# What is certified (the gate). The PINNED CANDIDATE, not the demo: the job
# boots ADMIN_LOCAL_SERVER_IMAGE with the compose `honua admin install local`
# generates (Postgres/PostGIS + Redis, so the durable control plane and its
# governed tools are registered), lets the installer mint the admin key with the
# generated HONUA_ADMIN_PASSWORD as X-API-Key, and certifies
# http://localhost:8080/mcp with that key (mcp/scripts/boot-candidate.sh). The
# lane used to certify https://demo.honua.io/mcp, and with no key configured it
# ran anonymously: every read-only round trip returned AuthorizationDenied and the
# lane was red on every run since 2026-07-05 for a reason that said nothing about
# the release. The roster-parity contract compares tools/list with honua-server's
# docs/gis/data/mcp-tool-roster.v1.json at the candidate's server sha; until that
# file exists at the pinned sha the contract reports `blocked`, which is not a pass.
#
# The certifier runs in --artifact-only mode so the report is always published;
# the `gate` job then fails the run unless the candidate certified PASS. Deep
# mutating/async contracts stay off (HONUA_MCP_CERT_ALLOW_MUTATION is unset).
#
# Publication shape (honua-sdk-js#1351). The publish job used to `git push` the
# report straight at trunk, which the branch ruleset rejects with GH013 — a
# scheduled push at a protected branch can never succeed, so every weekly run
# certified the surface and then threw the report away behind a red check run on
# trunk. It now publishes the same commit through an automation pull request and
# merges it once trunk's own required checks pass, the shape
# regenerate-derived-artifacts.yml already uses. Publishing to an artifact or a
# side branch instead was rejected: the committed corpus under mcp/evals/ is what
# the leaderboard and the docs-site scorecard are derived from, and the
# scorecard's freshness is itself a trunk gate (#960), so a report that never
# reaches trunk makes those surfaces silently stale. Not publishing at all would
# retire the certification record entirely.
#
# No secret is required for the gate: the candidate's key is minted in the job
# and never leaves it. Optional:
#   secret HONUA_SERVER_READ_TOKEN — read access to honua-io/honua-server, so the
#     roster fetch can tell "absent at this sha" from "not visible to this token".
#   variable HONUA_DEMO_MCP_URL (+ secret HONUA_DEMO_MCP_API_KEY) — ALSO certify a
#     demo /mcp as non-gating evidence (cert-demo.json). Unset: no demo run.
on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      remote_url:
        description: "Optional extra (non-gating) /mcp endpoint to certify beside the candidate"
        required: false
        type: string
      publish:
        description: "Commit the report + regenerated leaderboard back to the branch"
        required: true
        default: true
        type: boolean

# Top-level read-only; the publish job below widens to contents: write for itself.
permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  certify:
    name: Certify pinned candidate /mcp (free)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Pull the pinned ghcr.io/honua-io/honua-server candidate image.
      packages: read
    outputs:
      verdict: ${{ steps.candidate.outputs.verdict }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Boot the pinned candidate (installer compose + admin-key bootstrap)
        id: boot
        run: bash scripts/boot-candidate.sh "$RUNNER_TEMP/honua-candidate"

      - name: Certify the pinned candidate (deterministic, free, authenticated)
        id: candidate
        env:
          HONUA_MCP_CERT_TARGET: remote
          HONUA_MCP_REMOTE_URL: ${{ steps.boot.outputs.mcp_url }}
          HONUA_MCP_ROSTER_SERVER_SHA: ${{ steps.boot.outputs.server_sha }}
          HONUA_MCP_ROSTER_TOKEN: ${{ secrets.HONUA_SERVER_READ_TOKEN }}
          # A fresh install publishes nothing under the mock's svc-parks id: bind the
          # read-only round trips to the first layer the candidate lists, or report
          # the round-trip-target contract as blocked when it publishes none.
          HONUA_MCP_SERVICE_ID: discover
          INSTALL_DIR: ${{ steps.boot.outputs.install_dir }}
        run: |
          set -euo pipefail
          # The installer-minted key goes straight from the private .env into the
          # certifier's environment; it is masked and never echoed.
          HONUA_API_KEY="$(sed -n 's/^HONUA_ADMIN_KEY=//p' "$INSTALL_DIR/.env")" \
            node dist/src/certification/cli.js --artifact-only --out-dir candidate
          verdict="$(node -e 'const r=require("./candidate/mcp-certification-results.json");process.stdout.write(r.summary.pass?"pass":"fail")')"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Candidate verdict: $verdict"

      - name: Candidate logs
        if: always() && steps.boot.outcome != 'skipped'
        run: |
          docker compose --project-directory "$RUNNER_TEMP/honua-candidate" \
            --file "$RUNNER_TEMP/honua-candidate/compose.yaml" logs --no-color --tail 300 honua || true

      - name: Tear down the candidate
        if: always()
        run: bash scripts/boot-candidate.sh "$RUNNER_TEMP/honua-candidate" --down

      - name: Demo certification (optional, non-gating)
        if: ${{ inputs.remote_url != '' || vars.HONUA_DEMO_MCP_URL != '' }}
        env:
          HONUA_MCP_CERT_TARGET: remote
          HONUA_MCP_REMOTE_URL: ${{ inputs.remote_url || vars.HONUA_DEMO_MCP_URL }}
          HONUA_API_KEY: ${{ secrets.HONUA_DEMO_MCP_API_KEY }}
        run: node dist/src/certification/cli.js --artifact-only --out-dir demo

      - name: Platform-free live certification (any public FeatureServer, free)
        # Second target (issue #369): certify the standalone surface against a LIVE
        # public Esri FeatureServer with ZERO Honua surfaces — the census layer on
        # services.arcgis.com (anonymous, read-only). Honua-only tools skip-with-
        # reason. Never gates (--artifact-only); it is evidence that honua-mcp works
        # against any public endpoint, not just Honua deployments.
        env:
          HONUA_MCP_CERT_TARGET: standalone
          HONUA_BASE_URL: ${{ vars.HONUA_STANDALONE_BASE_URL || 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis' }}
          HONUA_TRANSPORT: rest
          HONUA_MCP_SERVICE_ID: ${{ vars.HONUA_STANDALONE_SERVICE_ID || '2020_Census_State_Apportionment' }}
          HONUA_MCP_LAYER_ID: "0"
        run: node dist/src/certification/cli.js --artifact-only --out-dir standalone-live

      - name: Stage report for leaderboard
        run: |
          mkdir -p staged
          cp candidate/mcp-certification-results.json staged/cert-candidate.json
          cp candidate/mcp-certification-results.md staged/cert-candidate.md
          if [ -f demo/mcp-certification-results.json ]; then
            cp demo/mcp-certification-results.json staged/cert-demo.json
            cp demo/mcp-certification-results.md staged/cert-demo.md
          fi
          cp standalone-live/mcp-certification-results.json staged/cert-standalone.json
          cp standalone-live/mcp-certification-results.md staged/cert-standalone.md

      - name: Upload certification artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-scheduled-cert
          path: mcp/staged/
          if-no-files-found: warn

  publish:
    name: Commit report + regenerate leaderboard
    needs: certify
    if: ${{ github.event_name == 'schedule' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents+pull-requests publish the automation branch and its pull request
      # on the GITHUB_TOKEN fallback path; actions releases the pull_request
      # check runs GitHub holds for approval when the pull request was opened
      # with GITHUB_TOKEN rather than the bot App.
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Automation identity (#1093). This lane opens *and merges* its own pull
      # request, so both operations have to run as the org bot App
      # `honua-io-bot` -- the bypass actor on the trunk `copilot_code_review`
      # ruleset. Detect first, mint second: without `BOT_APP_ID` the lane
      # degrades to today's `GITHUB_TOKEN` behaviour rather than failing, and
      # `SCHEDULED_AUTOMATION_APP_SLUGS` in scripts/lib/pr-issue-disposition.mjs
      # accepts both identities so the required disposition check passes either
      # way.
      - name: Detect bot App credentials
        id: creds
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_ID/BOT_APP_PRIVATE_KEY not configured; the certification pull request is authored and merged by github-actions."
          fi

      - name: Mint publication token
        id: app-token
        if: steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: honua-io

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The publication branch is pushed from this checkout, so it needs real
          # history rather than the default shallow one.
          fetch-depth: 0
          # ...and its credentials decide the push identity.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download certification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-scheduled-cert
          path: downloaded

      - name: Append report to the committed corpus
        run: |
          set -euo pipefail
          dest="mcp/evals/runs/$(date -u +%Y-%m-%d)"
          mkdir -p "$dest"
          cp downloaded/cert-candidate.json "$dest"/
          cp downloaded/cert-candidate.md "$dest"/ 2>/dev/null || true
          cp downloaded/cert-demo.json "$dest"/ 2>/dev/null || true
          cp downloaded/cert-demo.md "$dest"/ 2>/dev/null || true
          cp downloaded/cert-standalone.json "$dest"/ 2>/dev/null || true
          cp downloaded/cert-standalone.md "$dest"/ 2>/dev/null || true

      - name: Regenerate leaderboard
        run: node mcp/scripts/render-leaderboard.mjs

      # The published docs-site scorecard is a pure function of the artifacts
      # this job just committed, and its freshness is a trunk gate (#960), so it
      # is regenerated in the same commit. Dependency-free, like the leaderboard.
      - name: Regenerate published scorecard
        run: node scripts/generate-mcp-eval-scorecard.mjs write

      - name: Open the publication pull request
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          git config user.name "honua-ci[bot]"
          git config user.email "ci@honua.io"
          git add mcp/evals docs/generated/mcp-eval-scorecard.md
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the certification corpus and its two derived surfaces may ride
          # this automation; anything else means a regenerator wrote outside its
          # contract and must not be merged unattended.
          while IFS= read -r changed_path; do
            case "$changed_path" in
              mcp/evals/runs/* | mcp/evals/LEADERBOARD.md | mcp/evals/leaderboard.html | \
              docs/generated/mcp-eval-scorecard.md) ;;
              *)
                echo "Certification publication contains an unexpected path: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          git commit -m "chore(mcp): publish scheduled live-certification report"
          published="$(git rev-parse HEAD)"
          branch="automation/mcp-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base trunk \
            --head "$branch" \
            --title "chore(mcp): publish scheduled live-certification report" \
            --body "Scheduled deterministic MCP certification of the pinned candidate (and the standalone surface, plus the demo when configured), run \`${GITHUB_RUN_ID}\`. The report, leaderboard, and docs-site scorecard are regenerated from that run and published here because trunk cannot be pushed directly.")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # GitHub holds pull_request workflows created by GITHUB_TOKEN for approval;
      # a pull request opened by the bot App starts its runs unheld. This step
      # covers both: it waits for the expected workflows on the exact published
      # commit and approves only the ones GitHub actually held. It keeps
      # `github.token` deliberately -- approving a run is an Actions operation,
      # not an authorship one, so it does not need the publication identity.
      - name: Approve native checks for the publication pull request
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          set -euo pipefail
          # The two workflows that carry trunk's three required contexts:
          # "SDK CI" runs JS SDK and MCP SDK, "PR issue disposition" runs
          # PR Issue Disposition. Waiting on the named workflows rather than on
          # "something attached" keeps a later-appearing held run from being
          # missed and then blocking the check wait until the job times out.
          expected_workflows='["SDK CI","PR issue disposition"]'
          for attempt in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch "$BRANCH" \
              --event pull_request \
              --limit 30 \
              --json databaseId,workflowName,conclusion,headSha)"
            matching="$(jq \
              --arg published "$PUBLISHED" \
              --argjson expected "$expected_workflows" \
              '[.[] | select(.headSha == $published and (.workflowName as $name | $expected | index($name)))]' \
              <<<"$runs")"
            while IFS= read -r run_id; do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            done < <(jq -r '.[] | select(.conclusion == "action_required") | .databaseId' <<<"$matching")
            attached="$(jq 'map(.workflowName) | unique | length' <<<"$matching")"
            held="$(jq '[.[] | select(.conclusion == "action_required")] | length' <<<"$matching")"
            if [[ "$attached" -eq 2 && "$held" -eq 0 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Native checks did not become runnable for publication PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done

      - name: Merge the validated publication pull request
        if: steps.publish.outputs.changed == 'true'
        env:
          # The merge itself is the operation the trunk ruleset judges, so it
          # runs under the same bot App identity that opened the pull request.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            required="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name 2>/dev/null || true)"
            if [[ -z "$required" ]]; then
              required='[]'
            fi
            if [[ "$(jq 'length' <<<"$required")" -ge 3 ]]; then
              break
            fi
            if (( attempt == 30 )); then
              echo "Required checks did not attach to publication PR #$PR_NUMBER."
              exit 1
            fi
            sleep 10
          done
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --watch --fail-fast --interval 10
          # --match-head-commit refuses to merge anything but the commit whose
          # paths were validated above and whose checks were just watched.
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$PUBLISHED"
          # Merges performed with GITHUB_TOKEN emit no push event, so on the
          # fallback path nothing runs against the resulting trunk head and it
          # carries no core check runs at all. Re-enter the derived-artifact
          # automation either way, exactly as it does after its own token merge:
          # it reseals whatever the new head made stale and then dispatches
          # strict trunk CI itself. Dispatching ci.yml directly would run trunk's
          # STRICT validation against a head whose derived artifacts have not
          # been resealed yet, which fails on golden gate-receipt source digests
          # for reasons this report did not cause.
          gh workflow run regenerate-derived-artifacts.yml --repo "$GITHUB_REPOSITORY" --ref trunk

      - name: Summarize publication
        if: always()
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          {
            echo "## MCP scheduled live certification"
            echo
            if [[ "$CHANGED" == "true" ]]; then
              echo "Report published through ${PR_URL}."
            else
              echo "The certification produced no corpus change, so nothing was published."
            fi
            echo
            echo "The raw certification JSON and Markdown are always available as the"
            echo "\`mcp-scheduled-cert\` artifact on this run, whether or not the corpus changed."
          } >> "$GITHUB_STEP_SUMMARY"

  # The certification verdict gates the run. The report is published first (the
  # certify step is --artifact-only) so a red verdict still leaves its evidence on
  # trunk; this job then turns a non-PASS candidate verdict into a failed run.
  gate:
    name: Gate on the candidate verdict
    needs: [certify, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a PASS from the pinned candidate
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          VERDICT: ${{ needs.certify.outputs.verdict }}
        run: |
          if [ "$CERTIFY_RESULT" != "success" ]; then
            echo "::error::Candidate certification did not complete ($CERTIFY_RESULT)."
            exit 1
          fi
          if [ "$VERDICT" != "pass" ]; then
            echo "::error::The pinned candidate did not certify PASS (verdict: ${VERDICT:-none}). See the mcp-scheduled-cert artifact."
            exit 1
          fi
          echo "The pinned candidate certified PASS."

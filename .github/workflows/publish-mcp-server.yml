name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "mcp-server-*"

jobs:
  publish-mcp-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: mcp
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm dependencies)
        run: npm audit --omit=dev

      - name: Validate package
        run: |
          npm run typecheck
          npm run check
          npm run test

      - name: Validate publish ref and version
        if: env.DRY_RUN != 'true'
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != mcp-server-* ]]; then
            echo "Non-dry-run publish must run from an mcp-server-* tag. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}."
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${GITHUB_REF_NAME#mcp-server-}"
          while [[ "$tag_version" == v* ]]; do
            tag_version="${tag_version#v}"
          done
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match mcp/package.json version ($package_version)."
            exit 1
          fi

      - name: Publish package
        run: |
          flags=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags="--dry-run"
          fi

          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi

          if [[ "${DRY_RUN}" != "true" ]] && npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
            exit 0
          fi

          if [[ "${DRY_RUN}" != "true" && -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is required for publishing ${package_name}@${package_version}."
            exit 1
          fi

          npm publish --access public --tag "$dist_tag" $flags

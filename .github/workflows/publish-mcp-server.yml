name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "mcp-server-*"

jobs:
  publish-mcp-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm >= 11.5 exchanges the Actions OIDC token for
      # short-lived registry credentials at `npm publish` time; the package's
      # npmjs.com settings name this repo + workflow file as its trusted
      # publisher. No NPM_TOKEN secret is used.
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: mcp
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20.19.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Upgrade npm for trusted publishing
        # Node 20 bundles npm 10; the OIDC credential exchange needs npm >= 11.5.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm dependencies)
        run: npm audit --omit=dev

      - name: Validate package
        run: |
          npm run typecheck
          npm run check
          npm run test

      - name: Validate publish ref and version
        if: env.DRY_RUN != 'true'
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != mcp-server-* ]]; then
            echo "Non-dry-run publish must run from an mcp-server-* tag. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}."
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${GITHUB_REF_NAME#mcp-server-}"
          while [[ "$tag_version" == v* ]]; do
            tag_version="${tag_version#v}"
          done
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match mcp/package.json version ($package_version)."
            exit 1
          fi

      - name: Publish package
        run: |
          flags=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags="--dry-run"
          fi

          package_name="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          # Pre-1.0 the newest release must own `latest`; trusted publishing
          # only authenticates `npm publish` itself, so tag latest at publish
          # time rather than via a follow-up `npm dist-tag add`.
          if [[ "$package_version" == 0.* ]]; then
            dist_tag="latest"
          elif [[ "$package_version" == *-* ]]; then
            prerelease="${package_version#*-}"
            dist_tag="${prerelease%%.*}"
          else
            dist_tag="latest"
          fi

          if [[ "${DRY_RUN}" != "true" ]] && npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
            exit 0
          fi

          if [[ "${DRY_RUN}" != "true" && -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "Actions OIDC token unavailable (id-token: write missing?); trusted publishing cannot mint credentials for ${package_name}@${package_version}."
            exit 1
          fi

          npm publish --access public --tag "$dist_tag" $flags

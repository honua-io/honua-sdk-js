name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "mcp-server-v*"

jobs:
  publish-mcp-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: mcp
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ../js
          npm run build --prefix ../js

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npm run typecheck
          npm run test

      - name: Validate tag version
        if: github.event_name == 'push'
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${GITHUB_REF_NAME#mcp-server-v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match mcp/package.json version ($package_version)."
            exit 1
          fi

      - name: Publish package
        run: |
          if [[ "${DRY_RUN}" != "true" && -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is required for publishing."
            exit 1
          fi

          flags=""
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags="--dry-run"
          fi

          npm publish --access public $flags

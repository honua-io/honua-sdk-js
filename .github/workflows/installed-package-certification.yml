name: Installed package certification

on:
  workflow_dispatch:
    inputs:
      candidate_mode:
        description: Certify the approved current snapshot, an explicit snapshot, or the retained legacy regression
        type: choice
        default: current-release
        options: [current-release, release-snapshot, legacy-regression]
      reviewed_release_sha:
        description: Immutable reviewed honua-release trunk commit; required for release-snapshot
        type: string
        default: ""
      candidate_ref:
        description: Immutable nightly candidate commit SHA, exactly 40 lowercase hex characters; required for release-snapshot
        type: string
        default: ""
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read
  issues: write
  packages: read

# Serialize runs so the tracking-issue lookup/create below cannot race and
# open duplicates; never cancel a certification run in flight.
concurrency:
  group: installed-package-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          registry-url: https://registry.npmjs.org
      - name: Remove receipts retained from previous candidates
        run: rm -f test-results/installed-package-certification.json test-results/installed-example-certification.json test-results/installed-quickstart-budget.json test-results/installed-candidate-selection.json
      - name: Select the approved installed candidate
        id: candidate
        env:
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          REVIEWED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: node scripts/select-installed-candidate.mjs
      - name: Require immutable release snapshot selection
        if: steps.candidate.outputs.mode == 'release-snapshot'
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.reviewed_release_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'reviewed_release_sha must be an immutable release commit'; exit 1; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_ref must be an immutable nightly snapshot commit'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.candidate.outputs.mode == 'release-snapshot'
        with:
          repository: honua-io/honua-release
          ref: ${{ steps.candidate.outputs.reviewed_release_sha }}
          path: .tmp/honua-release-input
          fetch-depth: 0
      - uses: honua-io/honua-release/.github/actions/candidate-input@88ccc3d3fd0dad93c44b505575a6320de637e4ae # v2026.1-321-g88ccc3d candidate-input snapshot
        id: release_input
        if: steps.candidate.outputs.mode == 'release-snapshot'
        with:
          candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
          reviewed_release_sha: ${{ steps.candidate.outputs.reviewed_release_sha }}
          checkout_directory: .tmp/honua-release-input
      - name: Bind all installed producers to the adopted release bytes
        if: steps.candidate.outputs.mode == 'release-snapshot'
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.reviewed_release_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_ref }}
          MANIFEST_SHA256: ${{ steps.release_input.outputs.manifest_sha256 }}
          MATRIX_SHA256: ${{ steps.release_input.outputs.matrix_sha256 }}
        run: |
          {
            echo "HONUA_RELEASE_INPUT_DIRECTORY=$GITHUB_WORKSPACE/.tmp/honua-release-input"
            echo "HONUA_RELEASE_REVIEWED_SHA=$RELEASE_SHA"
            echo "HONUA_RELEASE_CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "HONUA_RELEASE_MANIFEST_SHA256=$MANIFEST_SHA256"
            echo "HONUA_RELEASE_MATRIX_SHA256=$MATRIX_SHA256"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.candidate.outputs.mode == 'release-snapshot'
        with:
          python-version: "3.12"
      - name: Verify the selected release npm artifacts with the upstream verifier
        if: steps.candidate.outputs.mode == 'release-snapshot'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-candidate-python-requirements.mjs .tmp/honua-release-input/tools/requirements-nightly.txt
          verifier_env="$(mktemp -d "$RUNNER_TEMP/honua-release-verifier.XXXXXX")"
          python3 -m venv "$verifier_env"
          "$verifier_env/bin/python" -m pip install --require-hashes --only-binary=:all: -r config/installed-candidate-python-requirements.txt
          mkdir -p test-results
          "$verifier_env/bin/python" .tmp/honua-release-input/tools/verify_client_artifacts.py \
            --manifest .tmp/honua-release-input/platform-manifest.yaml --ecosystem npm \
            | tee test-results/release-npm-artifact-verification.txt
      - name: Install locked test tooling
        run: npm ci
      - name: Validate the complete SDK package denominator before execution
        if: steps.candidate.outputs.mode == 'release-snapshot'
        run: node --input-type=module -e 'import { readInstalledCandidate } from "./scripts/installed-package-certification.mjs"; await readInstalledCandidate();'
      - name: Installed First Map bundle regression
        id: quickstart
        continue-on-error: true
        run: npm run test:installed-quickstart
      - name: Authenticate to the public candidate registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull exact candidate image
        run: |
          image="$(node --input-type=module -e 'import { readInstalledCandidate } from "./scripts/installed-package-certification.mjs"; console.log((await readInstalledCandidate()).server.image)')"
          docker pull "$image"
      - name: Emit installed-package receipt
        id: certify
        continue-on-error: true
        run: |
          mkdir -p test-results
          npm run certify:installed-package -- --execute-fixture --output test-results/installed-package-certification.json
      - name: Emit installed-example receipt
        id: examples
        continue-on-error: true
        run: npm run certify:installed-examples -- --output test-results/installed-example-certification.json
      - name: Upload exact installed candidate selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-candidate-selection
          path: test-results/installed-candidate-selection.json
          if-no-files-found: warn
      - name: Upload installed First Map measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-first-map-budget
          path: test-results/installed-quickstart-budget.json
          if-no-files-found: error
      - name: Upload release-ledger receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honua-sdk-js-installed-package-certification
          path: test-results/installed-package-certification.json
          if-no-files-found: error
      - name: Upload scoped upstream artifact verification
        if: always() && steps.candidate.outputs.mode == 'release-snapshot'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-npm-artifact-verification
          path: test-results/release-npm-artifact-verification.txt
          if-no-files-found: error
      - name: Upload installed-example receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honua-sdk-js-installed-example-certification
          path: test-results/installed-example-certification.json
          if-no-files-found: error
      - name: Enforce certification verdict
        if: steps.certify.outcome != 'success'
        run: |
          jq -r '.operations[] | select(.verdict != "pass") | "\(.id): \(.verdict) blocked-by \(.blockedBy // "n/a")"' test-results/installed-package-certification.json
          exit 1
      - name: Enforce installed-example verdict
        if: steps.examples.outcome != 'success'
        run: |
          jq -r '.admission.diagnostic // empty' test-results/installed-example-certification.json
          jq -r '.verdicts[] | select(.verdict == "fail") | "\(.id): fail issue \(.issue // "unfiled")"' test-results/installed-example-certification.json
          exit 1
      - name: Enforce installed First Map budget
        if: always() && steps.quickstart.outcome != 'success'
        run: exit 1
      # A red scheduled run is otherwise silent: keep ONE open tracking issue
      # and comment each further failure on it instead of opening duplicates.
      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          QUICKSTART: ${{ steps.quickstart.outcome }}
          CERTIFY: ${{ steps.certify.outcome }}
          EXAMPLES: ${{ steps.examples.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title="Installed package certification is failing"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Scheduled installed-package certification failed.

          - First Map bundle budget: ${QUICKSTART}
          - Installed-package receipt: ${CERTIFY}
          - Installed-example receipt: ${EXAMPLES}

          Run: ${run}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee mikemcdougall
          fi

name: Scheduled and live lane health

on:
  schedule:
    - cron: "41 15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  required-live-evidence-health:
    name: Required live evidence health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"
      - name: Project current lane health
        id: health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scheduled-live-health.mjs --strict --output scheduled-live-health.v1.json
      - name: Upload health projection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduled-live-health
          path: scheduled-live-health.v1.json
          retention-days: 90
      - name: Notify owner before stale evidence can reach release qualification
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Scheduled/live lane health alert"
          body="$(node -e 'const p=require("./scheduled-live-health.v1.json"); console.log(`Required scheduled/live evidence is unhealthy: ${p.requiredFailures.join(", ")}.\n\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nGenerated: ${p.generatedAt}`)"
          existing="$(gh issue list --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee mikemcdougall
          fi
      - name: Enforce required aggregate
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: test "$HEALTH_OUTCOME" = success

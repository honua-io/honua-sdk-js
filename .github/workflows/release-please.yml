name: Release Please

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/trunk' }}
    runs-on: ubuntu-latest
    # Serialize release runs (#1350). A JS SDK release holds this job for the
    # length of the reseal, and the reseal's own automation merge is a trunk
    # push that starts another run of this workflow. That run must not overlap
    # the release: between the draft release being cut and its tag being created
    # on the resealed commit there is no js-sdk-* tag, and Release Please's
    # release iterator skips a draft release because it has no tag commit -- so
    # a run inside that window cannot find the previous release and would
    # rebuild the next release pull request from far too much history. Queuing
    # (rather than cancelling in progress) means such a run simply happens after
    # the tag exists.
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Release identity (#1093). The release pull request must be authored by
      # the org bot App `honua-io-bot`, because that App -- not `github-actions`
      # -- is the bypass actor on the trunk `copilot_code_review` ruleset. Detect
      # first, mint second: without `BOT_APP_ID` the lane degrades to today's
      # `GITHUB_TOKEN` behaviour rather than failing, and
      # `RELEASE_AUTOMATION_APP_SLUGS` in scripts/lib/pr-issue-disposition.mjs
      # accepts both identities so the required disposition check passes either
      # way.
      - name: Detect bot App credentials
        id: creds
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_ID/BOT_APP_PRIVATE_KEY not configured; the release pull request is authored by github-actions and stays subject to the ruleset."
          fi

      - name: Mint release automation token
        id: app-token
        if: steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: honua-io

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch package publish workflows
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JS_SDK_RELEASE_CREATED: ${{ steps.release.outputs.release_created || steps.release.outputs['.--release_created'] }}
          JS_SDK_TAG_NAME: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
          # The JS SDK release is cut as a DRAFT (release-please-config.json,
          # #1350), so these two carry the draft that this step must finish.
          JS_SDK_RELEASE_ID: ${{ steps.release.outputs.id || steps.release.outputs['.--id'] }}
          JS_SDK_RELEASE_DRAFT: ${{ steps.release.outputs.draft || steps.release.outputs['.--draft'] }}
          MCP_RELEASE_CREATED: ${{ steps.release.outputs['mcp--release_created'] }}
          MCP_TAG_NAME: ${{ steps.release.outputs['mcp--tag_name'] }}
          CREATE_APP_RELEASE_CREATED: ${{ steps.release.outputs['packages/create-honua-app--release_created'] }}
          CREATE_APP_TAG_NAME: ${{ steps.release.outputs['packages/create-honua-app--tag_name'] }}
        run: |
          # -E so the ERR trap below is inherited by the shell functions: without
          # it a failing `gh` inside one of them still ends the step with a bare
          # exit code, which is the reporting gap #1337 was about.
          set -Eeuo pipefail

          # Every abort in this step must name itself. Three consecutive
          # releases (0.1.5/0.1.6/0.1.7-beta.0) died here and all a reader got
          # was "Process completed with exit code 1", so the tag placement was
          # diagnosed as "silently not firing" (#1337) when it had in fact been
          # aborted upstream twice and rejected by the ruleset once. Failures
          # are annotated and written to the job summary so the release log says
          # which tag, which commit, and what did not happen.
          RELEASE_FAILURE_TAG="(none)"
          fail() {
            local message="$1"
            echo "::error title=Release blocked for ${RELEASE_FAILURE_TAG}::${message}"
            {
              echo "## Release blocked: \`${RELEASE_FAILURE_TAG}\`"
              echo
              echo "${message}"
              echo
              echo "Nothing was published for this tag."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

          # Backstop for the aborts that are not routed through fail() by hand:
          # a `gh` call in a command substitution that errexit kills. Without
          # this the step can still end in "Process completed with exit code 1".
          trap 'fail "The release step failed at line ${LINENO}: ${BASH_COMMAND}. Nothing was published."' ERR

          dispatch_tag_publish() {
            local workflow="$1"
            local tag="$2"
            if [[ -z "${tag}" ]]; then
              RELEASE_FAILURE_TAG="${workflow}"
              fail "Release Please did not expose a tag for ${workflow}; refusing to dispatch a branch publish."
            fi
            RELEASE_FAILURE_TAG="${tag}"
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref "${tag}" -f dry_run=false
          }

          # Release ordering (#1350). Release Please cuts the JS SDK release as a
          # DRAFT ("draft": true on the "." package in release-please-config.json),
          # which is the whole fix: GitHub does not create a Git tag for a draft
          # release, and immutability does not attach until it is published. So
          # this function reseals FIRST, CREATES the tag on the resealed commit,
          # and only then publishes the draft. Nothing here ever moves a tag or
          # edits a published release, which is what made the previous ordering
          # (publish on the unsealed bump commit, then move the tag) impossible
          # to complete under org-enforced immutable releases.
          #
          # GitHub's own guidance for immutable releases is to draft first and
          # publish once everything is in place; the thing that has to be in
          # place here is the tag's commit rather than a release asset.
          dispatch_resealed_js_publish() {
            local tag="$1"
            local release_id="$2"
            local release_draft="$3"
            RELEASE_FAILURE_TAG="${tag:-(no tag exposed)}"
            if [[ "${tag}" != js-sdk-* ]]; then
              fail "Release Please exposed an invalid JS SDK tag: ${tag}"
            fi
            local release_version="${tag#js-sdk-}"
            while [[ "${release_version}" == v* ]]; do
              release_version="${release_version#v}"
            done

            # Fail before the ~40-minute reseal rather than after it. If the
            # release is not a draft then Release Please already published it on
            # the unsealed version-bump commit and created the tag there, and
            # under immutable releases that tag can never be moved -- exactly
            # what stranded 0.1.5/0.1.6/0.1.7-beta.0 (#1337). There is no
            # recovery inside this run; the config must be repaired and the
            # release re-cut.
            if [[ "${release_draft}" != "true" ]]; then
              fail "Release Please published ${tag} instead of drafting it, so its tag was created on the unsealed version-bump commit ${GITHUB_SHA} and cannot be moved under immutable releases. Restore \"draft\": true on the \".\" package in release-please-config.json and re-cut the release. Nothing was published."
            fi
            if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
              fail "Release Please did not expose a numeric draft release id for ${tag} (got '${release_id}'), so the draft cannot be published after the reseal. Nothing was published."
            fi

            # The strict reseal no longer runs on every trunk push (#746), so
            # dispatch one for the release commit's tree and publish only after
            # it has validated and merged its generated-only follow-up. The
            # dispatched run checks out trunk, whose tip is this release commit
            # or a descendant; the ancestry check below rejects anything else.
            local before_id
            before_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow regenerate-derived-artifacts.yml \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run regenerate-derived-artifacts.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref trunk
            # gh workflow run does not reliably expose the created run's id, so
            # poll for the first TRUNK run newer than the pre-dispatch newest
            # one. Watching a concurrent schedule/dispatch run instead of ours
            # is fine: the concurrency group serializes them and every trunk run
            # reseals the then-current trunk tip.
            #
            # Trunk-scoping is load-bearing, not tidiness. The concurrency group
            # `derived-artifacts` carries no ref, and the workflow accepts
            # `workflow_dispatch` on an arbitrary ref, so a run started from a
            # feature branch joins the very same group. Selecting one of those
            # would mean this release concluded "a reseal succeeded" on the
            # strength of a run that never checked out trunk -- and since the
            # comparison below accepts `identical`, an unresealed trunk would
            # then take the tag on the UNSEALED version-bump commit, which is
            # precisely the #1337 failure this ordering exists to prevent.
            # Filtered twice on purpose: `--branch` asks the server for trunk
            # runs, and the `headBranch` assertion re-checks each row, so the
            # guarantee does not rest on a CLI flag alone.
            local reseal_run_id=""
            for attempt in {1..30}; do
              sleep 10
              reseal_run_id="$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow regenerate-derived-artifacts.yml \
                --branch trunk \
                --limit 20 --json databaseId,headBranch \
                --jq "[.[] | select(.headBranch == \"trunk\") | .databaseId | select(. > ${before_id})] | min // empty")"
              if [[ -n "${reseal_run_id}" ]]; then
                break
              fi
            done
            if [[ -z "${reseal_run_id}" ]]; then
              fail "Dispatched reseal run for ${GITHUB_SHA} never appeared in the run list, so no sealed commit exists for ${tag} to be created on and nothing was published."
            fi
            # Reseal supersession (#1337). regenerate-derived-artifacts.yml
            # serializes on concurrency group `derived-artifacts` with
            # cancel-in-progress: false, and GitHub holds at most ONE run
            # pending per group: when a third run enters, the pending one is
            # CANCELLED. The reseal dispatched above therefore queues behind the
            # push-triggered reseal of this very release commit, and the next
            # pair of runs evicts it. That is not a hypothetical -- it is
            # exactly how js-sdk-v0.1.8-beta.0 was stranded: release run
            # 33007925674 dispatched reseal 33008321316 at 20:02:18Z, which
            # never started a single job, sat pending for 61 minutes behind the
            # already-running push reseal 33007925640 of the same commit, and
            # was cancelled at 21:03:49Z when the next reseal pair arrived. The
            # release then refused to tag -- even though 33007925640 had
            # SUCCEEDED and a sealed descendant did exist.
            #
            # A cancelled reseal is not a failed reseal. Supersession means a
            # newer run in the same group is resealing the same trunk tip, so
            # follow that chain rather than stranding the draft. This widens
            # nothing: the merge-base and generated-only-paths checks below
            # still decide whether the resulting tip may carry the tag, and a
            # genuine reseal FAILURE still stops the release immediately.
            local reseal_conclusion=""
            local reseal_hop
            for reseal_hop in {1..5}; do
              gh run watch "${reseal_run_id}" --repo "${GITHUB_REPOSITORY}" --interval 10 >/dev/null || true
              reseal_conclusion="$(gh run view "${reseal_run_id}" \
                --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion // empty')"
              if [[ "${reseal_conclusion}" == "success" ]]; then
                break
              fi
              if [[ "${reseal_conclusion}" != "cancelled" ]]; then
                fail "Reseal run ${reseal_run_id} for release commit ${GITHUB_SHA} concluded '${reseal_conclusion}', so there is no sealed commit to create ${tag} on and its draft release stays unpublished. Fix the reseal and re-run this workflow. Nothing was published."
              fi
              # Cancelled: find the run that evicted it and watch that instead.
              # Trunk-scoped for the same reason as the poll above -- a
              # feature-ref dispatch shares this concurrency group and can be
              # the very run that superseded ours, so it is exactly the wrong
              # thing to follow. Skip it and keep looking for a trunk run.
              local superseding_run_id=""
              for attempt in {1..30}; do
                superseding_run_id="$(gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow regenerate-derived-artifacts.yml \
                  --branch trunk \
                  --limit 20 --json databaseId,headBranch \
                  --jq "[.[] | select(.headBranch == \"trunk\") | .databaseId | select(. > ${reseal_run_id})] | min // empty")"
                if [[ -n "${superseding_run_id}" ]]; then
                  break
                fi
                sleep 10
              done
              if [[ -z "${superseding_run_id}" ]]; then
                fail "Reseal run ${reseal_run_id} for release commit ${GITHUB_SHA} was cancelled by the derived-artifacts concurrency group and no superseding reseal run appeared, so there is no sealed commit to create ${tag} on. Re-run this workflow once a reseal has completed. Nothing was published."
              fi
              echo "::notice::Reseal run ${reseal_run_id} was superseded in the derived-artifacts concurrency group; following the chain to ${superseding_run_id}."
              reseal_run_id="${superseding_run_id}"
              reseal_conclusion=""
            done
            if [[ "${reseal_conclusion}" != "success" ]]; then
              fail "Reseal for release commit ${GITHUB_SHA} was superseded repeatedly without reaching a successful run; the last run watched was ${reseal_run_id} ('${reseal_conclusion}'). Trunk is too busy to seal this release. Re-run this workflow when the derived-artifacts queue is quiet. Nothing was published."
            fi
            echo "reseal run ${reseal_run_id} succeeded for release commit ${GITHUB_SHA}"

            local trunk_sha
            trunk_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/trunk" --jq .object.sha)"
            local comparison
            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${trunk_sha}")"
            local comparison_status
            comparison_status="$(jq -r .status <<<"${comparison}")"
            local merge_base
            merge_base="$(jq -r .merge_base_commit.sha <<<"${comparison}")"
            if [[ "${merge_base}" != "${GITHUB_SHA}" || ( "${comparison_status}" != "ahead" && "${comparison_status}" != "identical" ) ]]; then
              fail "Trunk ${trunk_sha} is not a generated-only descendant of release commit ${GITHUB_SHA}, so ${tag} may not be created on it and nothing was published."
            fi
            # Keep this allowlist in lockstep with the identical one in
            # regenerate-derived-artifacts.yml's "Validate and publish
            # regeneration commits" step: that job is the producer of these
            # commits, this is the consumer that decides a release may proceed
            # (and, below, that the release tag may be created on them). A path
            # present there but missing here stalls every release; the reverse
            # would let non-generated content ride into a released tag.
            while IFS= read -r changed_path; do
              case "${changed_path}" in
                README.md | \
                api-report/* | \
                bench/cross-sdk/corpus.json | \
                docs/bundle-sizes.md | docs/comparison.md | docs/errors.md | \
                docs/generated/mcp-eval-scorecard.md | docs/generated/sample-catalog.md | \
                llms.txt | llms-full.txt | \
                examples/migration-workbench/public/artifacts/* | \
                examples/migration-workbench/src/generated/* | \
                examples/ai-spatial-app-builder/evidence/* | \
                examples/realtime-incident-dashboard/evidence/* | \
                examples/spatial-analytics-workbench/evidence/* | \
                samples/catalog.v2.json | \
                samples/contract/v2/migrations/catalog.v1-to-v2.json | \
                samples/contract/v2/release-matrix-lanes.v1.json | \
                samples/contract/v2/consumer-fixtures/honua-site-consumer.v2.json | \
                samples/contract/v2/consumer-fixtures/honua-site-consumer.v3.json | \
                samples/contract/v2/consumer-fixtures/honua-site-consumer.v4.json | \
                samples/dist/* | samples/evidence/imagery-cog-quickstart/* | \
                samples/evidence/maplibre-quickstart/* | samples/evidence/migration-workbench/* | \
                samples/evidence/service-explorer/*)
                  ;;
                *)
                  fail "Post-release trunk contains a non-generated path: ${changed_path}. ${tag} may not be created on ${trunk_sha} and nothing was published."
                  ;;
              esac
            done < <(jq -r '.files[].filename' <<<"${comparison}")

            # Release-tag sealing (#768, reordered by #1350). The version-bump
            # commit this workflow is running on can never be self-verifiable:
            # it edits package.json plus the version-stamped fixtures listed in
            # release-please-config.json, all inside the evidence-neutral source
            # digest (scripts/sample-gate-receipt.mjs), so a pristine checkout
            # of it fails samples:generate/samples:verify with a gate receipt
            # source digest mismatch, and the sample contract artifacts it
            # carries still self-report the previous release version. The reseal
            # awaited above produced a descendant that IS sealed and stamps this
            # release's version, and because the release is still a draft no tag
            # exists yet -- so the tag is CREATED there, first time, correctly.
            # The two checks above -- merge base equals this release commit, and
            # every changed path is generated output -- are what make tagging
            # the descendant honest: only regenerated bytes can differ, so the
            # tag still names exactly this release's source.
            echo "::group::Create ${tag} on the resealed commit"
            echo "release commit: ${GITHUB_SHA} (unsealed version bump)"
            echo "resealed tip:   ${trunk_sha}"
            local tag_created="true"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${trunk_sha}" >/dev/null || tag_created="false"
            echo "::endgroup::"
            if [[ "${tag_created}" == "true" ]]; then
              echo "created refs/tags/${tag} -> ${trunk_sha}"
            else
              # The only benign reason a create fails is that this run already
              # created it (a re-run after a later step failed). Anything else
              # means the tag exists somewhere it must not, and under immutable
              # releases it can never be moved.
              local existing_tag_sha
              existing_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null || echo "(unresolvable)")"
              if [[ "${existing_tag_sha}" != "${trunk_sha}" ]]; then
                fail "Creating ${tag} on the resealed commit ${trunk_sha} failed, and the tag names ${existing_tag_sha} instead. A release tag gets exactly one chance to be created in the right place: immutable releases forbid moving it once its release is published. Nothing was published."
              fi
              echo "${tag} already named the resealed commit; treating creation as done"
            fi

            # Post-condition, asserted every release (#1349). The tag used to be
            # positioned by a fire-and-forget PATCH whose outcome nothing
            # checked, which is how three releases shipped tags that could never
            # pass the seal. Reordering does not make this unreachable: a create
            # that silently does not land, a tag racing in from elsewhere, or a
            # resolvable-but-wrong ref all still land here. If the tag does not
            # name the resealed commit, stop before the release is published --
            # after publication nothing about it can be corrected.
            local sealed_tag_sha
            sealed_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "${sealed_tag_sha}" != "${trunk_sha}" ]]; then
              fail "Post-condition failed: ${tag} resolves to ${sealed_tag_sha}, not the resealed commit ${trunk_sha}. The release tag is not on a sealed tree and \`node scripts/release-seal.mjs check --tag ${tag}\` would fail. Nothing was published."
            fi
            echo "${tag} verified on resealed commit ${sealed_tag_sha}"

            # Publish the draft. Read the release back from GitHub rather than
            # trusting the action's outputs: this is the last moment anything
            # about the release can be corrected.
            local draft_state
            draft_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '"\(.draft) \(.tag_name)"')"
            if [[ "${draft_state}" != "true ${tag}" ]]; then
              fail "Release ${release_id} is '${draft_state}' (draft tag_name), not the unpublished draft for ${tag}. Refusing to publish it. Nothing was published."
            fi
            local published_draft
            if ! published_draft="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false --jq .draft)"; then
              fail "Publishing draft release ${release_id} for ${tag} was rejected by GitHub. Unlike the tag move this replaces, that is recoverable: ${tag} already names the sealed commit ${trunk_sha}, so publish the draft and re-dispatch publish-js-sdk.yml against ${tag}. Nothing was published."
            fi
            if [[ "${published_draft}" != "false" ]]; then
              fail "Release ${release_id} for ${tag} is still a draft after being published. Nothing was published."
            fi

            # Second post-condition, and not a duplicate of the first: GitHub
            # creates the tag itself, at the release's target_commitish (the
            # UNSEALED bump commit), when a draft is published while its tag
            # does not exist. So publication is the one operation that can still
            # put this release on the wrong commit, and it is re-checked here.
            local published_tag_sha
            published_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "${published_tag_sha}" != "${trunk_sha}" ]]; then
              fail "Post-condition failed: publishing release ${release_id} repointed ${tag} to ${published_tag_sha} instead of the resealed commit ${trunk_sha}. Nothing was published."
            fi
            echo "${tag} published on resealed commit ${published_tag_sha}"
            {
              echo "## Release tag sealed: \`${tag}\`"
              echo
              echo "- release commit: \`${GITHUB_SHA}\`"
              echo "- resealed commit the tag names: \`${published_tag_sha}\`"
              echo "- GitHub Release \`${release_id}\` published from that tag"
            } >> "${GITHUB_STEP_SUMMARY}"

            # Publish from the tag itself rather than as a branch recovery run:
            # the tag names the sealed commit, so publish-js-sdk's own
            # tag/version check and its strict release-seal gate both apply to
            # the exact bytes consumers will fetch.
            gh workflow run publish-js-sdk.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${tag}" \
              -f dry_run=false \
              -f release_version="${release_version}" \
              -f source_revision="${trunk_sha}"

            # The release smoke is dispatched against the tag rather than
            # driven by the `release: published` event: that event's payload SHA
            # is the release's target_commitish -- the unsealed version-bump
            # commit -- and actions/checkout pins it, so such a run would verify
            # the stale tree however long it waited.
            gh workflow run first-map-release-smoke.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${tag}"
          }

          if [[ "${JS_SDK_RELEASE_CREATED}" == "true" ]]; then
            dispatch_resealed_js_publish "${JS_SDK_TAG_NAME}" "${JS_SDK_RELEASE_ID}" "${JS_SDK_RELEASE_DRAFT}"
          fi
          if [[ "${MCP_RELEASE_CREATED}" == "true" ]]; then
            dispatch_tag_publish publish-mcp-server.yml "${MCP_TAG_NAME}"
          fi
          if [[ "${CREATE_APP_RELEASE_CREATED}" == "true" ]]; then
            dispatch_tag_publish publish-create-honua-app.yml "${CREATE_APP_TAG_NAME}"
          fi

  release-please-refresh:
    needs: release-please
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-base-refresh-${{ github.repository }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_pr_present: ${{ steps.refresh.outputs.release_pr_present }}
      release_head_sha: ${{ steps.refresh.outputs.release_head_sha }}
      refresh_status: ${{ steps.refresh.outputs.refresh_status }}
    steps:
      - name: Check out trusted base-refresh policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-refresh-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js for trusted base-refresh policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"

      # The base refresh is a `PUT /pulls/{n}/update-branch`, so the merge commit
      # it lands on `release-please--branches--trunk` carries the token's
      # identity (#1093). Mint the same App token the release job authors with,
      # so the branch never mixes two bot identities, and fall back to
      # `GITHUB_TOKEN` when the secret is absent.
      - name: Detect bot App credentials
        id: creds
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_ID/BOT_APP_PRIVATE_KEY not configured; the base refresh pushes as github-actions."
          fi

      - name: Mint release automation token
        id: app-token
        if: steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: honua-io

      - name: Refresh the unchanged exact Release Please branch onto trusted trunk
        id: refresh
        working-directory: trusted-refresh-policy
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_PLEASE_PRS_CREATED: ${{ needs.release-please.outputs.prs_created }}
          TRUSTED_POLICY_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          node scripts/refresh-release-please-base.mjs

  release-please-ci:
    needs: [release-please, release-please-refresh]
    if: ${{ needs.release-please-refresh.outputs.release_pr_present == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-ci-dispatch-${{ github.repository }}
      cancel-in-progress: true
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted canonical CI dispatch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-ci-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js for trusted canonical CI dispatch policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"

      - name: Dispatch and await canonical CI for the exact Release Please head
        working-directory: trusted-ci-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_PR_READY: ${{ needs.release-please-refresh.outputs.release_pr_present }}
          TRUSTED_POLICY_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          node scripts/dispatch-release-please-ci.mjs

  release-please-disposition:
    needs: [release-please, release-please-refresh, release-please-ci]
    if: >-
      ${{ always() &&
          needs.release-please.result == 'success' &&
          needs.release-please-refresh.result == 'success' &&
          (needs.release-please-refresh.outputs.release_pr_present != 'true' ||
           needs.release-please-ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Release Please updates its PR in the preceding trusted push job. Emit
      # the required context here so bot commits never need PR approval while
      # keeping check publication out of the release job's token.
      - name: Check out trusted disposition policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js for trusted disposition policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"

      - name: Emit current Release Please SDK checks
        working-directory: trusted-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_POLICY_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          node scripts/publish-release-please-ci-checks.mjs

      - name: Emit current Release Please disposition check
        working-directory: trusted-policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_POLICY_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          node scripts/check-release-please-disposition.mjs

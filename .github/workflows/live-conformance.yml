name: Live SDK Conformance

# Scheduled/manual observation of public reference services (issue #535).
#
# This lane is deliberately NOT part of ordinary CI: it talks to third-party
# servers that nobody in this repo operates, so it can never gate a pull
# request. Pull requests keep running the deterministic, always-on offline lane
# (`test/live-conformance-evidence.test.ts`) plus the pinned fixture lane
# (`npm run test:conformance`).
#
# Exit-code contract from scripts/live-conformance-evidence.mjs:
#   0 = every reviewed target executed (or is intentionally muted, unexpired)
#   1 = a semantic regression: a parser, serializer, or capability contract
#       broke, or an endpoint review/mute expired
#   2 = availability only: an upstream service was unreachable, timed out,
#       rate-limited, or 5xx'd. Typed, owned, and expiring - never a hard green.
on:
  schedule:
    - cron: "40 6 * * 1" # Mondays 06:40 UTC
  workflow_dispatch:
    inputs:
      allow_degraded:
        description: "Exit 0 when the only problems are upstream availability"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  HONUA_LIVE_CONFORMANCE_ENABLED: "true"

jobs:
  public-reference-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Prove the offline lane before contacting anyone
        run: npx vitest run test/live-conformance-evidence.test.ts
      - name: Build the SDK the runner drives
        run: npm run build
      - name: Drive the public SDK journeys against the reviewed endpoints
        env:
          HONUA_SAMPLE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          node scripts/live-conformance-evidence.mjs \
            --output test-results/live-conformance-evidence.json \
            --strict ${{ inputs.allow_degraded && '--allow-degraded' || '' }}
      - name: Publish live-conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-conformance-evidence
          path: test-results/live-conformance-evidence.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize the lane
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { summarizeLiveConformanceEvidence } from "./scripts/live-conformance-evidence.mjs";
            const path = "test-results/live-conformance-evidence.json";
            if (!fs.existsSync(path)) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "No live-conformance evidence was produced.\n");
              process.exit(0);
            }
            const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
            const summary = summarizeLiveConformanceEvidence(evidence);
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              ["## Live SDK conformance", "", "```", ...summary.lines, "```", ""].join("\n"),
            );
          '

name: Security

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  schedule:
    - cron: '0 6 * * 1'

# Top level stays read-only; each job below grants only the extra scopes it
# actually uses (security-events:write for SARIF upload, id-token:write for
# Scorecard's OpenSSF publish step, actions:read for Scorecard's own repo
# introspection) instead of every job inheriting write access it doesn't need.
permissions:
  contents: read

jobs:
  binary-artifacts:
    name: Binary artifact policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.0"
      - run: npm run security:binary-artifacts

  trivy:
    permissions:
      contents: read
      security-events: write
    uses: honua-io/.github/.github/workflows/reusable-trivy.yml@e26b67e904f2c23796fe677d267d73188a764545 # v0.36.0 Trivy workflow snapshot
    with:
      scan-type: fs

  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: honua-io/.github/.github/workflows/reusable-scorecard.yml@e26b67e904f2c23796fe677d267d73188a764545 # v2.4.4 Scorecard workflow snapshot

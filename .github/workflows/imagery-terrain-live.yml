name: Imagery and Terrain Live Evidence

on:
  schedule:
    - cron: "35 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  live-evidence:
    name: Pinned STAC and bounded COG range
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Execute pinned public imagery journey
        env:
          HONUA_SAMPLE_LIVE_ENABLED: "true"
        run: npm run evidence:imagery-terrain:live -- --strict

      - name: Upload shared sample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-sdk-imagery-terrain-live-evidence
          path: test-results/imagery-terrain-live-evidence.json
          if-no-files-found: error
          retention-days: 90

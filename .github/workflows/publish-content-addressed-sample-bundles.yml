name: Publish content-addressed sample bundles

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-content-addressed-sample-bundles
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: Build, reproduce, and smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Gate exact current trunk
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/trunk"
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/trunk" --jq .sha)"
          test "$CURRENT_SHA" = "$SOURCE_COMMIT"

      - name: Checkout governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: governance
          persist-credentials: false

      - name: Checkout source A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: source-a
          persist-credentials: false

      - name: Checkout source B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: source-b
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: source-a/package-lock.json

      - name: Install source A
        working-directory: source-a
        run: npm ci

      - name: Install source B
        working-directory: source-b
        run: npm ci

      - name: Build, verify, pack, and smoke source A
        working-directory: source-a
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          test "$SOURCE_DATE_EPOCH" -gt 0
          npm run samples:bundles:build
          npm run samples:bundles:verify
          npx playwright install --with-deps chromium
          npm run samples:bundles:smoke
          SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const target = ".artifacts/sample-bundle-smoke/browser-smoke.v1.json";
          const receipt = JSON.parse(await readFile(target, "utf8"));
          receipt.generatedAt = new Date(Number(process.env.SOURCE_DATE_EPOCH) * 1000).toISOString();
          await writeFile(target, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          mkdir -p ../publication ../build-a
          cp .artifacts/sample-bundles/sample-bundles.v2.json ../publication/sample-bundles.v2.json
          node scripts/pack-sample-bundles.mjs \
            --bundle-root .artifacts/sample-bundles \
            --output ../publication/sample-bundles.tar.gz \
            --metadata ../build-a/pack-metadata.v1.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Build, verify, and pack source B
        working-directory: source-b
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          npm run samples:bundles:build
          npm run samples:bundles:verify
          mkdir -p ../build-b
          cp .artifacts/sample-bundles/sample-bundles.v2.json ../build-b/sample-bundles.v2.json
          node scripts/pack-sample-bundles.mjs \
            --bundle-root .artifacts/sample-bundles \
            --output ../build-b/sample-bundles.tar.gz \
            --metadata ../build-b/pack-metadata.v1.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Compare independent builds
        run: |
          set -euo pipefail
          cmp publication/sample-bundles.v2.json build-b/sample-bundles.v2.json
          cmp publication/sample-bundles.tar.gz build-b/sample-bundles.tar.gz
          cmp build-a/pack-metadata.v1.json build-b/pack-metadata.v1.json

      - name: Create deterministic and run receipts
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -C governance show -s --format=%ct "$SOURCE_COMMIT")"
          node governance/scripts/immutable-sample-bundle-attestation.mjs receipt \
            --manifest publication/sample-bundles.v2.json \
            --archive publication/sample-bundles.tar.gz \
            --pack-metadata build-a/pack-metadata.v1.json \
            --smoke-receipt source-a/.artifacts/sample-bundle-smoke/browser-smoke.v1.json \
            --lockfile source-a/package-lock.json \
            --deterministic-receipt publication/sample-bundles-attestation.v1.json \
            --run-receipt publication/sample-bundles-run-attestation.v1.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-name "$RUNNER_NAME" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-image "${ImageOS:?}" \
            --runner-image-version "${ImageVersion:?}"

      - name: Run governance tests and policy
        working-directory: source-a
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --test test/scripts/immutable-sample-bundle-attestation.test.mjs
          node scripts/immutable-sample-bundle-attestation.mjs policy \
            --workflow .github/workflows/publish-content-addressed-sample-bundles.yml \
            --resolve-actions true

      - name: Stage transfer
        run: |
          set -euo pipefail
          mkdir staged
          cp \
            publication/sample-bundles.v2.json \
            publication/sample-bundles.tar.gz \
            publication/sample-bundles-attestation.v1.json \
            publication/sample-bundles-run-attestation.v1.json \
            staged/
          cp \
            build-a/pack-metadata.v1.json \
            source-a/.artifacts/sample-bundle-smoke/browser-smoke.v1.json \
            staged/
          test "$(find staged -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find staged -mindepth 1 -maxdepth 1 | wc -l)" -eq 6

      - name: Upload governed publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: content-addressed-sample-bundles
          path: staged
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attest-and-publish:
    name: Attest and publish immutable release
    needs: build-and-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download governed publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: content-addressed-sample-bundles
          path: staged

      - name: Validate all bytes before tokens
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          # The dependency digest of package-lock.json (see
          # scripts/lib/lockfile-pin.mjs), not a digest of the file's bytes:
          # a release version bump rewrites those and nothing in CI is able
          # to move this constant (#1357).
          EXPECTED_LOCKFILE_SHA256: d949436651e3541a7d757836e08e65d54d463197c463220b52dd9b476566af6e
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, stat, struct, zlib

          root = pathlib.Path("staged")
          expected_names = {
              "sample-bundles.v2.json",
              "sample-bundles.tar.gz",
              "sample-bundles-attestation.v1.json",
              "sample-bundles-run-attestation.v1.json",
              "browser-smoke.v1.json",
              "pack-metadata.v1.json",
          }
          entries = list(root.iterdir())
          assert {entry.name for entry in entries} == expected_names
          for entry in entries:
              metadata = entry.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not entry.is_symlink() and metadata.st_nlink == 1

          source = os.environ["SOURCE_COMMIT"]
          lock_sha = os.environ["EXPECTED_LOCKFILE_SHA256"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert re.fullmatch(r"[0-9a-f]{64}", lock_sha)
          action_map = {
              "checkout": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
              "setupNode": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
              "uploadArtifact": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
              "downloadArtifact": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
              "attestBuildProvenance": "actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8",
          }

          def read_bytes(name):
              return (root / name).read_bytes()

          def reject_duplicate_pairs(pairs):
              value = {}
              for key, entry in pairs:
                  assert key not in value, f"duplicate JSON key: {key!r}"
                  value[key] = entry
              return value

          def reject_constant(value):
              raise AssertionError(f"invalid JSON constant: {value}")

          def load(value):
              return json.loads(
                  value.decode("utf-8"),
                  object_pairs_hook=reject_duplicate_pairs,
                  parse_constant=reject_constant,
              )

          def keys(value, expected):
              assert type(value) is dict and set(value) == set(expected)

          def bounded_string(value, maximum=8192):
              assert type(value) is str and 0 < len(value) <= maximum and not any(ord(c) < 32 or ord(c) == 127 for c in value)

          def integer(value, minimum, maximum):
              assert type(value) is int and minimum <= value <= maximum

          manifest_bytes = read_bytes("sample-bundles.v2.json")
          archive_bytes = read_bytes("sample-bundles.tar.gz")
          deterministic_bytes = read_bytes("sample-bundles-attestation.v1.json")
          run_bytes = read_bytes("sample-bundles-run-attestation.v1.json")
          smoke_bytes = read_bytes("browser-smoke.v1.json")
          pack_bytes = read_bytes("pack-metadata.v1.json")
          manifest = load(manifest_bytes)
          deterministic = load(deterministic_bytes)
          run = load(run_bytes)
          smoke_raw = load(smoke_bytes)
          pack = load(pack_bytes)

          keys(manifest, ["format", "schemaVersion", "build", "samples", "excluded"])
          assert manifest["format"] == "honua.sdk.sample-bundles.v2" and manifest["schemaVersion"] == 2
          keys(manifest["build"], ["node", "lockfileSha256"])
          bounded_string(manifest["build"]["node"], 64)
          assert manifest["build"]["lockfileSha256"] == lock_sha
          assert type(manifest["samples"]) is list and 0 < len(manifest["samples"]) <= 100
          assert type(manifest["excluded"]) is list and len(manifest["excluded"]) <= 1000
          files = {}
          sample_ids = []
          runnable_ids = []
          for sample in manifest["samples"]:
              keys(sample, ["id", "entrypoint", "dataMode", "configDefaults", "runtimeHosting", "runnability", "hostFixtureRoutes", "support", "lifecycle", "builtFrom", "files"])
              sample_id = sample["id"]
              assert re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", sample_id)
              sample_ids.append(sample_id)
              assert sample["entrypoint"] == "index.html"
              expected_run = {"self-contained": "standalone", "same-origin-fixture-service": "requires-host-fixture-service", "external-live-endpoint": "requires-live-endpoint"}[sample["runtimeHosting"]]
              assert sample["runnability"] == expected_run
              if expected_run in ("standalone", "requires-live-endpoint"):
                  runnable_ids.append(sample_id)
              assert type(sample["configDefaults"]) is dict
              assert type(sample["hostFixtureRoutes"]) is list and all(type(route) is str and route.startswith("/") for route in sample["hostFixtureRoutes"])
              keys(sample["support"], ["tier", "track", "validationProfile"])
              assert all(type(value) is str and value for value in sample["support"].values())
              assert type(sample["lifecycle"]) is dict and {"state", "reason"} <= set(sample["lifecycle"]) <= {"state", "reason", "replacement", "targetRelease"}
              keys(sample["builtFrom"], ["commit", "packageVersion"])
              assert sample["builtFrom"]["commit"] == source
              assert type(sample["files"]) is list and 0 < len(sample["files"]) <= 10000
              previous = ""
              for record in sample["files"]:
                  keys(record, ["path", "bytes", "sha256", "integrity", "mediaType"])
                  relative = record["path"]
                  bounded_string(relative, 255)
                  assert "\\" not in relative and not relative.startswith("/") and all(part not in ("", ".", "..") for part in relative.split("/"))
                  assert relative.encode("utf-8") > previous.encode("utf-8")
                  previous = relative
                  integer(record["bytes"], 0, 1_000_000_000)
                  assert re.fullmatch(r"[0-9a-f]{64}", record["sha256"])
                  assert record["integrity"] == "sha256-" + __import__("base64").b64encode(bytes.fromhex(record["sha256"])).decode()
                  archive_path = f"{sample_id}/{relative}"
                  assert archive_path not in files
                  files[archive_path] = record
          assert sample_ids == sorted(set(sample_ids), key=lambda value: value.encode("utf-8"))
          for excluded in manifest["excluded"]:
              keys(excluded, ["id", "category", "reason"])
              assert excluded["id"] not in sample_ids

          def validate_coverage_journey(value):
              keys(value, ["ogc", "wcs", "requestProof", "beforeDispose", "disposal", "visibleEvidence"])
              for protocol, source_id in (("ogc", "ogc-elevation"), ("wcs", "wcs-elevation")):
                  proof = value[protocol]
                  keys(proof, ["mounted", "cancellation", "degradation"])
                  keys(proof["mounted"], ["protocol", "sourceId", "sourceMounted", "layerMounted"])
                  assert proof["mounted"] == {"protocol": protocol, "sourceId": source_id, "sourceMounted": True, "layerMounted": True}
                  keys(proof["cancellation"], ["status", "activeProtocol"])
                  assert proof["cancellation"] == {"status": "cancelled", "activeProtocol": protocol}
                  keys(proof["degradation"], ["status", "code", "activeProtocol"])
                  assert proof["degradation"] == {"status": "degraded", "code": "InvalidParameterValue", "activeProtocol": protocol}
              keys(value["requestProof"], ["allVirtualFixture", "ogcSuccess", "ogcCancellation", "ogcDegradation", "wcsSuccess", "wcsCancellation", "wcsDegradation"])
              assert all(item is True for item in value["requestProof"].values())
              before = value["beforeDispose"]
              keys(before, ["ready", "phase", "fixtureDigest", "ogcByteLength", "wcsByteLength", "imageWidth", "imageHeight", "centerPixelValue", "centerPixelColor", "cancellationCount", "degradationCount", "requestCount", "objectUrlsUnique", "switchedObjectUrlRevoked", "activeObjectUrl", "protocol", "sourceId", "sourceMounted", "layerMounted"])
              bounded_string(before["activeObjectUrl"], 2048)
              assert before["activeObjectUrl"].startswith("blob:")
              expected_before = {
                  "ready": True,
                  "phase": "degraded",
                  "fixtureDigest": "8c7b5b3f8bd31bca2df07c4a70254d75e70d63838c2f77e033def3c1b8d2acff",
                  "ogcByteLength": 281908,
                  "wcsByteLength": 281908,
                  "imageWidth": 320,
                  "imageHeight": 220,
                  "centerPixelValue": 450,
                  "centerPixelColor": [221, 174, 82],
                  "cancellationCount": 2,
                  "degradationCount": 2,
                  "requestCount": 12,
                  "objectUrlsUnique": True,
                  "switchedObjectUrlRevoked": True,
                  "protocol": "wcs",
                  "sourceId": "wcs-elevation",
                  "sourceMounted": True,
                  "layerMounted": True,
              }
              assert {key: value for key, value in before.items() if key != "activeObjectUrl"} == expected_before
              keys(value["disposal"], ["disposed", "ready", "sourceId", "activeObjectUrl", "sourceCleanupVerified", "mapRemoved", "canvasCount", "revokedBothObjectUrls", "revokedObjectUrlCount"])
              assert value["disposal"] == {"disposed": True, "ready": False, "sourceId": None, "activeObjectUrl": None, "sourceCleanupVerified": True, "mapRemoved": True, "canvasCount": 0, "revokedBothObjectUrls": True, "revokedObjectUrlCount": 2}
              visible = value["visibleEvidence"]
              keys(visible, ["canvasCount", "legend", "pixel"])
              bounded_string(visible["legend"], 4096)
              assert visible["canvasCount"] == 1 and "0 m" in visible["legend"] and "600 m" in visible["legend"] and visible["pixel"] == "450 m"

          def validate_raw_smoke(value, source_epoch):
              keys(value, ["format", "generatedAt", "manifest", "summary", "results"])
              assert value["format"] == "honua.sdk.sample-bundle-browser-smoke.v1"
              generated = datetime.datetime.fromtimestamp(source_epoch, datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")
              assert value["generatedAt"] == generated
              keys(value["manifest"], ["format", "schemaVersion", "commit"])
              assert value["manifest"] == {"format": manifest["format"], "schemaVersion": 2, "commit": source}
              keys(value["summary"], ["total", "passed", "failed"])
              assert value["summary"] == {"total": len(runnable_ids), "passed": len(runnable_ids), "failed": 0}
              assert type(value["results"]) is list and [result["id"] for result in value["results"]] == runnable_ids
              for result in value["results"]:
                  sample_id = result["id"]
                  keys(result, ["id", "title", "passed", "requestCount", "network", "staticJourney", "liveProbe", "failures", "screenshot"])
                  bounded_string(result["title"], 512)
                  assert result["passed"] is True
                  integer(result["requestCount"], 1, 10000)
                  keys(result["network"], ["offOriginRequestCount", "clientErrorResponseCount"])
                  assert result["network"] == {"offOriginRequestCount": 0, "clientErrorResponseCount": 0}
                  assert result["failures"] == [] and result["screenshot"] is None
                  if sample_id == "coverages-wcs-basic":
                      validate_coverage_journey(result["staticJourney"])
                  elif sample_id == "columnar-query-quickstart":
                      keys(result["staticJourney"], ["resultReady", "canvasCount", "sourceFeatureCount", "markerCount"])
                      assert result["staticJourney"]["resultReady"] is True
                      for key in ("canvasCount", "sourceFeatureCount", "markerCount"):
                          integer(result["staticJourney"][key], 1, 10000)
                  else:
                      assert result["staticJourney"] is None
                  if sample_id == "service-explorer":
                      keys(result["liveProbe"], ["passed", "origin", "status", "semantic", "featureCount"])
                      assert result["liveProbe"]["passed"] is True and result["liveProbe"]["origin"] == "https://demo.pygeoapi.io" and result["liveProbe"]["semantic"] == "geojson-feature-collection"
                      integer(result["liveProbe"]["status"], 200, 299)
                      integer(result["liveProbe"]["featureCount"], 1, 1000000)
                  else:
                      assert result["liveProbe"] is None

          keys(deterministic, ["schema", "source", "build", "publication", "smoke"])
          assert deterministic["schema"] == "honua.sdk.sample-bundle-attestation.v1"
          keys(deterministic["source"], ["repository", "commit", "ref", "sourceDateEpoch"])
          assert deterministic["source"] == {"repository": "honua-io/honua-sdk-js", "commit": source, "ref": "refs/heads/trunk", "sourceDateEpoch": deterministic["source"]["sourceDateEpoch"]}
          source_epoch = deterministic["source"]["sourceDateEpoch"]
          integer(source_epoch, 1, 4_102_444_800)
          validate_raw_smoke(smoke_raw, source_epoch)
          keys(deterministic["build"], ["node", "lockfileSha256", "workflow", "actions"])
          assert deterministic["build"] == {"node": "20.19.0", "lockfileSha256": lock_sha, "workflow": ".github/workflows/publish-content-addressed-sample-bundles.yml", "actions": action_map}
          keys(deterministic["publication"], ["tag", "fileCount", "memberCount", "assets"])
          assert deterministic["publication"]["tag"] == f"sample-bundles-{source}"
          keys(deterministic["publication"]["assets"], ["sample-bundles.v2.json", "sample-bundles.tar.gz"])
          expected_asset_bytes = {"sample-bundles.v2.json": manifest_bytes, "sample-bundles.tar.gz": archive_bytes}
          for name, value in deterministic["publication"]["assets"].items():
              keys(value, ["bytes", "sha256"])
              assert value == {"bytes": len(expected_asset_bytes[name]), "sha256": hashlib.sha256(expected_asset_bytes[name]).hexdigest()}

          smoke = deterministic["smoke"]
          keys(smoke, ["rawSha256", "total", "passed", "failed", "results"])
          assert re.fullmatch(r"[0-9a-f]{64}", smoke["rawSha256"])
          assert smoke["rawSha256"] == hashlib.sha256(smoke_bytes).hexdigest()
          assert smoke["total"] == smoke["passed"] == len(runnable_ids) and smoke["failed"] == 0
          assert type(smoke["results"]) is list and [result["id"] for result in smoke["results"]] == runnable_ids
          raw_results = {result["id"]: result for result in smoke_raw["results"]}
          for result in smoke["results"]:
              keys(result, ["id", "passed", "requestCount", "network", "staticJourney", "liveProbe"])
              assert result["passed"] is True
              integer(result["requestCount"], 1, 10000)
              assert result["requestCount"] == raw_results[result["id"]]["requestCount"]
              assert result["network"] == {"offOriginRequestCount": 0, "clientErrorResponseCount": 0}
              keys(result["staticJourney"], ["policy", "status"])
              assert result["staticJourney"]["policy"] in ("not-required", "coverage", "interaction")
              assert result["staticJourney"]["status"] in ("not-required", "passed")
              expected_static = "coverage" if result["id"] == "coverages-wcs-basic" else "interaction" if result["id"] == "columnar-query-quickstart" else "not-required"
              assert result["staticJourney"] == {"policy": expected_static, "status": "not-required" if expected_static == "not-required" else "passed"}
              live = result["liveProbe"]
              assert type(live) is dict and {"policy", "status"} <= set(live) <= {"policy", "status", "origin", "httpStatus", "featureCount"}
              if result["id"] == "service-explorer":
                  keys(live, ["policy", "status", "origin", "httpStatus", "featureCount"])
                  assert live["policy"] == "geojson-feature-collection" and live["status"] == "passed" and live["origin"] == "https://demo.pygeoapi.io"
                  integer(live["httpStatus"], 200, 299)
                  integer(live["featureCount"], 1, 1_000_000)
                  assert live["httpStatus"] == raw_results[result["id"]]["liveProbe"]["status"] and live["featureCount"] == raw_results[result["id"]]["liveProbe"]["featureCount"]
              else:
                  assert live == {"policy": "not-required", "status": "not-required"}

          keys(run, ["schema", "sourceCommit", "deterministicReceiptSha256", "workflow", "runner", "actions"])
          assert run["schema"] == "honua.sdk.sample-bundle-run-attestation.v1" and run["sourceCommit"] == source
          assert run["deterministicReceiptSha256"] == hashlib.sha256(deterministic_bytes).hexdigest()
          keys(run["workflow"], ["repository", "path", "ref", "sha", "runId", "runAttempt"])
          assert run["workflow"] == {"repository": os.environ["GITHUB_REPOSITORY"], "path": ".github/workflows/publish-content-addressed-sample-bundles.yml", "ref": "refs/heads/trunk", "sha": source, "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          keys(run["runner"], ["name", "environment", "os", "architecture", "image", "imageVersion"])
          assert all(type(value) is str and value for value in run["runner"].values())
          assert run["actions"] == action_map

          assert archive_bytes[:10] == bytes([0x1f, 0x8b, 0x08, 0, 0, 0, 0, 0, 0, 3])
          inflater = zlib.decompressobj(31)
          tar = inflater.decompress(archive_bytes) + inflater.flush()
          assert inflater.eof and inflater.unused_data == b"" and len(tar) % 512 == 0 and len(tar) >= 1024

          expected_files = {"sample-bundles.v2.json": {"bytes": len(manifest_bytes), "sha256": hashlib.sha256(manifest_bytes).hexdigest(), "content": manifest_bytes}, **files}
          directories = set()
          for name in expected_files:
              parts = name.split("/")
              directories.update("/".join(parts[:index]) + "/" for index in range(1, len(parts)))
          expected_members = sorted([(name, "5") for name in directories] + [(name, "0") for name in expected_files], key=lambda value: value[0].encode("utf-8"))

          def cstring(field):
              end = field.find(b"\0")
              if end < 0:
                  end = len(field)
              else:
                  assert field[end:] == b"\0" * (len(field) - end)
              value = field[:end].decode("utf-8")
              assert not any(ord(c) < 32 or ord(c) == 127 for c in value)
              return value

          def octal(field):
              assert field[-1] == 0 and re.fullmatch(rb"[0-7]+", field[:-1])
              return int(field[:-1], 8)

          def split_ustar_path(value):
              encoded = value.encode("utf-8")
              if len(encoded) <= 100:
                  return value, ""
              separators = [index for index, character in enumerate(value) if character == "/"]
              for index in reversed(separators):
                  prefix, name = value[:index], value[index + 1:]
                  if len(prefix.encode("utf-8")) <= 155 and len(name.encode("utf-8")) <= 100:
                      return name, prefix
              raise AssertionError(f"path cannot be represented as ustar: {value}")

          def put_string(header, offset, length, value):
              encoded = value.encode("utf-8")
              assert len(encoded) <= length
              header[offset:offset + len(encoded)] = encoded

          def put_octal(header, offset, length, value):
              assert type(value) is int and value >= 0
              encoded = format(value, "o").rjust(length - 1, "0").encode("ascii")
              assert len(encoded) == length - 1
              header[offset:offset + length - 1] = encoded
              header[offset + length - 1] = 0

          def canonical_header(member, kind, size):
              logical = member[:-1] if kind == "5" else member
              name, prefix = split_ustar_path(logical)
              header = bytearray(512)
              put_string(header, 0, 100, name)
              put_octal(header, 100, 8, 0o755 if kind == "5" else 0o644)
              put_octal(header, 108, 8, 0)
              put_octal(header, 116, 8, 0)
              put_octal(header, 124, 12, size)
              put_octal(header, 136, 12, source_epoch)
              header[148:156] = b" " * 8
              header[156] = ord(kind)
              put_string(header, 257, 6, "ustar")
              put_string(header, 263, 2, "00")
              put_octal(header, 329, 8, 0)
              put_octal(header, 337, 8, 0)
              put_string(header, 345, 155, prefix)
              checksum = format(sum(header), "o").rjust(6, "0").encode("ascii")
              assert len(checksum) == 6
              header[148:154] = checksum
              header[154:156] = b"\0 "
              return bytes(header)

          def canonical_gzip(payload):
              blocks = []
              if not payload:
                  blocks.append(bytes([1, 0, 0, 0xff, 0xff]))
              for offset in range(0, len(payload), 65535):
                  chunk = payload[offset:offset + 65535]
                  final = 1 if offset + len(chunk) == len(payload) else 0
                  blocks.append(bytes([final]) + struct.pack("<HH", len(chunk), 0xffff ^ len(chunk)) + chunk)
              return bytes([0x1f, 0x8b, 0x08, 0, 0, 0, 0, 0, 0, 3]) + b"".join(blocks) + struct.pack("<II", zlib.crc32(payload) & 0xffffffff, len(payload) & 0xffffffff)

          actual = []
          contents = {}
          seen = set()
          offset = 0
          while offset + 512 <= len(tar):
              header = tar[offset:offset + 512]
              if header == b"\0" * 512:
                  assert offset + 1024 == len(tar) and tar[offset:] == b"\0" * 1024
                  offset = len(tar)
                  break
              assert header[257:263] == b"ustar\0" and header[263:265] == b"00"
              checksum = bytearray(header)
              checksum[148:156] = b" " * 8
              assert header[154:156] == b"\0 " and int(header[148:154], 8) == sum(checksum)
              name = cstring(header[0:100])
              prefix = cstring(header[345:500])
              kind = chr(header[156])
              assert kind in ("0", "5")
              member = f"{prefix}/{name}" if prefix else name
              if kind == "5":
                  member += "/"
              assert member and member not in seen and "\\" not in member and not member.startswith("/") and all(part not in ("", ".", "..") for part in member.rstrip("/").split("/"))
              seen.add(member)
              mode, uid, gid = octal(header[100:108]), octal(header[108:116]), octal(header[116:124])
              size, mtime = octal(header[124:136]), octal(header[136:148])
              assert uid == gid == 0 and mtime == source_epoch
              assert cstring(header[157:257]) == cstring(header[265:297]) == cstring(header[297:329]) == ""
              assert octal(header[329:337]) == octal(header[337:345]) == 0
              assert (kind == "5" and mode == 0o755 and size == 0) or (kind == "0" and mode == 0o644)
              offset += 512
              content = tar[offset:offset + size]
              assert len(content) == size
              padding = (512 - size % 512) % 512
              assert tar[offset + size:offset + size + padding] == b"\0" * padding
              if kind == "0":
                  record = expected_files[member]
                  assert record["bytes"] == size and record["sha256"] == hashlib.sha256(content).hexdigest()
                  if "content" in record:
                      assert content == record["content"]
                  contents[member] = content
              actual.append((member, kind))
              offset += size + padding
          assert offset == len(tar) and actual == expected_members
          canonical_blocks = []
          for member, kind in expected_members:
              content = contents[member] if kind == "0" else b""
              canonical_blocks.append(canonical_header(member, kind, len(content)))
              if kind == "0":
                  canonical_blocks.append(content)
                  canonical_blocks.append(b"\0" * ((512 - len(content) % 512) % 512))
          canonical_blocks.append(b"\0" * 1024)
          canonical_tar = b"".join(canonical_blocks)
          assert tar == canonical_tar
          assert archive_bytes == canonical_gzip(canonical_tar)
          assert deterministic["publication"]["fileCount"] == len(expected_files)
          assert deterministic["publication"]["memberCount"] == len(expected_members)
          assert pack == {
              "schema": "honua.sdk.sample-bundle-pack.v1",
              "sourceCommit": source,
              "sourceDateEpoch": source_epoch,
              "manifestSha256": hashlib.sha256(manifest_bytes).hexdigest(),
              "archiveSha256": hashlib.sha256(archive_bytes).hexdigest(),
              "archiveBytes": len(archive_bytes),
              "fileCount": len(expected_files),
              "memberCount": len(expected_members),
          }
          print("privileged byte and provenance validation: PASS")
          PY

      - name: Gate current trunk and immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          readonly GH_VERSION="2.93.0"
          readonly GH_SHA256="02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0"
          rm -rf "$RUNNER_TEMP/trusted-gh" "$RUNNER_TEMP/gh.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/gh.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/trusted-gh"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/trusted-gh"
          readonly GH="$RUNNER_TEMP/trusted-gh/bin/gh"
          test "$GITHUB_REF" = "refs/heads/trunk"
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          CURRENT_SHA="$($GH api "repos/$GITHUB_REPOSITORY/commits/trunk" --jq .sha)"
          test "$CURRENT_SHA" = "$SOURCE_COMMIT"
          SOURCE_DATE="$($GH api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT" --jq .commit.committer.date)"
          SOURCE_EPOCH="$(date -u -d "$SOURCE_DATE" +%s)"
          test "$(jq -r .source.sourceDateEpoch staged/sample-bundles-attestation.v1.json)" = "$SOURCE_EPOCH"
          IMMUTABLE="$($GH api "repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$(jq -r .enabled <<<"$IMMUTABLE")" = "true"
          test "$(jq -r .enforced_by_owner <<<"$IMMUTABLE")" = "true"

      - name: Attest sample-bundles.v2.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/sample-bundles.v2.json

      - name: Attest sample-bundles.tar.gz
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/sample-bundles.tar.gz

      - name: Attest sample-bundles-attestation.v1.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/sample-bundles-attestation.v1.json

      - name: Attest sample-bundles-run-attestation.v1.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/sample-bundles-run-attestation.v1.json

      - name: Create or accept exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          readonly GH_VERSION="2.93.0"
          readonly GH_SHA256="02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          readonly GH="$RUNNER_TEMP/trusted-gh/bin/gh"
          readonly TAG="sample-bundles-$SOURCE_COMMIT"
          readonly RELEASE_ASSETS=(sample-bundles-attestation.v1.json sample-bundles.tar.gz sample-bundles.v2.json)
          if RELEASE_JSON="$($GH api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            test "$(jq -r .immutable <<<"$RELEASE_JSON")" = "true"
            test "$($GH api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = "commit"
            test "$($GH api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_COMMIT"
            mapfile -t ACTUAL_ASSETS < <(jq -r '.assets[].name' <<<"$RELEASE_JSON" | LC_ALL=C sort)
            test "${ACTUAL_ASSETS[*]}" = "${RELEASE_ASSETS[*]}"
            rm -rf existing-release
            mkdir existing-release
            "$GH" release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir existing-release
            for asset in "${RELEASE_ASSETS[@]}"; do
              cmp "staged/$asset" "existing-release/$asset"
            done
          else
            if "$GH" api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "immutable tag collision without an exact release" >&2
              exit 1
            fi
            test "$GITHUB_REF" = "refs/heads/trunk"
            test "$GITHUB_SHA" = "$SOURCE_COMMIT"
            CURRENT_SHA="$($GH api "repos/$GITHUB_REPOSITORY/commits/trunk" --jq .sha)"
            test "$CURRENT_SHA" = "$SOURCE_COMMIT"
            "$GH" release create "$TAG" \
              staged/sample-bundles-attestation.v1.json \
              staged/sample-bundles.tar.gz \
              staged/sample-bundles.v2.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "$TAG" \
              --notes "Immutable sample bundles for exact SDK source $SOURCE_COMMIT." \
              --latest=false
          fi
          test "$($GH api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = "true"

      - name: Redownload, compare, and verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          readonly GH_SHA256="02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          readonly GH="$RUNNER_TEMP/trusted-gh/bin/gh"
          readonly TAG="sample-bundles-$SOURCE_COMMIT"
          test "$($GH api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = "true"
          rm -rf verified-release
          mkdir verified-release
          "$GH" release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified-release
          for asset in sample-bundles-attestation.v1.json sample-bundles.tar.gz sample-bundles.v2.json; do
            cmp "staged/$asset" "verified-release/$asset"
            "$GH" attestation verify "verified-release/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-content-addressed-sample-bundles.yml" \
              --source-ref refs/heads/trunk \
              --source-digest "$SOURCE_COMMIT" \
              --signer-digest "$SOURCE_COMMIT" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          done
          "$GH" attestation verify staged/sample-bundles-run-attestation.v1.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-content-addressed-sample-bundles.yml" \
            --source-ref refs/heads/trunk \
            --source-digest "$SOURCE_COMMIT" \
            --signer-digest "$SOURCE_COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners

name: SDK CI

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    branches:
      - trunk
      - "release/**"

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  pr-fast:
    name: PR Fast (under 2 minutes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # The measured budget includes runtime setup and dependency installation,
      # but excludes GitHub queue/VM provisioning and checkout action overhead.
      - name: Start validation budget clock
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(awk '{ printf "%.0f", $1 * 1000 }' /proc/uptime)
          if [[ ! "$started_at" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not capture a positive monotonic start timestamp"
            exit 1
          fi
          echo "PR_FAST_STARTED_AT_MONOTONIC_MS=$started_at" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run representative validation tier
        shell: bash
        run: |
          set -euo pipefail
          : "${PR_FAST_STARTED_AT_MONOTONIC_MS:?validation budget clock was not initialized}"
          npm run validate:pr-fast -- \
            --started-at-monotonic-ms "$PR_FAST_STARTED_AT_MONOTONIC_MS" \
            --output test-results/pr-fast.json

      - name: Upload PR-fast timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-fast-timing
          path: test-results/pr-fast.json
          if-no-files-found: warn

  benchmark-lab:
    name: Deterministic Benchmark Lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run offline benchmark corpus
        run: npm run bench:lab

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-benchmark-lab
          path: test-results/benchmark-lab.json
          if-no-files-found: error

  js-sdk:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify north-star API design fixtures
        run: npm run verify:north-star-api

      - name: Verify sample publication contract
        run: npm run samples:verify

      - name: Code style
        run: npm run check

      - name: Verify llms.txt freshness
        run: npm run verify:llms

      - name: Verify agent skills
        run: npm run verify:skills

      - name: Build
        run: npm run build

      - name: Compile learning-path examples
        run: npm run docs:learning:typecheck

      - name: Verify public API report (stable tier)
        run: node scripts/report-api-surface.mjs --check

      - name: Build and verify browser bundle
        run: npm run verify:browser

      - name: Verify public-surface inventory and imports
        run: npm run verify:public-surface

      - name: Verify browser artifact publication manifest
        run: node scripts/sample-contract.mjs artifacts

      - name: Verify task-oriented learning paths
        run: npm run docs:learning:check

      - name: Validate documentation snippets
        run: npm run docs:snippets:check

      - name: Bundle-size budgets
        run: npm run verify:bundle-budgets

      - name: Split package verification
        run: npm run verify:split-packages

      - name: Publish-surface integrity
        # split-package build cleans dist/, so restore the browser bundle first
        # (same ordering the publish workflow uses).
        run: |
          npm run build:browser --silent
          node scripts/sample-contract.mjs artifacts
          npm run verify:publish-surface

      - name: Installed packed-SDK smoke
        run: npm run verify:packed-sdk

      - name: Example typechecks
        run: npm run demo:examples:typecheck

      - name: Primitive demo matrix
        run: npm run demo:primitive-matrix

      - name: Kepler example audit
        run: npm audit --prefix examples/kepler-analytics

      - name: Example builds
        run: npm run demo:examples:build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Migration e2e harness
        run: npx vitest run test/migration-e2e.test.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke suite
        run: npm run test:playwright

  mcp-sdk:
    name: MCP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: MCP certification (gate)
        # Offline mode: certifies an in-process streamable-HTTP mock of the honua
        # /mcp operator catalog — no live server needed, gates every PR. The live
        # lane is workflow_dispatch only (see mcp-cert-live.yml).
        env:
          HONUA_MCP_CERT_TARGET: offline
        run: npm run test:certification

      - name: MCP certification artifact
        if: always()
        env:
          HONUA_MCP_CERT_TARGET: offline
        run: npm run test:certification:artifact

      - name: MCP platform-free certification (gate)
        # Standalone target: certifies the direct-SDK surface against an in-process
        # fixture of a PLAIN public FeatureServer (recorded census layer, no Honua
        # surfaces). Proves the tools certify green with honest skips against a
        # non-Honua endpoint. Fixture-backed, deterministic, no network.
        run: node dist/src/certification/cli.js --target standalone --out-dir standalone-cert

      - name: Cross-model workflow eval (gate, offline)
        run: npm run test:eval

      - name: Platform-free semantic eval (gate, offline)
        # 50+ semantic scenarios against the plain-FeatureServer census fixture;
        # asserts the deterministic control passes every one (offline, no models).
        run: npm run eval:standalone

      - name: Cross-model workflow eval artifact
        if: always()
        run: npm run test:eval:artifact

      - name: Upload MCP provability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-provability-artifacts
          path: |
            mcp/mcp-certification-results.json
            mcp/mcp-certification-results.md
            mcp/standalone-cert/mcp-certification-results.json
            mcp/standalone-cert/mcp-certification-results.md
            mcp/mcp-eval-results.json
            mcp/mcp-eval-results.md
          if-no-files-found: warn

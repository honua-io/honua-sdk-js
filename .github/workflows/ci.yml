name: SDK CI

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    branches:
      - trunk
      - "release/**"

env:
  NODE_VERSION: "20.19.0"

jobs:
  js-sdk:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Split package verification
        run: npm run verify:split-packages

      - name: Quickstart example typecheck
        run: npm run demo:quickstart:typecheck

      - name: Quickstart example build
        run: npm run demo:quickstart:build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Quickstart browser smoke
        run: npm run test:playwright:quickstart

  mcp-sdk:
    name: MCP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

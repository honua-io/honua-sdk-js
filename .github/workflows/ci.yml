name: SDK CI
run-name: >-
  ${{ inputs.release_head_sha && format('SDK CI | trusted release #{0} @ {1}', inputs.release_pull_request_number, inputs.release_head_sha) || 'SDK CI' }}

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    branches:
      - trunk
      - "release/**"
  workflow_dispatch:
    inputs:
      # Set only by regenerate-derived-artifacts.yml for its own artifacts PR
      # (honua-io/honua-sdk-js#766): that PR can be the one publishing a failing
      # or lapsed First Map release-matrix receipt, and the publication path
      # cannot be gated on the outcome it publishes. Trunk pushes, feature PRs,
      # and every manual dispatch leave this false, so the release-matrix gate
      # stays enforced. See scripts/lib/release-matrix-receipt.mjs.
      release_matrix_receipt_relax:
        description: >-
          Report, but do not enforce, a failing or expired release-matrix
          browser receipt. Reserved for the evidence-publication automation.
        required: false
        default: false
        type: boolean
      release_pull_request_number:
        description: >-
          Exact Release Please pull request validated by trusted trunk policy.
          Reserved for release-please.yml.
        required: false
        default: ""
        type: string
      release_head_sha:
        description: >-
          Exact Release Please head validated by trusted trunk policy. Reserved
          for release-please.yml.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  pr-fast:
    name: PR Fast (under 2 minutes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HONUA_DERIVED_ARTIFACTS_RELAX: ${{ github.base_ref == 'trunk' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The measured budget includes runtime setup and dependency installation,
      # but excludes GitHub queue/VM provisioning and checkout action overhead.
      - name: Start validation budget clock
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(awk '{ printf "%.0f", $1 * 1000 }' /proc/uptime)
          if [[ ! "$started_at" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not capture a positive monotonic start timestamp"
            exit 1
          fi
          echo "PR_FAST_STARTED_AT_MONOTONIC_MS=$started_at" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test pull request issue-disposition policy
        run: node --test test/scripts/pr-issue-disposition.test.mjs

      - name: Test Release Please CI dispatch policy
        run: node --test test/scripts/release-please-ci-dispatch.test.mjs

      - name: Test Release Please tag-seal policy
        run: node --test test/scripts/release-please-tag-seal.test.mjs

      - name: Test Release Please CI check publication policy
        run: node --test test/scripts/release-please-ci-checks.test.mjs

      - name: Test sample-bundle lockfile digest pin policy
        run: node --test test/scripts/lockfile-pin.test.mjs

      - name: Test backlog dependency reconciliation policy
        run: node --test test/scripts/backlog-dependencies.test.mjs

      - name: Test derived-artifact loop guard policy
        run: node --test test/scripts/derived-artifact-loop-guard.test.mjs

      - name: Test stranded-merge detection policy
        run: node --test test/scripts/stranded-merge-detector.test.mjs

      - name: Test scheduled/live health policy
        run: npm run test:scheduled-live-health

      - name: Test protocol certification policy
        run: node --test test/protocol-certification-fragment.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run representative validation tier
        shell: bash
        run: |
          set -euo pipefail
          : "${PR_FAST_STARTED_AT_MONOTONIC_MS:?validation budget clock was not initialized}"
          npm run validate:pr-fast -- \
            --started-at-monotonic-ms "$PR_FAST_STARTED_AT_MONOTONIC_MS" \
            --output test-results/pr-fast.json

      - name: Upload PR-fast timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-fast-timing
          path: test-results/pr-fast.json
          if-no-files-found: warn

  benchmark-lab:
    name: Deterministic Benchmark Lab
    runs-on: ubuntu-latest
    # Derived-artifact decoupling (#677): the cross-SDK corpus' Honua
    # source-tree pin is regenerated on trunk by the
    # regenerate-derived-artifacts workflow, so ci.yml tolerates a lagging pin
    # only on trunk PRs and the initial trunk push (every other corpus binding
    # stays enforced). Release branches and post-regeneration dispatches remain
    # strict; the trunk workflow is the authority that re-binds the pin.
    env:
      HONUA_DERIVED_ARTIFACTS_RELAX: ${{ (github.event_name == 'pull_request' && github.base_ref == 'trunk' || github.event_name == 'push' && github.ref == 'refs/heads/trunk' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-please--branches--trunk' && inputs.release_head_sha == github.sha) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run offline benchmark corpus
        run: npm run bench:lab

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-benchmark-lab
          path: test-results/benchmark-lab.json
          if-no-files-found: error

  js-sdk:
    name: JS SDK
    runs-on: ubuntu-latest
    env:
      HONUA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # Derived-artifact decoupling (#677): every gate that binds committed
      # generated artifacts to the working tree (sample-publication contract,
      # llms/comparison/api freshness, migration-workbench artifacts) runs in
      # relaxed mode only for trunk PRs and the initial trunk push. Release
      # branches stay strict. Feature PRs no longer reseal/regenerate; the
      # regenerate-derived-artifacts workflow re-establishes the binding and
      # dispatches this workflow in strict mode on trunk post-merge. Functional gates (typecheck/build/test, kit
      # qualification from source and packed SDK, verify:bundle-budgets) are
      # unaffected and still fail a PR that genuinely breaks a sample.
      HONUA_DERIVED_ARTIFACTS_RELAX: ${{ (github.event_name == 'pull_request' && github.base_ref == 'trunk' || github.event_name == 'push' && github.ref == 'refs/heads/trunk' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-please--branches--trunk' && inputs.release_head_sha == github.sha) && '1' || '' }}
      # Release-matrix receipt gate (#766): enforced unless the evidence
      # publication automation asked for report-only mode.
      HONUA_RELEASE_MATRIX_RECEIPT_RELAX: ${{ inputs.release_matrix_receipt_relax && '1' || '' }}
    steps:
      - name: Validate trusted Release Please dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/release-please--branches--trunk' || inputs.release_pull_request_number != '' || inputs.release_head_sha != '') }}
        working-directory: .
        shell: bash
        env:
          RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number }}
          RELEASE_HEAD_SHA: ${{ inputs.release_head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Trusted release dispatch requires a positive pull-request number."
            exit 1
          fi
          if [[ ! "${RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Trusted release dispatch requires a full lowercase head SHA."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/release-please--branches--trunk" ]]; then
            echo "::error::Trusted release dispatch must target the canonical Release Please branch."
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${RELEASE_HEAD_SHA}" ]]; then
            echo "::error::Dispatched release head ${RELEASE_HEAD_SHA} is stale; current workflow head is ${GITHUB_SHA}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test pull request issue-disposition policy
        run: node --test test/scripts/pr-issue-disposition.test.mjs

      - name: Test Release Please CI dispatch policy
        run: node --test test/scripts/release-please-ci-dispatch.test.mjs

      - name: Test Release Please tag-seal policy
        run: node --test test/scripts/release-please-tag-seal.test.mjs

      - name: Test Release Please CI check publication policy
        run: node --test test/scripts/release-please-ci-checks.test.mjs

      - name: Test sample-bundle lockfile digest pin policy
        run: node --test test/scripts/lockfile-pin.test.mjs

      - name: Test backlog dependency reconciliation policy
        run: node --test test/scripts/backlog-dependencies.test.mjs

      - name: Test derived-artifact loop guard policy
        run: node --test test/scripts/derived-artifact-loop-guard.test.mjs

      - name: Test stranded-merge detection policy
        run: node --test test/scripts/stranded-merge-detector.test.mjs

      - name: Test scheduled/live health policy
        run: npm run test:scheduled-live-health

      # The enforceable five-minute clock includes npm ci, browser
      # provisioning, the fixture build, and the first usable map.
      - name: Start quickstart budget clock
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(awk '{ printf "%.0f", $1 * 1000 }' /proc/uptime)
          if [[ ! "$started_at" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not capture a positive monotonic start timestamp"
            exit 1
          fi
          echo "QUICKSTART_STARTED_AT_MONOTONIC_MS=$started_at" >> "$GITHUB_ENV"
          node scripts/quickstart-time-to-map.mjs --initialize \
            --started-at-monotonic-ms "$started_at" \
            --output test-results/quickstart-time-to-map.json

      - name: Install dependencies
        id: quickstart_install
        shell: bash
        run: |
          now=$(awk '{ printf "%.0f", $1 * 1000 }' /proc/uptime)
          remaining_ms=$((QUICKSTART_STARTED_AT_MONOTONIC_MS + 300000 - now))
          (( remaining_ms > 0 ))
          timeout --foreground "$(((remaining_ms + 999) / 1000))s" npm ci

      - name: Install Playwright browser
        id: quickstart_browser
        shell: bash
        run: |
          now=$(awk '{ printf "%.0f", $1 * 1000 }' /proc/uptime)
          remaining_ms=$((QUICKSTART_STARTED_AT_MONOTONIC_MS + 300000 - now))
          (( remaining_ms > 0 ))
          timeout --foreground "$(((remaining_ms + 999) / 1000))s" npx playwright install --with-deps chromium

      - name: Gate clean-install time to first fixture map
        id: quickstart_map
        run: |
          npm run docs:quickstart:time-to-map -- \
            --started-at-monotonic-ms "$QUICKSTART_STARTED_AT_MONOTONIC_MS" \
            --output test-results/quickstart-time-to-map.json

      - name: Finalize quickstart failure evidence
        if: always() && steps.quickstart_map.outcome != 'success'
        shell: bash
        run: |
          stage=first-map
          if [[ "${{ steps.quickstart_install.outcome }}" != "success" ]]; then
            stage=clean-install
          elif [[ "${{ steps.quickstart_browser.outcome }}" != "success" ]]; then
            stage=browser-provisioning
          fi
          node scripts/quickstart-time-to-map.mjs \
            --finalize-failure "$stage" \
            --started-at-monotonic-ms "$QUICKSTART_STARTED_AT_MONOTONIC_MS" \
            --output test-results/quickstart-time-to-map.json

      - name: Upload quickstart timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quickstart-time-to-map
          path: test-results/quickstart-time-to-map.json
          if-no-files-found: error

      - name: Validate quickstart timing runner
        run: npm run docs:quickstart:time-to-map:test

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated admin REST client freshness
        run: npm run admin-client:check

      - name: Verify north-star API design fixtures
        run: npm run verify:north-star-api

      - name: Verify contract v2 design fixtures
        run: npm run verify:contract-v2-design

      - name: Verify pinned PROJJSON validator
        run: npm run verify:projjson-validator

      - name: Verify generated MapPackage schema validator
        run: npm run verify:map-package-schema

      # Reported here, enforced at the end of the job (honua-io/honua-sdk-js#1266
      # REQ-003). This gate sits ~25 steps ahead of the correctness suite, so a
      # failure here used to mean no pull request in the repo ran a single test --
      # including when the cause was a wall-clock evidence lapse that no branch
      # caused. The gate stays blocking: `Enforce sample publication contract`
      # below fails the job on this step's outcome, but only after the tests have
      # run and reported. Read the diagnosis at this step; read the verdict there.
      - name: Verify sample publication contract
        id: sample_contract
        continue-on-error: true
        run: |
          npm run samples:verify
          npm run samples:verify:flagships
          npm run samples:fixtures:verify
          npm run docs:site:gallery:test

      - name: Validate sample runner boundaries and generated selection
        run: |
          npm run samples:runner:test
          npm run samples:run -- list --kit --json

      # Unit tests for the release-tag sealing gate (#768). Only the tests run
      # here; `release:seal:check` itself is a release-time gate (publish-js-sdk,
      # first-map-release-smoke) and would legitimately fail on any branch that
      # changed source without a reseal.
      - name: Validate release-seal policy
        run: npm run release:seal:test

      # Release artifact manifest drift gate (#1337). Unlike release:seal:check
      # this is safe on every branch: it compares config/release-artifacts.v1.json
      # against the split-package generator, the publish workflows, and every
      # tracked package.json, so a package that would silently enter or leave
      # the coordinated cut fails here rather than at release time. The
      # published-release verifier's own unit tests run alongside it; that
      # verifier itself is a post-publish gate and lives in publish-js-sdk.yml.
      - name: Validate release artifact manifest
        run: |
          npm run verify:release-artifacts
          node --test test/scripts/verify-published-release.test.mjs

      # 2026.1 certification denominator freeze (#39, AC1). Regenerates the
      # denominator from config/support-manifest.v1.json,
      # config/protocol-certification.v1.json, the coverage crosswalk, the Admin
      # MCP projection and the terminal journey, and fails when the frozen
      # config/certification-denominator.v1.json no longer matches -- a
      # `supported` row that never joined it would otherwise sit outside the
      # certification run while the run still reported a full pass. Reads
      # config/ and mcp/ only, so it neither consumes nor invalidates a build.
      - name: Validate certification denominator freeze
        run: npm run verify:certification-denominator

      - name: Code style
        run: npm run check

      - name: Verify llms.txt freshness
        run: npm run verify:llms

      - name: Verify comparison page freshness
        run: npm run docs:comparison:check

      - name: Verify MCP eval scorecard freshness
        run: npm run docs:mcp-scorecard:check

      # Offline and deterministic on purpose: it re-renders the page from the
      # committed observations. It never queries npm, so a pull request cannot
      # fail because the search service was down or a rank moved overnight
      # (#499). Re-observation is the manual `docs:npm-search:observe` lane.
      - name: Verify npm search discoverability page freshness
        run: npm run docs:npm-search:check

      - name: Verify documentation version manifest
        run: npm run docs:versions:check

      - name: Verify agent skills
        run: npm run verify:skills

      - name: Build
        run: npm run build

      - name: Qualify shared-kit pilots from source and packed SDK
        run: |
          npm run samples:run -- verify --kit --sdk-mode source
          npm run samples:run -- verify --kit --sdk-mode packed

      - name: Compile learning-path examples
        run: npm run docs:learning:typecheck

      - name: Verify public API report (stable tier)
        run: node scripts/report-api-surface.mjs --check

      - name: Verify final root surface and migration matrix
        run: npm run verify:root-surface:prepared

      - name: Build and verify browser bundle
        run: npm run verify:browser:prepared

      - name: Verify public-surface inventory and imports
        run: npm run verify:public-surface

      - name: Verify generated support truth
        run: npm run support:check

      - name: Verify sdk-coverage capability snapshot
        run: npm run sdk-coverage:check

      - name: Verify browser artifact publication manifest
        run: |
          node scripts/sample-contract.mjs artifacts
          npm run prepare:test-sdk:adopt --silent

      - name: Verify task-oriented learning paths
        run: npm run docs:learning:check

      - name: Validate documentation snippets
        run: npm run docs:snippets:check

      - name: Component qualification matrix
        # Runs against the already-built dist/, so it does not rebuild. Fails on
        # an unrecorded catalog component, a `passing` gate whose evidence file
        # no longer exists, a missing justification, a support-tier claim that
        # disagrees with the evidence, or manifest/doc drift (issue #683).
        run: node scripts/component-qualification.mjs check

      - name: App-platform reference qualification
        # Keeps the packed-workbench evidence projection and its explicitly
        # open reference gates honest alongside the component matrix.
        run: npm run qualification:app-platform:check

      - name: Bundle-size budgets
        run: npm run verify:bundle-budgets

      - name: Split package verification
        run: npm run verify:split-packages:prepared

      - name: Root package discoverability
        run: npm run verify:discoverability

      - name: Publish-surface integrity
        # split-package build cleans dist/, so restore the browser bundle first
        # (same ordering the publish workflow uses).
        run: |
          npm run build:browser --silent
          node scripts/sample-contract.mjs artifacts
          npm run prepare:test-sdk:adopt --silent
          npm run verify:publish-surface

      - name: Installed packed-SDK smoke
        run: npm run verify:packed-sdk

      - name: Example typechecks
        run: npm run demo:examples:typecheck

      - name: create-honua-app scaffold and playground links
        # The published starters carry the same discipline as a documentation
        # snippet (#958): the manifest, the pinned versions, and the committed
        # fixture are verified, both templates compile against SDK source, and
        # the generated playground page must match the manifest.
        run: |
          npm run create-app:verify
          npm run create-app:test
          npm run create-app:templates:typecheck
          npm run playgrounds:check

      - name: create-honua-app packed artifact
        # The source tree is not what a user installs: this packs the scaffold,
        # installs the tarball into a throwaway consumer, and scaffolds from it,
        # so a `files` omission cannot ship a starter without its templates.
        run: npm run create-app:verify:package

      - name: Gallery sample playgrounds
        # Generated standalone projects for every qualifying gallery sample
        # (#958): drift against the committed sample source fails here, and both
        # copies must still compile against the SDK source.
        run: |
          npm run samples:playgrounds:check
          npm run samples:playgrounds:test
          npm run samples:playgrounds:typecheck

      - name: Acquire pinned Overture extension and prove offline build
        run: |
          npm run demo:overture:prepare
          npm run demo:overture:build:offline

      - name: Primitive demo matrix
        run: npm run demo:primitive-matrix

      - name: Kepler example audit
        run: node --test examples/kepler-analytics/test/audit.test.mjs && node examples/kepler-analytics/scripts/audit.mjs

      - name: Example builds
        run: npm run demo:examples:build:prepared

      - name: Build sample bundles
        # Reproducible static browser bundles for the samples gallery to
        # embed (#642, completing #401 REQ-003's publication leg). See
        # docs/sample-bundles.md.
        run: npm run samples:bundles:build

      - name: Verify sample bundle manifest
        run: npm run samples:bundles:verify

      - name: Upload sample bundles workflow artifact
        # Versioned artifact for every push. Durable publication is the
        # content-addressed immutable release produced by
        # publish-content-addressed-sample-bundles.yml, one per source commit.
        if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sample-bundles
          path: .artifacts/sample-bundles/
          if-no-files-found: error

      - name: Unit tests with coverage
        run: npm run test:coverage:prepared

      # Re-runs the sample publication contract suite against a forward-shifted
      # validation clock (+35d clears the 31-day executed window, +95d clears
      # the 90-day non-executed one) so a fixture whose validity silently
      # depends on the wall-clock date fails here, weeks before it wedges trunk
      # for an unrelated pull request (#1079). One suite twice more; committed
      # evidence merely due for renewal inside the window is #979's lane and
      # does not fail this step.
      - name: Sample contract look-ahead clock lane
        run: npm run samples:contract:lookahead

      - name: Migration e2e harness
        run: npx vitest run test/migration-e2e.test.ts

      - name: MapLibre peer-major matrix (5.x + 6.x)
        # The optional `maplibre-gl` peer range is `^5.0.0 || ^6.0.0` (#1004).
        # This is the attributable leg for that claim: typecheck against the 5.x
        # typings, run the peer-facing specs against the real module on both
        # majors (the 6.x devDependency and the `maplibre-gl-v5` alias), then
        # render the same Honua-generated style in a browser under each major.
        # Everything else in this job resolves 6.x, so a 6-only break still
        # fails the ordinary gates; this step is what keeps 5.x honest.
        run: npm run test:maplibre-compat:prepared

      # The offline region reference's application shell manifest is
      # hand-maintained and pins an exact byte length plus SHA-256 digest per
      # resource. Its service worker refuses to commit a shell generation when
      # one pin disagrees with the bytes it fetched, so a stale pin fails every
      # offline browser test at once with a signature that names nothing near
      # the cause (a 13-code addition to src/core/error-classifications.ts took
      # 16 tests red in #1280). This step recomputes the pins against the built
      # dist/ and names the drifted resource before the suite runs. Refresh
      # with `npm run offline:shell-manifest:generate`.
      - name: Verify offline shell manifest pins
        run: npm run offline:shell-manifest:check

      - name: Browser smoke suite
        run: npm run test:playwright:prepared

      - name: Deterministic browser rendering benchmark
        id: browser_benchmark
        run: npm run bench:browser

      - name: Upload browser benchmark evidence
        if: always() && steps.browser_benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-browser-benchmark
          path: test-results/browser-benchmark/
          if-no-files-found: error

      - name: Publish sdk-coverage.v1.json artifact
        # Versioned per-capability coverage snapshot for the capability matrix
        # (honua-io/honua-sdk-js#618); published on trunk builds only so
        # honua-evidence always ingests a merged, gate-passed snapshot.
        if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-coverage-v1
          path: config/sdk-coverage.v1.json
          if-no-files-found: error

      # The verdict half of the deferred sample-publication gate above
      # (honua-io/honua-sdk-js#1266 REQ-003). It is deliberately last: the gate
      # is still blocking, but it can no longer cost this job its test signal.
      - name: Enforce sample publication contract
        if: always() && steps.sample_contract.outcome == 'failure'
        run: |
          echo "::error title=Sample publication contract::The sample publication contract failed. Read the failure in the 'Verify sample publication contract' step above; the correctness suite in this job ran to completion regardless. A golden-visual freshness lapse is renewed with 'npm run samples:generate' or 'gh workflow run regenerate-derived-artifacts.yml --repo honua-io/honua-sdk-js'."
          exit 1

  mcp-sdk:
    name: MCP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Validate trusted Release Please dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/release-please--branches--trunk' || inputs.release_pull_request_number != '' || inputs.release_head_sha != '') }}
        working-directory: .
        shell: bash
        env:
          RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number }}
          RELEASE_HEAD_SHA: ${{ inputs.release_head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Trusted release dispatch requires a positive pull-request number."
            exit 1
          fi
          if [[ ! "${RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Trusted release dispatch requires a full lowercase head SHA."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/release-please--branches--trunk" ]]; then
            echo "::error::Trusted release dispatch must target the canonical Release Please branch."
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${RELEASE_HEAD_SHA}" ]]; then
            echo "::error::Dispatched release head ${RELEASE_HEAD_SHA} is stale; current workflow head is ${GITHUB_SHA}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: NL map-control security certification (gate)
        run: npm run test:certification:nl-map-control

      - name: MCP certification (gate)
        # Offline mode: certifies an in-process streamable-HTTP mock of the honua
        # /mcp operator catalog — no live server needed, gates every PR. The live
        # lane is workflow_dispatch only (see mcp-cert-live.yml).
        env:
          HONUA_MCP_CERT_TARGET: offline
        run: npm run test:certification

      - name: Admin MCP proxy parity contract (432-tool default roster)
        working-directory: mcp
        run: npm run test:certification:admin

      - name: MCP certification artifact
        if: always()
        env:
          HONUA_MCP_CERT_TARGET: offline
        run: npm run test:certification:artifact

      - name: MCP platform-free certification (gate)
        # Standalone target: certifies the direct-SDK surface against an in-process
        # fixture of a PLAIN public FeatureServer (recorded census layer, no Honua
        # surfaces). Proves the tools certify green with honest skips against a
        # non-Honua endpoint. Fixture-backed, deterministic, no network.
        run: node dist/src/certification/cli.js --target standalone --out-dir standalone-cert

      - name: MCP non-GeoServices certification (gate)
        # standalone-ogc target (#1005): the SAME tool catalog against an
        # in-process fixture of a plain OGC API Features endpoint (recorded
        # pygeoapi collections). Nothing Esri exists there, so a tool that still
        # required serviceId/layerId fails here instead of passing by accident.
        run: node dist/src/certification/cli.js --target standalone-ogc --out-dir standalone-ogc-cert

      - name: Cross-model workflow eval (gate, offline)
        run: npm run test:eval

      - name: Platform-free semantic eval (gate, offline)
        # 50+ semantic scenarios against the plain-FeatureServer census fixture;
        # asserts the deterministic control passes every one (offline, no models).
        run: npm run eval:standalone

      - name: Non-GeoServices semantic eval (gate, offline)
        # The same catalog over the OGC API Features fixture, addressed
        # protocol-neutrally end to end (#1005).
        run: npm run eval:ogc

      - name: Cross-model workflow eval artifact
        if: always()
        run: npm run test:eval:artifact

      - name: Upload MCP provability artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-provability-artifacts
          path: |
            mcp/mcp-certification-results.json
            mcp/mcp-certification-results.md
            mcp/standalone-cert/mcp-certification-results.json
            mcp/standalone-cert/mcp-certification-results.md
            mcp/standalone-ogc-cert/mcp-certification-results.json
            mcp/standalone-ogc-cert/mcp-certification-results.md
            mcp/mcp-eval-results.json
            mcp/mcp-eval-results.md
          if-no-files-found: warn

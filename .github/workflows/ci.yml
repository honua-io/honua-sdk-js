name: SDK CI

on:
  push:
    branches:
      - trunk
      - "release/**"
  pull_request:
    branches:
      - trunk
      - "release/**"

env:
  NODE_VERSION: "20.19.0"

jobs:
  js-sdk:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Split package verification
        run: npm run verify:split-packages

      - name: Example typechecks
        run: npm run demo:examples:typecheck

      - name: Primitive demo matrix
        run: npm run demo:primitive-matrix

      - name: Kepler example audit
        run: npm audit --prefix examples/kepler-analytics

      - name: Example builds
        run: npm run demo:examples:build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Migration e2e harness
        run: npx vitest run test/migration-e2e.test.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke suite
        run: npm run test:playwright

  mcp-sdk:
    name: MCP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Build JS SDK dependency
        run: |
          npm ci --prefix ..
          npm run build --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Code style
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

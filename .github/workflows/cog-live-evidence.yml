name: Direct COG Live Evidence

# This is an independent semantic probe of one immutable public STAC item and
# COG asset. It never runs on push or pull_request; ordinary CI is fixture-only.
on:
  schedule:
    - cron: "20 7 * * 2" # Tuesdays 07:20 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"
  HONUA_COG_LIVE_ENABLED: "true"

jobs:
  public-stac-cog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Run pinned STAC to bounded COG evidence
        run: npm run evidence:cog:live
      - name: Publish semantic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: direct-cog-live-evidence
          path: test-results/cog-live-evidence.json
          if-no-files-found: warn
          retention-days: 30

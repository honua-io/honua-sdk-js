<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hazards Editor | Honua</title></head><body>
<header><h1>Hazards Editor</h1><span>Local onboarding workspace</span></header>
<main><section aria-label="Hazard map"><div id="map"></div></section><aside>
<p id="status" role="status">Connecting to imported layers...</p><p id="error" role="alert" hidden></p>
<label>Layer <select id="layer" disabled></select></label>
<label>Find a feature <input id="search" type="search" disabled></label>
<button id="reload" disabled>Reload saved features</button>
<p id="count"></p><div id="features" aria-label="Features"></div>
<h2 id="selected">Select a feature or create a new one</h2>
<div id="editor"></div><section aria-label="Saved attachments"><h3>Saved attachments</h3><ul id="attachments"></ul></section>
</aside></main><script type="module" src="/src/main.ts"></script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honua Web Components</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <honua-map id="ops-map" label="Response map"></honua-map>
        <div class="side-panel">
          <honua-search id="incident-search" for="ops-map" source="incidents" placeholder="Find incidents"></honua-search>
          <!-- Survival-tier geocoding search (issue #493): a geocoding provider
               (any HonuaGeocodingClient-shaped object) is assigned to the
               element's `geocoder` property in main.ts. Typeahead suggestions
               are debounced, keyboard-navigable (ArrowUp/ArrowDown/Enter/
               Escape), and a selection pans/zooms the shared map controller. -->
          <honua-search
            id="place-search"
            for="ops-map"
            label="Find places"
            placeholder="Find places"
            zoom="14"
            debounce="200"
          ></honua-search>
          <honua-basemap-switcher for="ops-map" label="Basemaps" value="light"></honua-basemap-switcher>
          <!-- Controls-entry legend, explicitly claimed via
               register-controls-legend.ts's defineHonuaLegend() call (issue
               #679): explicit incident entries plus a section derived from
               the zoning layer's match expression. -->
          <honua-legend
            for="ops-map"
            heading="Legend"
            layer="zoning-districts"
            layer-title="Zoning districts"
            follow-layer-visibility
            auto-refresh
          ></honua-legend>
          <honua-bookmarks
            for="ops-map"
            bookmarks='[{"id":"harbor","label":"Harbor","viewport":{"center":[-157.87,21.31],"zoom":13}},{"id":"kakaako","label":"Kakaako","viewport":{"center":[-157.86,21.29],"zoom":13}}]'
          ></honua-bookmarks>
          <honua-locate-control for="ops-map" latitude="21.3" longitude="-157.86" zoom="12"></honua-locate-control>
          <honua-layer-list for="ops-map"></honua-layer-list>
        </div>
      </section>
      <section class="bottom-panel">
        <honua-feature-table
          for="ops-map"
          source="incidents"
          fields="name,status,priority"
          page-size="6"
          label="Incident features"
        ></honua-feature-table>
        <honua-editor for="ops-map" source="incidents" label="Incident editor"></honua-editor>
        <honua-chart for="ops-map" label="Priority summary"></honua-chart>
        <honua-measure-control for="ops-map"></honua-measure-control>
        <!-- Survival-tier measurement (issue #493): no drawing provider needed.
             Click the map to add vertices, double-click (or Finish) to complete,
             Escape (or Cancel) to discard; distance/area come from the
             @honua/geometry geodesic ops. -->
        <honua-measurement for="ops-map" label="Measure (built-in)"></honua-measurement>
        <honua-sketch-control for="ops-map"></honua-sketch-control>
        <honua-print-export for="ops-map" title="Response map"></honua-print-export>
        <honua-map-status for="ops-map" attribution="Honua demo data"></honua-map-status>
        <honua-action-panel
          for="ops-map"
          actions='[{"id":"refresh","label":"Refresh sources"},{"id":"handoff","label":"Open handoff"}]'
        ></honua-action-panel>
      </section>
      <output id="event-log" aria-live="polite"></output>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honua STAC Imagery Catalog Browser</title>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>Honua STAC Imagery Catalog Browser</h1>
        <p>Fixture-backed catalog search for imagery discovery, footprint review, and supported preview layers.</p>
        <div class="status-strip">
          <span id="mode-state"></span>
          <span id="cache-state"></span>
          <span id="capability-state"></span>
          <span id="page-state"></span>
        </div>
      </header>
      <main>
        <aside class="stack">
          <section class="panel">
            <h2>Search</h2>
            <form id="search-form">
              <div class="filter-grid">
                <label>
                  Collection
                  <select id="collection">
                    <option value="sentinel-2-l2a">Sentinel-2 L2A</option>
                    <option value="landsat-9-l2">Landsat 9 L2</option>
                    <option value="all">All collections</option>
                  </select>
                </label>
                <label>
                  Asset type
                  <select id="asset-type">
                    <option value="image/png">Renderable PNG tiles</option>
                    <option value="image/jpeg">Thumbnail</option>
                    <option value="image/tiff; application=geotiff">COG raster</option>
                    <option value="any">Any asset</option>
                  </select>
                </label>
                <label>
                  Start
                  <input id="start-date" type="date" />
                </label>
                <label>
                  End
                  <input id="end-date" type="date" />
                </label>
                <label class="wide">
                  AOI xmin,ymin,xmax,ymax
                  <input id="aoi" />
                </label>
                <label class="wide">
                  Max cloud cover <strong id="cloud-value"></strong>
                  <input id="cloud-cover" type="range" min="0" max="100" step="1" />
                </label>
              </div>
              <button type="submit">Search Catalog</button>
            </form>
          </section>
          <section class="panel">
            <h2>Collection Metadata Cache</h2>
            <ul id="collection-list"></ul>
          </section>
        </aside>
        <section class="stack">
          <section class="panel">
            <h2>Results</h2>
            <ul id="result-list"></ul>
            <div class="button-row">
              <button id="load-next" type="button">Load Next Page</button>
              <button id="cancel-pagination" class="secondary" type="button">Cancel Pagination</button>
            </div>
          </section>
          <section class="panel">
            <h2>Footprint Preview</h2>
            <div id="footprint-map"></div>
          </section>
        </section>
        <aside class="stack">
          <section class="panel">
            <h2>Item Metadata</h2>
            <div id="item-metadata"></div>
          </section>
          <section class="panel">
            <h2>Assets</h2>
            <ul id="asset-list"></ul>
            <p id="preview-state"></p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

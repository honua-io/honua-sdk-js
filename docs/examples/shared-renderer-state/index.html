<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honua shared renderer state</title>
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css" />
    <style>
      html, body { height: 100%; margin: 0; background: #07111f; color: #e8f1ff; font: 14px system-ui; }
      main { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      header { padding: 12px 16px; }
      #renderers { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      #maplibre, #cesium { min-height: 360px; }
    </style>
    <script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
  </head>
  <body>
    <main>
      <header><strong>One Honua application state</strong> · MapLibre 2D + Cesium 3D</header>
      <section id="renderers"><div id="maplibre"></div><div id="cesium"></div></section>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>

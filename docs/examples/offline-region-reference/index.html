<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honua offline region reference</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10243a;
      }
      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 2rem;
        border-radius: 1rem;
        background: #f7fafc;
        color: #10243a;
        box-shadow: 0 1rem 3rem #07132099;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.5rem 1rem;
      }
      dt {
        font-weight: 700;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      [data-state="unavailable"] {
        color: #9b1c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Honua SDK browser reference</p>
      <h1>Persistent offline region</h1>
      <p id="status" role="status">Starting…</p>
      <dl>
        <dt>Payload</dt>
        <dd id="payload">—</dd>
        <dt>Freshness</dt>
        <dd id="freshness">—</dd>
        <dt>Provenance</dt>
        <dd id="provenance">—</dd>
        <dt>Attribution</dt>
        <dd id="attribution">—</dd>
      </dl>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honua deck.gl lifecycle browser benchmark</title>
    <style>
      html,
      body,
      #deck-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #081c24;
      }
      #status {
        position: fixed;
        z-index: 2;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        color: #fff;
        background: rgb(8 28 36 / 85%);
        font: 14px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="deck-canvas" aria-label="Honua deck.gl lifecycle probe"></canvas>
    <output id="status" aria-live="polite">Idle</output>
    <script type="module" src="/lifecycle-main.ts"></script>
  </body>
</html>
